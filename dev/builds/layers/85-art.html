<style id="ly-art">
/* =====================================================================
   85-art: art direction pass (prefix ar-)
   1 startup stage + quiet pair   2a rank lockup   2b course cards
   2c closing wall   2d activity posters   3 colour harmony
   ===================================================================== */
:root{--ar-ink:#1D1712;--ar-cream:#FFF6E8;--ar-or:#F2A65E;--ar-or-d:#A8551A;--ar-warm:#FBE9CF;--ar-line:rgba(29,23,18,.10);
  --ar-out:cubic-bezier(.23,1,.32,1)}

/* ---------- 1. "สิ่งที่ Hamster Hub สร้าง" ---------- */
html body .hbx .oc-in{display:grid;grid-template-columns:minmax(0,1fr);column-gap:clamp(32px,4.4vw,72px)}
html body .hbx .oc-hd,html body .hbx .oc-r.oc-big{grid-column:1/-1}

/* the stage */
html body .hbx .oc-r.oc-big{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:0!important;align-items:start!important;
  position:relative;isolation:isolate;background:var(--ar-ink);color:var(--ar-cream);
  border-radius:clamp(24px,3vw,40px);padding:clamp(28px,5vw,72px) clamp(20px,4.8vw,72px) clamp(28px,4.4vw,60px);
  margin-top:clamp(36px,4.6vw,60px)!important}
html body .hbx .oc-big .oc-t{display:contents}
html body .hbx .oc-big .oc-k{order:1;justify-self:start;background:none!important;color:var(--ar-or)!important;padding:0!important;border-radius:0!important;
  font:600 clamp(1rem,1.2vw,1.12rem)/1.3 var(--display)!important}
html body .hbx .oc-big h3{order:2;color:var(--ar-cream)!important;font:700 clamp(2.05rem,4.2vw,3.7rem)/1.14 var(--display)!important;letter-spacing:-.015em;margin:14px 0 0!important;max-width:11.5em;text-wrap:balance}
html body .hbx .oc-big .oc-t>p{order:3;color:rgba(255,246,232,.74)!important;font-size:clamp(1rem,1.15vw,1.1rem)!important;line-height:1.8!important;max-width:54ch!important;margin:18px 0 0!important}
html body .hbx .oc-big .oc-m{order:4;margin-top:28px}
html body .hbx .oc-big .oc-st{order:5}
html body .hbx .oc-big .ar-led{order:6}
html body .hbx .oc-big .oc-lk{order:7;justify-self:start;margin-top:26px!important}

/* media: three real screens */
html body .hbx .oc-big .oc-m.oc-biz{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;grid-template-rows:auto auto!important;gap:clamp(8px,1vw,14px)!important;
  aspect-ratio:auto!important;background:none!important;box-shadow:none!important;border-radius:0!important;overflow:visible!important}
html body .hbx .oc-big .oc-biz video{grid-column:1/-1!important;grid-row:1!important;width:100%;height:auto!important;aspect-ratio:16/10;object-fit:cover;border-radius:clamp(14px,1.5vw,20px);background:#14100c;
  box-shadow:0 0 0 1px rgba(255,246,232,.10),0 30px 60px -30px rgba(0,0,0,.8)}
html body .hbx .oc-big .oc-biz img{grid-row:2!important;width:100%;height:auto!important;aspect-ratio:5/4;object-fit:cover;border-radius:clamp(12px,1.3vw,16px);transform:none!important;
  box-shadow:0 0 0 1px rgba(255,246,232,.10),0 24px 44px -28px rgba(0,0,0,.8)}
html body .hbx .oc-big .oc-biz img:nth-of-type(1){grid-column:1}
html body .hbx .oc-big .oc-biz img:nth-of-type(2){grid-column:2}
html body .hbx .oc-big .oc-m>.ar-cap{position:relative!important;inset:auto!important;width:auto!important;height:auto!important;align-self:end!important;justify-self:start!important;margin:0 0 10px 10px!important;z-index:2;white-space:nowrap;pointer-events:none;font:600 .8rem/1 var(--display);color:var(--ar-cream);
  background:rgba(20,16,12,.78);padding:7px 10px;border-radius:8px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ar-cap.c1{grid-area:1/1/2/3}.ar-cap.c2{grid-area:2/1}.ar-cap.c3{grid-area:2/2}

/* the journey: four steps on one line, each with one plain line saying what the student does */
html body .hbx .oc-big .oc-st{list-style:none;display:grid!important;grid-template-columns:minmax(0,1fr);gap:0!important;position:relative;
  margin:clamp(34px,4vw,52px) 0 0!important;padding:0!important;counter-reset:st}
html body .hbx .oc-big .oc-st li{counter-increment:st;position:relative;display:block!important;background:none!important;box-shadow:none!important;border-radius:0!important;
  padding:5px 0 22px 50px!important;min-height:34px;font:600 clamp(1.05rem,1.25vw,1.2rem)/1.3 var(--display)!important;color:var(--ar-cream)!important}
html body .hbx .oc-big .oc-st li:last-of-type{padding-bottom:0!important;color:var(--ar-or)!important}
html body .hbx .oc-big .oc-st li::before{content:counter(st)!important;position:absolute!important;left:0;top:0;z-index:1;display:grid!important;place-items:center;box-sizing:border-box;
  width:34px!important;height:34px!important;border-radius:50%!important;background:var(--ar-ink)!important;color:var(--ar-or)!important;border:1.5px solid var(--ar-or);
  font:700 .92rem/1 var(--display)!important}
html body .hbx .oc-big .oc-st li:last-of-type::before{background:var(--ar-or)!important;color:var(--ar-ink)!important}
.ar-sx{display:block;margin-top:6px;font:400 .95rem/1.55 var(--body,inherit);color:rgba(255,246,232,.78);text-wrap:pretty}
/* phone: a straight vertical line between the numbers */
html body .hbx .oc-big .oc-st li::after{content:"";position:absolute;left:16px;top:38px;bottom:4px;width:2px;background:rgba(242,166,94,.5)}
html body .hbx .oc-big .oc-st li:last-of-type::after{display:none}
.ar-path{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0;display:none}
.ar-path path{fill:none;stroke-width:2;stroke-linecap:round}
.ar-path .b{stroke:rgba(242,166,94,.5)}
.ar-path .f{display:none}

/* the ledger: who uses the three startups (always visible) */
.ar-led{list-style:none;margin:clamp(30px,3.4vw,44px) 0 0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.ar-led li{display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:2px;padding:16px 0;border-top:1px solid rgba(255,246,232,.16)}
.ar-led li.ar-led-h{font:600 1rem/1.45 var(--display);color:rgba(255,246,232,.86);padding-bottom:4px}
.ar-led small{font:600 .88rem/1.3 var(--display);color:var(--ar-or)}
.ar-led b{font:700 clamp(1.4rem,2.1vw,1.9rem)/1.2 var(--display);color:var(--ar-cream);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.ar-led span{font-size:.95rem;line-height:1.5;color:rgba(255,246,232,.74)}

@media (min-width:700px){
  /* one 4-column grid for the steps and the ledger */
  .ar-led,html body .hbx .oc-big .oc-st{grid-template-columns:repeat(4,minmax(0,1fr))!important;column-gap:clamp(18px,2.4vw,36px)!important}
  .ar-led li{padding-bottom:0}
  .ar-led li.ar-led-h{padding-right:8px}
  html body .hbx .oc-big .oc-st li{padding:48px 0 0 0!important}
  html body .hbx .oc-big .oc-st li::after{display:none}
  .ar-path{display:block}
}
@media (min-width:1100px){
  html body .hbx .oc-in{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  html body .hbx .oc-r.oc-big{grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr)!important;column-gap:clamp(40px,4.6vw,76px)!important;grid-template-rows:1fr auto auto auto 1fr auto auto}
  html body .hbx .oc-big .oc-k{grid-column:1;grid-row:2;margin-top:0}
  html body .hbx .oc-big h3{grid-column:1;grid-row:3}
  html body .hbx .oc-big .oc-t>p{grid-column:1;grid-row:4}
  html body .hbx .oc-big .oc-lk{grid-column:1;grid-row:5;justify-self:start;align-self:start;margin:28px 0 0!important}
  html body .hbx .oc-big .oc-m{grid-column:2;grid-row:1/6;margin-top:0;align-self:center}
  html body .hbx .oc-big .oc-biz img{aspect-ratio:16/9}
  html body .hbx .oc-big .oc-st{grid-column:1/-1;grid-row:6}
  html body .hbx .oc-big .ar-led{grid-column:1/-1;grid-row:7}
}

/* the quiet pair under the stage */
html body .hbx .oc-r:not(.oc-big){display:flex!important;flex-direction:column;gap:0!important;align-items:stretch!important;margin-top:clamp(44px,5.4vw,80px)!important}
html body .hbx .oc-r:not(.oc-big) .oc-m{order:0!important;aspect-ratio:16/10!important;border-radius:clamp(16px,1.8vw,22px)!important;background:#14100c!important;
  box-shadow:0 0 0 1px var(--ar-line),0 26px 44px -34px rgba(60,35,10,.5)!important}
html body .hbx .oc-r:not(.oc-big) .oc-t{padding-top:22px;display:flex;flex-direction:column;align-items:flex-start;flex:1}
html body .hbx .oc-r:not(.oc-big) .oc-k{background:none!important;padding:0!important;border-radius:0!important;color:var(--ar-or-d)!important;font:600 1rem/1.3 var(--display)!important}
html body .hbx .oc-r:not(.oc-big) h3{font:700 clamp(1.5rem,2.3vw,2rem)/1.22 var(--display)!important;color:var(--ar-ink)!important;margin:8px 0 10px!important;text-wrap:balance}
html body .hbx .oc-r:not(.oc-big) .oc-t>p{font-size:1.02rem!important;line-height:1.75!important;color:rgba(29,23,18,.74)!important;max-width:56ch!important;margin-bottom:22px!important}
html body .hbx .oc-r:not(.oc-big) .oc-lk,html body .hbx .oc-r:not(.oc-big) .oc-play{margin-top:auto!important;background:transparent!important;color:var(--ar-ink)!important;
  box-shadow:inset 0 0 0 1.5px rgba(29,23,18,.82)!important;border-radius:999px!important;padding:12px 20px!important;font:600 .98rem var(--display)!important;
  transition:background .2s var(--ar-out),color .2s var(--ar-out),transform .15s var(--ar-out)!important}
html body .hbx .oc-r:not(.oc-big) .oc-play i{border-left-color:var(--ar-ink)!important;transition:border-color .2s}
@media (hover:hover){
  html body .hbx .oc-r:not(.oc-big) .oc-lk:hover,html body .hbx .oc-r:not(.oc-big) .oc-play:hover{background:var(--ar-ink)!important;color:var(--ar-cream)!important;transform:none!important}
  html body .hbx .oc-r:not(.oc-big) .oc-play:hover i{border-left-color:var(--ar-cream)!important}
}
html body .hbx .oc-r:not(.oc-big) .oc-lk:active,html body .hbx .oc-r:not(.oc-big) .oc-play:active{transform:scale(.97)!important}

/* ---------- 2a. Port Express: rank lockup ---------- */
html body [data-view] .fx-main .rc.ar-rk{display:inline-flex!important;align-items:center;gap:12px;align-self:flex-start;background:none!important;border:0!important;border-radius:0!important;
  padding:0!important;box-shadow:none!important;text-shadow:none!important;color:#FFE6C4!important;font:600 .84rem/1.3 var(--display)!important;letter-spacing:.01em}
html body [data-view] .fx-main .rc.ar-rk>svg,html body [data-view] .fx-main .rc.ar-rk>.pxe-medal{display:none!important}
.ar-rk-t{text-align:right;opacity:.92}
.ar-rk-n{font:700 2.9rem/.78 var(--display);padding:0 0 0 13px;border-left:1px solid rgba(255,230,196,.42);color:#FFE6C4;font-variant-numeric:lining-nums}

/* ---------- 2b. Hamstarter / National Project ---------- */
html body [data-view] .fx-row .fx-s:nth-child(n){display:grid!important;grid-template-columns:minmax(0,41%) minmax(0,1fr)!important;grid-template-rows:auto auto auto 1fr auto auto;gap:0!important;
  padding:0!important;align-items:stretch!important;overflow:hidden;background:#fff!important;border:1px solid rgba(29,23,18,.09)!important;border-radius:26px!important;
  box-shadow:0 1px 0 rgba(29,23,18,.03),0 26px 44px -34px rgba(60,35,10,.5)!important;
  transition:transform .2s var(--ar-out),box-shadow .2s var(--ar-out)!important}
html body [data-view] .fx-row .fx-s .fx-si{grid-column:1;grid-row:1/6;aspect-ratio:4/5!important;height:100%!important;width:100%;align-self:stretch!important;border-radius:0!important;box-shadow:none!important;background:#2a211a!important}
html body [data-view] .fx-row .fx-s .fx-si img{object-position:50% 50%!important;transition:transform .22s var(--ar-out)!important}
html body [data-view] .fx-row .fx-s .fx-si img[src*="sc-lyno"]{object-position:88% 50%!important}
html body [data-view] .fx-row .fx-s .fx-sb{display:contents!important}
html body [data-view] .fx-row .fx-s .fx-sb>small{grid-column:2;grid-row:2;padding:10px clamp(18px,2vw,28px) 0;color:var(--ar-or-d)!important;font:600 .9rem/1.4 var(--display)!important}
html body [data-view] .fx-row .fx-s .fx-sb>b{grid-column:2;grid-row:3;padding:6px clamp(18px,2vw,28px) 0;font:700 clamp(1.5rem,2vw,1.85rem)/1.15 var(--display)!important;color:var(--ar-ink)!important;letter-spacing:-.01em}
html body [data-view] .fx-row .fx-s .fx-sp{grid-column:2;grid-row:4;padding:10px clamp(18px,2vw,28px) 0;color:rgba(29,23,18,.76)!important;line-height:1.65!important;font-size:1rem}
html body [data-view] .fx-row .fx-s .fx-go{grid-column:2;grid-row:5;justify-self:start;align-self:end;margin:18px clamp(18px,2vw,28px) clamp(20px,2.2vw,28px)!important;
  background:transparent!important;color:var(--ar-ink)!important;box-shadow:inset 0 0 0 1.5px rgba(29,23,18,.82)!important;border-radius:999px!important;padding:11px 18px!important;
  font:600 .92rem var(--display)!important;transition:background .2s var(--ar-out),color .2s var(--ar-out)!important;transform:none!important}
html body [data-view] .fx-row .fx-s .fx-pr{grid-column:1/-1;grid-row:6;margin:0!important;padding:13px clamp(16px,1.8vw,24px)!important;background:#FBF4E8;border-top:1px solid rgba(29,23,18,.07);
  color:rgba(29,23,18,.8)!important;font-size:.9rem!important;line-height:1.45!important;font-weight:500}
html body [data-view] .fx-row .fx-s .fx-pr .ft-av img{border-color:#FBF4E8!important;width:32px;height:32px}
html body [data-view] .fx-row .fx-s .rc.rc-s{grid-column:2;grid-row:1;justify-self:start;margin:clamp(20px,2.2vw,28px) clamp(18px,2vw,28px) 0!important;padding:0!important;background:none!important;border-radius:0!important;box-shadow:none!important;
  color:rgba(29,23,18,.55)!important;font:600 .8rem/1.2 var(--display)!important;display:inline-flex!important;align-items:center;gap:8px}
html body [data-view] .fx-row .fx-s .rc.rc-s{display:none!important}
html body [data-view] .fx-row .fx-s .fx-sb>small{padding-top:clamp(20px,2.2vw,28px)!important}
html body [data-view] .fx-row .fx-s .rc.rc-s svg{display:none!important}
@media (hover:hover){
  html body [data-view] .fx-row .fx-s:hover{transform:translateY(-3px)!important;box-shadow:0 1px 0 rgba(29,23,18,.03),0 34px 50px -34px rgba(60,35,10,.6)!important}
  html body [data-view] .fx-row .fx-s:hover .fx-go{background:var(--ar-ink)!important;color:var(--ar-cream)!important}
  html body [data-view] .fx-row .fx-s:hover .fx-si img{transform:scale(1.035)!important}
}
html body [data-view] .fx-row .fx-s:active{transform:scale(.99)!important}
@media (max-width:640px){
  /* phone: the whole poster stays visible as a small picture beside the title */
  html body [data-view] .fx-row .fx-s:nth-child(n){grid-template-columns:104px minmax(0,1fr)!important;grid-template-rows:auto auto 1fr auto auto auto}
  html body [data-view] .fx-row .fx-s .fx-si{grid-row:1/4;height:auto!important;align-self:start!important;margin:16px 0 0 16px;width:auto;border-radius:12px!important;overflow:hidden}
  html body [data-view] .fx-row .fx-s .rc.rc-s{margin:18px 16px 0 14px!important}
  html body [data-view] .fx-row .fx-s .fx-sb>small{padding:18px 16px 0 14px!important;font-size:.84rem!important}
  html body [data-view] .fx-row .fx-s .fx-sb>b{padding:4px 16px 0 14px}
  html body [data-view] .fx-row .fx-s .fx-sp{grid-column:1/-1;padding:14px 18px 0;font-size:.96rem}
  html body [data-view] .fx-row .fx-s .fx-go{grid-column:1/-1;margin:16px 18px 18px!important}
}

/* narrower rows (courses page): a wider photo column so the 4:5 poster is not cropped */
html body [data-view] .fx-row{container-type:inline-size}
@container (min-width:700px) and (max-width:1180px){
  html body [data-view] .fx-row .fx-s:nth-child(n){grid-template-columns:minmax(0,47%) minmax(0,1fr)!important}
  html body [data-view] .fx-row .fx-s .fx-sp{font-size:.95rem;line-height:1.55!important}
  html body [data-view] .fx-row .fx-s .fx-sb>b{font-size:1.5rem!important}
}

/* ---------- 2c. closing panel: a wall with one empty frame ---------- */
html body .end-in{display:grid!important;grid-template-columns:minmax(0,1fr);row-gap:0;text-align:left!important;background:var(--ar-warm)!important;
  padding:clamp(30px,5vw,76px) clamp(20px,5vw,80px)!important;border-radius:clamp(26px,3.2vw,44px)!important;overflow:hidden}
html body .end-in>.kn-sea{display:none!important}
html body .end-in h2{color:var(--ar-ink)!important;font:700 clamp(1.9rem,3.7vw,3.2rem)/1.2 var(--display)!important;letter-spacing:-.015em;max-width:11em;margin:0!important;text-wrap:balance}
html body .end-in p{color:rgba(29,23,18,.74)!important;font-size:clamp(1rem,1.2vw,1.12rem)!important;line-height:1.7;max-width:34ch;margin:16px 0 0!important}
html body .end-in .end-b{justify-content:flex-start!important;margin-top:26px!important;gap:10px}
html body .end-in .e1{background:var(--ar-ink)!important;color:var(--ar-cream)!important;box-shadow:none!important}
html body .end-in>.ar-wall{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(7px,.9vw,12px);margin-top:34px;position:relative;z-index:1}
.ar-wall>*{position:relative;aspect-ratio:16/9.6;border-radius:clamp(7px,.8vw,11px);overflow:hidden}
.ar-tile{display:block;background:#2a211a;box-shadow:0 1px 0 rgba(255,255,255,.5),0 14px 22px -16px rgba(60,35,10,.7);transition:transform .2s var(--ar-out),box-shadow .2s var(--ar-out)}
@media (hover:hover){.ar-tile:hover{transform:translateY(-3px);box-shadow:0 1px 0 rgba(255,255,255,.5),0 20px 26px -16px rgba(60,35,10,.8)}}
.ar-tile:active{transform:scale(.98)}
.ar-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity 1s ease}
.ar-tile img.on{opacity:1}
.ar-tile:nth-child(n+10){display:none}
.ar-mine{grid-column:2;grid-row:2;display:grid;place-items:center;text-align:center;padding:6px;box-sizing:border-box;
  background:#FFF8EC;font:600 clamp(.68rem,1.05vw,.9rem)/1.3 var(--display);color:var(--ar-or-d)}
.ar-mine svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ar-mine rect{fill:none;stroke:var(--ar-or-d);stroke-width:1.6;stroke-dasharray:7 6;vector-effect:non-scaling-stroke}
.ar-mine span{position:relative}
@media (prefers-reduced-motion:no-preference){.ar-wall.run .ar-mine rect{animation:ar-march 1.6s linear infinite}}
@keyframes ar-march{to{stroke-dashoffset:-13}}
@media (min-width:960px){
  html body .end-in{grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);grid-template-rows:1fr auto 1fr;column-gap:clamp(36px,5vw,84px)}
  html body .end-in h2{grid-column:1;grid-row:1;align-self:end}
  html body .end-in p{grid-column:1;grid-row:2}
  html body .end-in .end-b{grid-column:1;grid-row:3;align-self:start}
  html body .end-in>.ar-wall{grid-column:2;grid-row:1/4;margin-top:0;grid-template-columns:repeat(4,minmax(0,1fr));align-self:center;padding-bottom:18px}
  .ar-tile:nth-child(n+10){display:block}
  .ar-wall>*:nth-child(even){top:18px}
}

/* ---------- 2d. activity cards without a photo: type posters ---------- */
html body [data-view="activity"] .avc-m:has(>.ar-po){container-type:inline-size;background:#fff}
html body [data-view="activity"] .avc-ty.ar-po{display:block!important;position:relative!important;height:100%!important;padding:0!important;overflow:hidden;background:var(--po-bg)!important;color:var(--po-fg)}
html body [data-view="activity"] .avc-ty.ar-po::before,html body [data-view="activity"] .avc-ty.ar-po>img,html body [data-view="activity"] .avc-ty.ar-po>.hb{display:none!important}
/* each card gets its own colour and pattern; the title lives only under the poster */
.ar-po{--po-bg:#FAE7CB;--po-fg:#1D1712;--po-ac:#C2661C;--po-ln:rgba(140,80,24,.26)}
.ar-po.p-sand{--po-bg:#FAE7CB;--po-fg:#1D1712;--po-ac:#B0581A;--po-ln:rgba(140,80,24,.26)}
.ar-po.p-mint{--po-bg:#D7F0E6;--po-fg:#123D31;--po-ac:#1D6E56;--po-ln:rgba(31,122,96,.28)}
.ar-po.p-sky{--po-bg:#DCEEFB;--po-fg:#13324A;--po-ac:#1C639A;--po-ln:rgba(31,111,168,.26)}
.ar-po.p-lilac{--po-bg:#E9E3FF;--po-fg:#2A2152;--po-ac:#5640BA;--po-ln:rgba(91,69,194,.26)}
.ar-po.p-pink{--po-bg:#FFE3EC;--po-fg:#4A1A2C;--po-ac:#A8335F;--po-ln:rgba(178,58,106,.24)}
.ar-po.p-ink{--po-bg:#1D1712;--po-fg:#FFF6E8;--po-ac:#F2A65E;--po-ln:rgba(255,246,232,.14)}
.ar-po.p-navy{--po-bg:#1E2A3D;--po-fg:#F2F6FF;--po-ac:#8CC8FF;--po-ln:rgba(242,246,255,.14)}
.ar-po.p-orange{--po-bg:#F2A65E;--po-fg:#1D1712;--po-ac:#1D1712;--po-ln:rgba(29,23,18,.24)}
.ar-po.p-peach{--po-bg:#FFD3B0;--po-fg:#1D1712;--po-ac:#8E3F0E;--po-ln:rgba(142,63,14,.24)}
.ar-po-g{position:absolute;inset:0;width:100%;height:100%;display:block}
.ar-po-g *{fill:none;stroke:var(--po-ln);stroke-width:1;vector-effect:non-scaling-stroke}
.ar-po-g .a{stroke:var(--po-ac);opacity:.75}
.ar-po-g .d{fill:var(--po-ac);stroke:none}
.ar-po-g .dl{fill:var(--po-ln);stroke:none}
html body [data-view="activity"] .avc-ty.ar-po>b{display:none!important}
.ar-po-d{position:absolute;left:7.5%;bottom:10%;z-index:1;display:flex;align-items:baseline;gap:2.6cqw}
.ar-po-d i{font:700 30cqw/.74 var(--display);font-style:normal;color:var(--po-ac);letter-spacing:-.03em;font-variant-numeric:lining-nums}
.ar-po-d u{text-decoration:none;font:600 5.2cqw/1 var(--display);color:var(--po-fg);opacity:.85}
@supports not (font-size:1cqw){.ar-po-d i{font-size:5.4rem}.ar-po-d u{font-size:1rem}}

/* ---------- 3. colour harmony (home + shared) ---------- */
/* the softened orange drives the light and deep steps too */
:root{--or-l:#FFDDB3!important;--or-d:#C97A2E!important}
/* bell buttons: quiet on every card; only the open course keeps a filled button */
html body [data-view="home"] .qv:not(.on) .qv-btn{background:#FFF3E3!important;color:var(--ar-ink)!important;box-shadow:inset 0 0 0 1px rgba(29,23,18,.10)!important;
  transition:background .2s var(--ar-out),color .2s var(--ar-out),transform .2s var(--ar-out)!important}
@media (hover:hover){html body [data-view="home"] .qv:not(.on):hover .qv-btn{background:var(--ar-ink)!important;color:var(--ar-cream)!important;transform:none!important}}
/* "recommended" tag on rail cards: white chip, no gold */
html body [data-view] .qv-rc{background:rgba(255,255,255,.95)!important;color:var(--ar-ink)!important;font:600 .74rem/1 var(--display)!important;padding:6px 9px!important;border-radius:8px!important;
  box-shadow:0 4px 12px -6px rgba(0,0,0,.5)!important}
html body [data-view] .qv-rc svg{display:none!important}
/* rail position bar, back-to-top, the seniors number: one flat orange / ink instead of two-tone hot oranges */
html body .ak-dots button.on{background:var(--ar-ink)!important}
html body .to-top,html body .to-top:hover{background:var(--ar-ink)!important;color:var(--ar-cream)!important;box-shadow:0 10px 22px -10px rgba(29,23,18,.6)!important}
html body [data-view="home"] .mc-h h2>span{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;-webkit-text-fill-color:currentColor!important;color:#E8964A!important;text-shadow:none!important;filter:none!important}
html body [data-view="home"] .mc-cap small{color:var(--ar-or-d)!important}
html body .end-in>.ar-wall{background:none!important}
</style>
<script>
(function(){
  var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}

  /* ---------- 1. startup stage ---------- */
  function stage(){
    var big=document.querySelector('.hbx .oc-r.oc-big');if(!big||big.getAttribute('data-ar'))return;big.setAttribute('data-ar','1');
    var m=big.querySelector('.oc-m'),ol=big.querySelector('.oc-st'),t=big.querySelector('.oc-t');
    if(m){[['c1','PHC Map เกมสอนเขียน Python'],['c2','Hamster Quest'],['c3','หน้าเควสต์']].forEach(function(c){var s=el('span','ar-cap '+c[0]);s.textContent=c[1];s.setAttribute('aria-hidden','true');m.appendChild(s)})}
    if(ol&&t){
      /* one plain line under each step: what the student does there */
      var SX=['น้องคิดว่าจะทำอะไร ให้ใครใช้','น้องลงมือเขียนโปรแกรมเอง','ให้คนจริงลองใช้ แล้วน้องแก้ให้ดีขึ้น','มีคนซื้อหรือใช้ผลงานของน้องจริง'];
      [].forEach.call(ol.querySelectorAll('li'),function(li,i){if(SX[i]&&!li.querySelector('.ar-sx')){var x=el('span','ar-sx');x.textContent=SX[i];li.appendChild(x)}});
      var led=el('ul','ar-led',
        '<li class="ar-led-h">ผลงานของน้องที่มีคนใช้จริงแล้ว</li>'+
        '<li><small>Mr. City</small><b>สวนสัตว์สงขลา</b><span>ซื้อไปใช้แล้ว</span></li>'+
        '<li><small>PHC Map</small><b>1,000+ คน</b><span>เรียนเขียน Python จากเกมนี้แล้ว</span></li>'+
        '<li><small>Hamster Quest</small><b>มหาวิทยาลัย</b><span>กำลังเตรียมนำไปใช้</span></li>');
      ol.parentNode.insertBefore(led,ol.nextSibling);
      /* the climbing path */
      var NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg');svg.setAttribute('class','ar-path');svg.setAttribute('aria-hidden','true');
      var pb=document.createElementNS(NS,'path'),pf=document.createElementNS(NS,'path');pb.setAttribute('class','b');pf.setAttribute('class','f');pf.setAttribute('pathLength','1');
      svg.appendChild(pb);svg.appendChild(pf);ol.insertBefore(svg,ol.firstChild);
      var lastD='';
      function draw(){
        var lis=ol.querySelectorAll('li');if(lis.length<2||!ol.clientWidth)return;
        var d='',prev=null;
        [].forEach.call(lis,function(li){var x=li.offsetLeft+17,y=li.offsetTop+17;
          if(!prev)d='M'+x+' '+y;else{var h=(x-prev.x)*.5;d+=' C'+(prev.x+h)+' '+prev.y+' '+(x-h)+' '+y+' '+x+' '+y}prev={x:x,y:y}});
        if(d!==lastD){lastD=d;pb.setAttribute('d',d);pf.setAttribute('d',d)}
      }
      draw();
      if('ResizeObserver' in window)new ResizeObserver(draw).observe(ol);else addEventListener('resize',draw);
      if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
    }
    /* no reveal: the steps and the ledger are always readable */
  }

  /* ---------- 2a. rank lockup ---------- */
  function rank(){
    [].forEach.call(document.querySelectorAll('.fx-main .rc:not(.ar-rk)'),function(rc){
      [].slice.call(rc.childNodes).forEach(function(n){if(n.nodeType===3)rc.removeChild(n)});
      rc.setAttribute('role','img');rc.setAttribute('aria-label','คอร์สแนะนำอันดับ 1');
      rc.appendChild(el('span','ar-rk-t','คอร์สแนะนำ<br>อันดับ'));rc.appendChild(el('span','ar-rk-n','1'));
      rc.classList.add('ar-rk');
    });
  }

  /* ---------- 2c. closing wall ---------- */
  var COVERS=['ar-melody-duel','work-phi-krahang','ar-heat-thieves','ar-a-picturesque-breakfast','ar-the-collector','ar-nampun','work-eugation-strike','ar-night-fear','ar-gamejam-x','ar-bidet-blaster','ar-woven-citadel',
    'work-stressstrike','ar-ecoeats-mas','work-midnight-at-roadside','ar-endlessly','ar-ghostly-prisoner-demo','work-hot-hot-hot','ar-together-forever'];
  function wall(){
    var host=document.querySelector('[data-view="home"] .end-in');if(!host||host.querySelector('.ar-wall'))return;
    var w=el('div','ar-wall');w.setAttribute('role','group');w.setAttribute('aria-label','เกมที่น้องๆ สร้าง กดเพื่อดูผลงาน');
    var tiles=[],shown=[];
    for(var i=0;i<12;i++){var t=el('a','ar-tile','<img class="on" alt="" loading="lazy" decoding="async" src="img/'+COVERS[i]+'.webp"><img alt="" decoding="async">');
      t.href='#works';t.setAttribute('data-pane','hof');t.setAttribute('data-cover',COVERS[i]);label(t,COVERS[i]);w.appendChild(t);tiles.push(t);shown.push(COVERS[i])}
    /* a cover opens that game in the works page: Hall of Fame games play in the feed, the others open their clip */
    w.addEventListener('click',function(e){var t=e.target.closest('.ar-tile');if(!t)return;var c=t.getAttribute('data-cover');
      setTimeout(function open(){var v=document.querySelector('[data-view="works"]');if(!v||!v.offsetParent)return;
        var im=document.querySelector('#vgrid img[src$="'+c+'.webp"],#arcG img[src$="'+c+'.webp"]'),b=im&&im.closest('.vc,.ac');
        if(b){b.scrollIntoView({block:'center'});b.click()}},700)});
    function label(t,c){var im=document.querySelector('#vgrid img[src$="'+c+'.webp"],#arcG img[src$="'+c+'.webp"]'),card=im&&im.closest('.vc,.ac'),nm=card&&card.querySelector('b,h3');
      t.setAttribute('aria-label','ดูผลงาน '+(nm?nm.textContent.trim():'ของน้อง'))}
    var mine=el('div','ar-mine','<svg aria-hidden="true"><rect x="1" y="1" rx="9" ry="9" style="width:calc(100% - 2px);height:calc(100% - 2px)"/></svg><span>ที่ว่างนี้<br>รอผลงานของน้อง</span>');
    host.appendChild(w);
    if(rm)return;
    var timer=0,last=-1;
    function swap(){
      var vis=tiles.filter(function(t){return t.offsetParent!==null});if(!vis.length)return;
      var k;do{k=Math.floor(Math.random()*vis.length)}while(vis.length>1&&k===last);last=k;
      var t=vis[k],ti=tiles.indexOf(t),free=COVERS.filter(function(c){return shown.indexOf(c)<0});if(!free.length)return;
      var next=free[Math.floor(Math.random()*free.length)],im=t.querySelectorAll('img'),a=im[0].classList.contains('on')?im[0]:im[1],b=a===im[0]?im[1]:im[0];
      b.onload=function(){b.onload=null;b.classList.add('on');a.classList.remove('on');shown[ti]=next;t.setAttribute('data-cover',next);label(t,next)};
      b.src='img/'+next+'.webp';
    }
    new IntersectionObserver(function(es){var on=es[0].isIntersecting;
      if(on&&!timer){timer=setInterval(function(){if(!document.hidden)swap()},2600);w.classList.add('run')}
      else if(!on&&timer){clearInterval(timer);timer=0;w.classList.remove('run')}
    },{threshold:.2}).observe(w);
  }

  /* ---------- 2d. activity posters ---------- */
  function rng(seed){var s=seed>>>0||1;return function(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
  function hash(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
  function f1(n){return Math.round(n*10)/10}
  function contours(r){   /* camp: terrain lines around a peak */
    var cx=70+r()*70,cy=50+r()*40,p1=r()*6.28,p2=r()*6.28,a=.1+r()*.08,b=.05+r()*.05,o='';
    for(var k=0;k<9;k++){var R=10+k*20+k*k*.9,pts=[];
      for(var i=0;i<36;i++){var th=i/36*6.2832,rr=R*(1+a*Math.sin(3*th+p1+k*.22)+b*Math.sin(5*th+p2-k*.3));pts.push([cx+rr*Math.cos(th)*1.25,cy+rr*Math.sin(th)*.82])}
      var d='';for(i=0;i<pts.length;i++){var q=pts[i],n=pts[(i+1)%pts.length],mx=(q[0]+n[0])/2,my=(q[1]+n[1])/2;d+=(i?' Q'+f1(q[0])+' '+f1(q[1])+' ':'M'+f1((pts[pts.length-1][0]+q[0])/2)+' '+f1((pts[pts.length-1][1]+q[1])/2)+' Q'+f1(q[0])+' '+f1(q[1])+' ')+f1(mx)+' '+f1(my)}
      o+='<path d="'+d+'Z"/>'}
    return o+'<path class="a" d="M'+f1(cx-4)+' '+f1(cy)+'h8M'+f1(cx)+' '+f1(cy-4)+'v8"/>';
  }
  function drafting(r){   /* workshop: drafting grid with construction lines */
    var o='',ox=r()*20,oy=r()*20;
    for(var x=ox;x<320;x+=20)o+='<path d="M'+f1(x)+' 0V180"/>';
    for(var y=oy;y<180;y+=20)o+='<path d="M0 '+f1(y)+'H320"/>';
    var ax=ox+20*(2+Math.floor(r()*3)),ay=oy+20*(1+Math.floor(r()*2)),R=60+Math.floor(r()*3)*20;
    o+='<path class="a" d="M'+f1(ax)+' '+f1(ay+R)+'A'+R+' '+R+' 0 0 0 '+f1(ax+R)+' '+f1(ay)+'"/>';
    o+='<path class="a" d="M'+f1(ax)+' '+f1(ay)+'L'+f1(ax+R*.707)+' '+f1(ay+R*.707)+'"/>';
    o+='<path class="a" d="M'+f1(ax-5)+' '+f1(ay)+'h10M'+f1(ax)+' '+f1(ay-5)+'v10"/>';
    return o;
  }
  function orbits(r){   /* project: long arcs of one orbit system */
    var cx=40+r()*60,cy=-30+r()*40,rot=-22+r()*12,o='<g transform="rotate('+f1(rot)+' '+f1(cx)+' '+f1(cy)+')">';
    for(var k=0;k<6;k++){var rx=70+k*52,ry=rx*.52;o+='<ellipse cx="'+f1(cx)+'" cy="'+f1(cy)+'" rx="'+rx+'" ry="'+f1(ry)+'"/>';
      if(k===1||k===3||k===4){var th=.5+r()*1.4;o+='<circle class="d" r="'+(k===3?4.2:2.8)+'" cx="'+f1(cx+rx*Math.cos(th))+'" cy="'+f1(cy+ry*Math.sin(th))+'"/>'}}
    return o+'</g>';
  }
  function ridges(r){   /* camp: hills one behind another */
    var o='';for(var k=0;k<7;k++){var y0=40+k*20,ph=r()*6.28,amp=8+r()*10,d='M0 '+f1(y0);
      for(var x=0;x<=320;x+=16)d+=' L'+x+' '+f1(y0+amp*Math.sin(x/(38+k*4)+ph)+.4*amp*Math.sin(x/13+ph*2));o+='<path'+(k===3?' class="a"':'')+' d="'+d+'"/>'}
    return o;
  }
  function sundots(r){   /* camp: a halftone sun */
    var cx=200+r()*80,cy=40+r()*40,o='';
    for(var y=8;y<180;y+=14)for(var x=8;x<320;x+=14){var dd=Math.hypot(x-cx,y-cy),rr=Math.max(0,3.4-dd/60);if(rr>.5)o+='<circle class="dl" cx="'+x+'" cy="'+y+'" r="'+f1(rr)+'"/>'}
    return o+'<circle class="a" cx="'+f1(cx)+'" cy="'+f1(cy)+'" r="'+f1(26+r()*10)+'"/>';
  }
  var PAL={camp:['sand','mint','sky','lilac','pink'],work:['ink','navy'],proj:['orange','peach']},
      PAT={camp:[contours,ridges,sundots],work:[drafting,sundots],proj:[orbits,ridges]};
  function posters(root){
    var n={camp:0,work:0,proj:0};
    [].forEach.call((root||document).querySelectorAll('[data-view="activity"] .avc-ty:not(.ar-po)'),function(ty){
      var card=ty.closest('.avc'),b=ty.querySelector('b');if(!card||!b)return;
      var dEl=card.querySelector('.avc-d'),sp=dEl&&dEl.querySelector('span'),kind=sp?sp.textContent:'',date=dEl?dEl.textContent.replace(kind,'').trim():'';
      var type=/เวิร์ก/.test(kind)?'work':/โครงการ|โชว์|แข่ง/.test(kind)?'proj':'camp',i=n[type]++;
      var r=rng(hash(b.textContent+date)),g=PAT[type][i%PAT[type].length](r),pal=PAL[type][i%PAL[type].length];
      var day=(date.match(/\d+/)||[''])[0],mon=(date.match(/[ก-๙]+\.[ก-๙]+\./)||[''])[0];
      var svg='<svg class="ar-po-g" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+g+'</svg>';
      ty.insertAdjacentHTML('afterbegin',svg);
      if(day)ty.insertAdjacentHTML('beforeend','<span class="ar-po-d" aria-hidden="true"><i>'+day+'</i><u>'+mon+'</u></span>');
      ty.classList.add('ar-po','t-'+type,'p-'+pal);
    });
    /* "น้องได้" lines: a line shared by many cards says nothing, keep it only on the first card */
    var gs=[].slice.call(document.querySelectorAll('[data-view="activity"] .avc .avc-g')),cnt={},seen={};
    gs.forEach(function(g){var k=g.textContent.trim();cnt[k]=(cnt[k]||0)+1});
    gs.forEach(function(g){var k=g.textContent.trim();var hide=cnt[k]>3&&seen[k];seen[k]=1;if(g.hidden!==!!hide)g.hidden=!!hide});
  }

  function go(){
    stage();rank();posters();
    var act=document.querySelector('[data-view="activity"]');
    if(act&&'MutationObserver' in window){var q=0;new MutationObserver(function(){if(q)return;q=requestAnimationFrame(function(){q=0;if(act.querySelector('.avc-ty:not(.ar-po)'))posters()})}).observe(act,{childList:true,subtree:true})}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
  addEventListener('load',function(){rank();posters()});
})();
</script>
