<style id="ly-lead">
/* ceiling goo only at the two side edges; the hanging sky blob keeps its own strand */
.hm-top{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 7%,transparent 13%,transparent 87%,#000 93%,#000 100%);mask-image:linear-gradient(90deg,#000 0,#000 7%,transparent 13%,transparent 87%,#000 93%,#000 100%)}
.hm-hang .hm-b{pointer-events:none}
/* the seed hamster peeks from behind the search bar instead of sitting on it */
[data-view="home"] .zq-s{position:relative;z-index:4}
.hm-pet{z-index:1!important;--ps:76px!important;bottom:calc(100% - 22px)!important}
@media (max-width:640px){.hm-pet{--ps:52px!important;bottom:calc(100% - 22px)!important}}
/* drawn faces (no lashes) on the closing card and on "what we build" */
.end-in .hm-end{display:none!important}
.lf,.end-in>.lf{position:absolute!important;pointer-events:none;z-index:2!important}
.lf .pu{transition:transform .18s ease-out}.lf .lid{transform-box:fill-box;transform-origin:50% 50%;transition:transform .08s}.lf.blink .lid{transform:scaleY(.1)}
.oc-r{position:relative}

/* hero v2: the brand's own three hamsters; no moving hills / drops / ceiling goo */
.hm-l,.hm-dot,.hm-top,.hm-glow{display:none!important}
.lm{position:absolute;z-index:1;left:clamp(16px,5vw,90px);bottom:clamp(20px,5vh,60px);width:clamp(170px,19vw,290px);pointer-events:auto;cursor:pointer;transform-origin:50% 90%;animation:lmIn .9s cubic-bezier(.2,1.3,.4,1) .2s both}
.lm img{display:block;width:100%;height:auto;filter:drop-shadow(0 18px 22px rgba(110,50,0,.28));animation:lmB 4.2s ease-in-out infinite}
.lm:hover img,.lm.tap img{animation:lmW .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes lmIn{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
@keyframes lmB{50%{transform:translateY(-6px) rotate(-1.5deg)}}
@keyframes lmW{30%{transform:rotate(-7deg) scale(1.05)}65%{transform:rotate(5deg) scale(1.03)}}
@media (max-width:640px){.lm{left:auto;right:12px;bottom:58px;width:118px}}
@media (prefers-reduced-motion:reduce){.lm,.lm img{animation:none!important}}
</style>
<script>

  function face(o){var R=R0(o.seed),sv=E('svg',{'class':'lf',viewBox:'0 0 200 120','aria-hidden':'true'}),ey=50,er=17,ex=[62,138],c=o.ink||INK;

    else sv.appendChild(E('path',{d:stroke(R,[[86,my-2],[92,my+5],[99,my],[100,my-1],[101,my],[108,my+5],[114,my-2]],4.4),fill:c}));
    return sv}
  var faces=[];
  function mascot(){var zq=document.querySelector('[data-view="home"] .zq');if(!zq||zq.querySelector('.lm'))return;
    var a=document.createElement('a');a.className='lm';a.setAttribute('aria-hidden','true');a.tabIndex=-1;a.innerHTML='<img src="img/hh-mascot.webp" alt="" width="290" height="290">';
    a.addEventListener('pointerdown',function(e){e.stopPropagation();a.classList.remove('tap');void a.offsetWidth;a.classList.add('tap')});zq.appendChild(a)}

  function build(){mascot();
    document.querySelectorAll('.lf').forEach(function(n){n.remove()});faces=[];
    var home=document.querySelector('[data-view="home"]');if(!home)return;var mob=innerWidth<640;
    var en=home.querySelector('.end-in');if(en){var f=face({seed:21,mouth:'open'});f.style.cssText='left:50%;top:'+(mob?14:22)+'px;width:'+(mob?170:250)+'px;margin-left:-'+(mob?85:125)+'px';en.appendChild(f)}
    /* "what we build": a face peeks from behind each picture, different mood per row */
