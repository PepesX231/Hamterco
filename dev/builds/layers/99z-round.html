<style id="ly-round">
/* ===== owner round (14 พ.ย.) ===== */
/* 1. "สิ่งที่ Hamster Hub สร้าง": no step pills, no pill labels; each row reads like the credits of the works themselves */

.ocl span i{display:block;font-style:normal;font-weight:700;color:#B85F14}

.ocl.one li{grid-template-columns:1fr;padding:6px 0 18px;border-top:0}

.ocl-n{margin:14px 0 0;font-size:.95rem;color:rgba(29,23,18,.66)}
.oc-m>*{transition:opacity .35s,filter .35s}
.oc-m.ocl-on>*{opacity:.28;filter:grayscale(.6)}

@media (max-width:640px){.ocl li{grid-template-columns:1fr;gap:2px}.ocl b{white-space:normal}}

/* 2. seniors: same fan, now on a dark stage, cards turn toward the middle and stand on a glossy floor */

/* 3. nav: each link previews its own destination, each in its own shape */

@media (hover:hover) and (pointer:fine){.nav-in>.nv-a:hover>.roll>span:first-child{transform:none!important}.nav-in>.nv-a:hover .nx{transform:translate(-50%,110%)!important}}
.nvp{position:fixed;z-index:1000;bottom:auto!important;right:auto!important;height:auto!important;align-items:start;text-decoration:none;color:#1D1712;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .16s,transform .25s cubic-bezier(.23,1,.32,1)}

.nvp::before{content:"";position:absolute;left:0;right:0;top:-16px;height:16px}
.nvp img{display:block;-webkit-user-drag:none}
.nvp span{display:block}
.nvp-b .nvp-fc u{white-space:nowrap}
/* courses: an admission ticket */

.nvp-c .nvp-tk small{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.8rem;color:#06A04A;margin-bottom:4px}
.nvp-c .nvp-tk small::before{content:"";width:7px;height:7px;border-radius:50%;background:#06C755;box-shadow:0 0 0 0 rgba(6,199,85,.5);animation:nvpPing 1.8s infinite}
.nvp-c .nvp-tk span{display:block;font-size:.84rem;color:rgba(29,23,18,.66);margin-top:4px}
.nvp-c .nvp-sb{background:#F2A65E;border-radius:0 16px 16px 0;display:flex!important;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;
  -webkit-mask:radial-gradient(circle at 0 0,transparent 9px,#000 9.5px) top left/100% 51% no-repeat,radial-gradient(circle at 0 100%,transparent 9px,#000 9.5px) bottom left/100% 51% no-repeat;
  mask:radial-gradient(circle at 0 0,transparent 9px,#000 9.5px) top left/100% 51% no-repeat,radial-gradient(circle at 0 100%,transparent 9px,#000 9.5px) bottom left/100% 51% no-repeat}
.nvp-c .nvp-sb::before{content:"";position:absolute;left:0;top:12px;bottom:12px;border-left:2px dashed rgba(29,23,18,.35)}
.nvp-c .nvp-sb b{font:800 1.3rem/1 var(--display)}

.nvp-a.on .nvp-cal{animation:nvpFlip .6s cubic-bezier(.3,1.4,.5,1) both}
.nvp-a .nvp-cal i{display:block;font-style:normal;background:#1D1712;color:#fff;font:700 .8rem/1 var(--display);padding:6px 0}

.nvp-a .nvp-cal small{display:block;font-size:.7rem;color:rgba(29,23,18,.6);padding:0 0 7px}
.nvp-a .nvp-tx u{display:inline-block;text-decoration:none;background:#FFD24A;color:#1D1712;font:800 .78rem/1 var(--display);padding:5px 9px;border-radius:999px;margin-bottom:7px}
.nvp-a .nvp-tx b{display:block;font:800 1.05rem/1.25 var(--display)}
.nvp-a .nvp-tx span{display:block;font-size:.8rem;opacity:.82;margin-top:4px;line-height:1.4}
.nvp-a .nvp-tx em{display:inline-block;font-style:normal;font-weight:700;font-size:.82rem;margin-top:7px;text-decoration:underline;text-underline-offset:3px}
@keyframes nvpFlip{0%{transform:perspective(400px) rotateX(-80deg)}100%{transform:perspective(400px) rotateX(0)}}
/* works: a hand of game cards that fans open */
.nvp-w{width:330px;background:#1D1712;color:#FFF6E8;border-radius:18px;padding:16px 18px 16px;box-shadow:0 24px 44px -20px rgba(29,23,18,.75);overflow:hidden}
.nvp-w .nvp-hd{position:relative;height:118px;margin:0 0 10px}
.nvp-w .nvp-hd img{position:absolute;left:50%;bottom:0;width:84px;aspect-ratio:3/4;object-fit:cover;border-radius:9px;border:2px solid #FFF6E8;transform-origin:50% 120%;
  transform:translateX(-50%) rotate(0);transition:transform .55s cubic-bezier(.3,1.35,.5,1);box-shadow:0 10px 18px -8px rgba(0,0,0,.7)}
.nvp-w.on .nvp-hd img:nth-child(1){transform:translateX(-50%) translateX(-84px) rotate(-12deg)}
.nvp-w.on .nvp-hd img:nth-child(2){transform:translateX(-50%) translateX(-28px) rotate(-4deg)}
.nvp-w.on .nvp-hd img:nth-child(3){transform:translateX(-50%) translateX(28px) rotate(4deg)}
.nvp-w.on .nvp-hd img:nth-child(4){transform:translateX(-50%) translateX(84px) rotate(12deg)}
.nvp-w .nvp-hd img:hover{z-index:5;transform:translateX(-50%) translateX(var(--x,0)) translateY(-10px) rotate(0)!important}
.nvp-w b{display:block;font:800 1.08rem/1.25 var(--display)}
.nvp-w span{display:block;font-size:.82rem;color:rgba(255,246,232,.7);margin-top:3px}
.nvp-w em{display:inline-block;font-style:normal;font-weight:700;font-size:.85rem;color:#F2A65E;margin-top:8px}
/* about: the people */
.nvp-b{width:330px;background:#FFF6E8;border-radius:18px;padding:16px 18px;box-shadow:0 0 0 1px rgba(29,23,18,.08),0 24px 44px -20px rgba(29,23,18,.45)}
.nvp .nvp-fc{display:flex!important;align-items:center;margin-bottom:12px}
.nvp-b .nvp-fc i{display:block;width:46px;height:46px;border-radius:50%;overflow:hidden;border:3px solid #FFF6E8;margin-left:-12px;background:#2a221b;opacity:0;transform:translateY(8px) scale(.8);transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .25s}
.nvp-b .nvp-fc i{position:relative}.nvp-b .nvp-fc i img{position:absolute;width:108px;max-width:none;height:135px;left:-58px;top:-24px}
.nvp-b .nvp-fc i:first-child{margin-left:0}
.nvp-b.on .nvp-fc i{opacity:1;transform:none}
.nvp-b .nvp-fc u{text-decoration:none;margin-left:8px;font:800 .9rem var(--display);color:#B85F14}
.nvp-b b{display:block;font:800 1.08rem/1.25 var(--display)}
.nvp-b span{display:block;font-size:.84rem;color:rgba(29,23,18,.66);margin-top:3px}
.nvp-b em{display:inline-block;font-style:normal;font-weight:700;font-size:.85rem;color:#B85F14;margin-top:8px}
.nvp:hover em{text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){.nvp,.nvp *{transition:none!important;animation:none!important}}
</style>
<script>

  /* ---- "สิ่งที่ Hamster Hub สร้าง": credits for each work, the matching picture lights up on hover ---- */
  var ROWS=[
    {items:[{n:'Mr. City',w:'เกมเดินเที่ยวสงขลาแบบ Pokémon GO',r:'ขายให้สวนสัตว์สงขลาแล้ว'},
            {n:'PHC Map',w:'เกมสอนเขียน Python',r:'ใช้สอนเด็กไปแล้วกว่า 1,000 คน',m:[0]},
            {n:'Hamster Quest',w:'เว็บเรียนที่เล่นเหมือนเกม',r:'กำลังเตรียมใช้กับมหาวิทยาลัย',m:[1,2]}]},
    {h3:'แอปฝึกพูดแบบเล่นเกม ที่น้องไอดินทำเองใน 4 เดือน',one:1,
     items:[{n:'REVOICE',w:'ทำมาเพื่อคนที่มีปัญหาด้านการพูด น้องไอดินเขียนเองทั้งแอปด้วย Unity',r:'ชนะ NSC 2025 การแข่งขันเขียนโปรแกรมระดับประเทศ'}]},

            {n:'Z.O.O.',w:'เกมสืบสวน',r:'ของพี่ไอซ์',m:[2]}],note:'ปีนี้มีเกมของน้องๆ 10 เกมใน Hall of Fame'}];

  /* ---- seniors fan: spaced to both edges, turned toward the middle, draggable ---- */
  var busy=false;

    var cs=[].slice.call(st.querySelectorAll('.mc-c'));if(!cs.length)return;

      c.style.zIndex=40-ab;c.style.opacity=vis?1:0;c.style.filter=ab?'brightness('+Math.max(.5,1-ab*.12).toFixed(2)+')':'none';
      if(!ab){}else{var im=c.querySelector('img');if(im)im.style.transform=''}});
    requestAnimationFrame(function(){cs.forEach(function(c){if(c.dataset.jump){c.offsetWidth;c.style.transition='';delete c.dataset.jump}})})}
  function queue(){if(busy)return;busy=true;Promise.resolve().then(function(){busy=false;fan()})}
  function step(st,d){var cs=[].slice.call(st.querySelectorAll('.mc-c')),on=st.querySelector('.mc-c.on'),a=Math.max(0,cs.indexOf(on)),t=cs[(a+d+cs.length)%cs.length];if(t)t.click()}
  function watch(){var st=document.getElementById('mcSt');if(!st||st.dataset.fan)return;st.dataset.fan='1';

  /* ---- nav previews, one shape per destination ---- */

  function build(a){var p=el('a','nvp');p.href=a.getAttribute('href');p.tabIndex=-1;p.setAttribute('aria-hidden','true');
