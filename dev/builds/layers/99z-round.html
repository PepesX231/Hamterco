<style id="ly-round">
/* ===== owner round (14 พ.ย.): no step pills, seniors fan to the screen edges, nav hover shows where the link goes ===== */
/* 1. "สิ่งที่ Hamster Hub สร้าง": the 4-step pills are gone */
.oc-st{display:none!important}

/* 2. seniors fan: same layout, posters run to the screen edges */
html body [data-view="home"] .mc .mc-in{overflow:hidden!important}
html body [data-view="home"] .mc .mc-st{-webkit-mask:none!important;mask:none!important;margin-left:0!important;margin-right:0!important}
html body [data-view="home"] .mc .mc-c{transition:transform .6s cubic-bezier(.23,1,.32,1),opacity .35s,filter .5s!important}
html body [data-view="home"] .mc .mc-c img{box-shadow:0 18px 34px -22px rgba(29,23,18,.55)!important;outline:none!important}
html body [data-view="home"] .mc .mc-c.on img{box-shadow:0 0 0 3px #FFF6E8,0 0 0 6px #F2A65E,0 30px 60px -26px rgba(29,23,18,.6)!important}
html body [data-view="home"] .mc .mc-c.on{box-shadow:none!important}
html body [data-view="home"] .mc .mc-c:not(.on):hover{filter:brightness(1)!important}

/* 3. nav: hovering a link previews what is behind it; the line only marks the page you are on */
.nav-in>a.v:hover::after,.nav-in>a.v:focus-visible::after{transform:scaleX(0)!important}
.nav-in>a.v[aria-current="page"]::after{transform:scaleX(1)!important}
.nav-in>a.nv-c:hover>span{animation:none!important}
.nvp{position:fixed;z-index:1000;width:340px;background:#fff;color:#1D1712;border-radius:16px;padding:10px;text-decoration:none;
  box-shadow:0 0 0 1px rgba(29,23,18,.08),0 24px 48px -20px rgba(29,23,18,.4);display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:center;
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .16s,transform .2s cubic-bezier(.23,1,.32,1)}
.nvp.on{opacity:1;transform:none;pointer-events:auto}
.nvp::before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px}
.nvp-i{width:88px;height:88px;border-radius:10px;overflow:hidden;background:#FFF3E3;position:relative}
.nvp-i img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .4s}
.nvp-t{min-width:0;font:400 .86rem/1.45 var(--body,inherit)}
.nvp-t b{display:block;font:700 1rem/1.3 var(--display);margin-bottom:3px}
.nvp-t span{display:block;color:rgba(29,23,18,.68)}
.nvp-t em{display:inline-block;font-style:normal;font-weight:700;color:#B85F14;margin-top:5px}
.nvp:hover .nvp-t em{text-decoration:underline;text-underline-offset:3px}
@media (hover:hover) and (pointer:fine){.nav-in>.nv-a:hover>.roll>span:first-child{transform:none!important}.nav-in>.nv-a:hover .nx{transform:translate(-50%,110%)!important}}
@media (prefers-reduced-motion:reduce){.nvp{transition:none}.nvp-i img{transition:none}}
</style>
<script>
(function(){
  var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- seniors fan: re-lay the cards after the page's own layout, spaced to reach both edges ---- */
  var busy=false;
  function fan(){var st=document.getElementById('mcSt');if(!st||!st.offsetWidth)return;
    var cs=[].slice.call(st.querySelectorAll('.mc-c'));if(!cs.length)return;
    var on=st.querySelector('.mc-c.on'),a=Math.max(0,cs.indexOf(on)),n=cs.length,
        W=(st.closest('.mc-in')||st).getBoundingClientRect().width,cw=cs[0].offsetWidth,mob=innerWidth<640,
        sc=function(d){return Math.max(.68,1-d*(mob?.12:.085))},pos=[0];
    for(var d=1;d<=Math.floor(n/2)+1;d++)pos[d]=pos[d-1]+cw*(sc(d-1)+sc(d))/2*(mob?.62:.74);
    /* stretch the spacing so the outermost card sits half off the screen edge: the row runs to both edges */
    var half=W/2,m=1;while(m<pos.length-1&&pos[m]<half*.86)m++;var f=pos[m]>=half*.86?Math.min(1.2,Math.max(.86,half/pos[m])):1;pos=pos.map(function(p){return p*f});
    cs.forEach(function(c,k){var o=k-a;if(o>n/2)o-=n;if(o<-n/2)o+=n;var ab=Math.abs(o),s=sc(ab),x=(o<0?-1:1)*pos[ab],
        vis=Math.abs(x)-cw*s/2<W/2+4,prev=c.dataset.fo===undefined?o:+c.dataset.fo;
      if(Math.abs(prev-o)>1||(prev*o<0&&ab>1)){c.style.transition='none';c.dataset.jump='1'}
      c.dataset.fo=o;
      c.style.transform='translate(-50%,-50%) translateX('+x.toFixed(1)+'px) translateY('+Math.min(ab*ab*5,40)+'px) scale('+s.toFixed(3)+')';
      c.style.zIndex=40-ab;c.style.opacity=vis?1:0;c.style.filter=ab?'brightness('+Math.max(.62,1-ab*.09).toFixed(2)+') saturate('+Math.max(.7,1-ab*.06).toFixed(2)+')':'none'});
    requestAnimationFrame(function(){cs.forEach(function(c){if(c.dataset.jump){c.offsetWidth;c.style.transition='';delete c.dataset.jump}})})}
  function queue(){if(busy)return;busy=true;Promise.resolve().then(function(){busy=false;fan()})}
  function watch(){var st=document.getElementById('mcSt');if(!st||st.dataset.fan)return;st.dataset.fan='1';
    /* the page re-lays on every step; we only listen to class/children, and only ever write style, so no loop */
    new MutationObserver(queue).observe(st,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});fan()}

  /* ---- nav previews ---- */
  var fine=matchMedia('(hover:hover) and (pointer:fine)').matches,pop,cur=null,tIn,tOut,cyc;
  function q(s){return document.querySelector(s)}
  function txt(s){var e=q(s);return e?e.textContent.replace(/\s+/g,' ').trim():''}
  function data(a){
    if(a.classList.contains('nv-c'))return{img:['img/portex-poster.webp'],b:'Port Express เปิดรับสมัคร',s:'เริ่ม 9 พ.ย. 2569 เรียน 2 เดือน 5,990 บาท',e:'ดูคอร์สทั้งหมด'};
    if(a.classList.contains('nv-a')){var t=q('.avn .avn-t h2'),d=q('.avn .avn-d');
      return{img:['img/afo-hero.webp'],b:t?t.textContent.trim():'กิจกรรมถัดไป',s:(d?'กิจกรรมถัดไป '+d.textContent.replace(/\s+/g,' ').trim():''),e:'ดูกิจกรรมทั้งหมด'}}
    if(a.classList.contains('nv-w'))return{img:['img/sc-lyno.webp','img/sc-timekeeper.webp','img/sc-zoo.webp','img/sc-revoice.webp'],b:'เกมและแอปที่น้องๆ ทำเอง',s:'LYNO, Time Keeper, Z.O.O., REVOICE และอีกหลายชิ้น',e:'ดูผลงานทั้งหมด'};
    if(a.classList.contains('nv-b'))return{img:['img/w-quest-town.webp'],b:'ทีม Hamster Hub',s:'สอนน้องมัธยมทำเกม เว็บ และแอปของตัวเอง รุ่นพี่ติดมหาลัยแล้ว 48 คน',e:'รู้จักเรา'};
    return null}
  function show(a){var d=data(a);if(!d)return;cur=a;clearInterval(cyc);
    pop.href=a.getAttribute('href');
    pop.querySelector('.nvp-i').innerHTML=d.img.map(function(src,i){return '<img src="'+src+'" alt="" style="opacity:'+(i?0:1)+'">'}).join('');
    pop.querySelector('.nvp-t').innerHTML='<b></b><span></span><em></em>';
    var tx=pop.querySelector('.nvp-t');tx.querySelector('b').textContent=d.b;tx.querySelector('span').textContent=d.s;tx.querySelector('em').textContent=d.e;
    var r=a.getBoundingClientRect(),w=340,x=Math.min(innerWidth-w-12,Math.max(12,r.left+r.width/2-w/2));
    pop.style.left=x+'px';pop.style.top=(r.bottom+12)+'px';pop.classList.add('on');
    if(d.img.length>1&&!rm){var k=0,ims=pop.querySelectorAll('.nvp-i img');cyc=setInterval(function(){ims[k].style.opacity=0;k=(k+1)%ims.length;ims[k].style.opacity=1},1100)}}
  function hide(){cur=null;clearInterval(cyc);if(pop)pop.classList.remove('on')}
  function nav(){if(!fine||pop)return;var links=document.querySelectorAll('.nav-in>a.v');if(!links.length)return;
    pop=document.createElement('a');pop.className='nvp';pop.setAttribute('aria-hidden','true');pop.tabIndex=-1;
    pop.innerHTML='<span class="nvp-i"></span><span class="nvp-t"></span>';document.body.appendChild(pop);
    function enter(a){clearTimeout(tOut);clearTimeout(tIn);if(cur===a)return;tIn=setTimeout(function(){show(a)},cur?0:140)}
    function leave(){clearTimeout(tIn);tOut=setTimeout(hide,180)}
    [].forEach.call(links,function(a){a.addEventListener('pointerenter',function(){enter(a)});a.addEventListener('pointerleave',leave);a.addEventListener('click',hide)});
    pop.addEventListener('pointerenter',function(){clearTimeout(tOut)});pop.addEventListener('pointerleave',leave);pop.addEventListener('click',hide);
    addEventListener('scroll',hide,{passive:true});addEventListener('hashchange',hide);addEventListener('keydown',function(e){if(e.key==='Escape')hide()})}

  function go(){watch();nav();addEventListener('resize',fan);addEventListener('hashchange',function(){setTimeout(function(){watch();fan()},150)})}
  if(document.readyState==='complete')go();else addEventListener('load',go);
})();
</script>
