<style id="ly-round">
/* ===== owner round (14 พ.ย.) ===== */
/* 1. "สิ่งที่ Hamster Hub สร้าง": no step pills, no pill labels; each row reads like the credits of the works themselves */
.oc-st{display:none!important}
html body .oc-r .oc-t>.oc-k,html body .oc-r .oc-t>p:not(.ocl-n){display:none!important}
html body .oc-r .oc-t>h3{font:700 clamp(1.1rem,1.5vw,1.3rem)/1.45 var(--display)!important;color:rgba(29,23,18,.72)!important;margin:0 0 18px!important;max-width:34ch}
.ocl{list-style:none;margin:0;padding:0;border-bottom:1px solid rgba(29,23,18,.14)}
.ocl li{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:6px 22px;align-items:baseline;padding:16px 0 15px;border-top:1px solid rgba(29,23,18,.14);cursor:default}
.ocl b{font:800 clamp(1.7rem,2.6vw,2.35rem)/1.05 var(--display);letter-spacing:-.02em;color:#1D1712;white-space:nowrap;transition:color .2s,transform .35s cubic-bezier(.23,1,.32,1)}
.ocl span{font-size:.95rem;line-height:1.5;color:rgba(29,23,18,.66)}
.ocl span i{display:block;font-style:normal;font-weight:700;color:#B85F14}
.ocl li:hover b{color:#B85F14;transform:translateX(6px)}
.ocl.one li{grid-template-columns:1fr;padding:6px 0 18px;border-top:0}
.ocl.one b{font-size:clamp(3.2rem,7vw,5.6rem);letter-spacing:-.035em;line-height:.95}
.ocl.one span{font-size:1.02rem;max-width:54ch}
.ocl.one span i{font-size:1.1rem;margin-top:6px}
.ocl-n{margin:14px 0 0;font-size:.95rem;color:rgba(29,23,18,.66)}
.oc-m>*{transition:opacity .35s,filter .35s}
.oc-m.ocl-on>*{opacity:.28;filter:grayscale(.6)}
.oc-m.ocl-on>.ocl-hi{opacity:1;filter:none}
@media (max-width:640px){.ocl li{grid-template-columns:1fr;gap:2px}.ocl b{white-space:normal}}

/* 2. seniors: same fan as before, posters run to both screen edges, drag to browse */
html body [data-view="home"] .mc .mc-in{overflow:hidden!important}
html body [data-view="home"] .mc .mc-st{-webkit-mask:none!important;mask:none!important;margin-left:0!important;margin-right:0!important;touch-action:pan-y;cursor:grab;user-select:none}
html body [data-view="home"] .mc .mc-st.drag{cursor:grabbing}
html body [data-view="home"] .mc .mc-c{transition:transform .6s cubic-bezier(.23,1,.32,1),opacity .35s,filter .5s!important}
html body [data-view="home"] .mc .mc-st.drag .mc-c{transition:transform .32s cubic-bezier(.23,1,.32,1),opacity .2s,filter .3s!important}
html body [data-view="home"] .mc .mc-c img{box-shadow:0 18px 34px -22px rgba(29,23,18,.55)!important;outline:none!important;-webkit-user-drag:none}
html body [data-view="home"] .mc .mc-c.on img{box-shadow:0 0 0 3px #FFF6E8,0 0 0 6px #F2A65E,0 30px 60px -26px rgba(29,23,18,.6)!important}
html body [data-view="home"] .mc .mc-c.on{box-shadow:none!important}
html body [data-view="home"] .mc .mc-c:not(.on):hover{filter:brightness(1)!important}

/* 3. nav: hover rolls each link to a hint of what is behind it (same move กิจกรรม already had), current page keeps its line */
.nav-in>a.v:hover::after,.nav-in>a.v:focus-visible::after{transform:scaleX(0)!important}
.nav-in>a.v[aria-current="page"]::after{transform:scaleX(1)!important}
.nav-in>a.v:not([aria-current="page"])::after{opacity:0!important}
.nav-in>a.v::before{display:none!important}
.nav-in>a.nv-c:hover>span{animation:none!important}
.nav-in>a.v .roll{display:inline-block;position:relative;height:1.5em;clip-path:inset(-3px -90px);vertical-align:top!important}
.nav-in>a.v .roll>span{display:block;transition:transform .45s cubic-bezier(.5,1.6,.4,1)}
.nav-in>a.v .roll .nx{position:absolute;left:50%;top:0;transform:translate(-50%,110%);white-space:nowrap;font-weight:700!important;font-size:.92em;color:#B85F14!important}
.nav-in>a.v:hover .roll>span:first-child,.nav-in>a.v:focus-visible .roll>span:first-child{transform:translateY(-110%)}
.nav-in>a.v:hover .roll .nx,.nav-in>a.v:focus-visible .roll .nx{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.nav-in>a.v .roll>span{transition:none}}
</style>
<script>
(function(){
  var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function q(s){return document.querySelector(s)}
  function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e}

  /* ---- "สิ่งที่ Hamster Hub สร้าง": credits for each work, the matching picture lights up on hover ---- */
  var ROWS=[
    {items:[{n:'Mr. City',w:'เกมเดินเที่ยวสงขลาแบบ Pokémon GO',r:'ขายให้สวนสัตว์สงขลาแล้ว'},
            {n:'PHC Map',w:'เกมสอนเขียน Python',r:'ใช้สอนเด็กไปแล้วกว่า 1,000 คน',m:[0]},
            {n:'Hamster Quest',w:'เว็บเรียนที่เล่นเหมือนเกม',r:'กำลังเตรียมใช้กับมหาวิทยาลัย',m:[1,2]}]},
    {h3:'แอปฝึกพูดแบบเล่นเกม ที่น้องไอดินทำเองใน 4 เดือน',one:1,
     items:[{n:'REVOICE',w:'ทำมาเพื่อคนที่มีปัญหาด้านการพูด น้องไอดินเขียนเองทั้งแอปด้วย Unity',r:'ชนะ NSC 2025 การแข่งขันเขียนโปรแกรมระดับประเทศ'}]},
    {items:[{n:'LYNO',w:'เกมปริศนา 3 มิติ',r:'ของน้องดา',m:[0]},
            {n:'Time Keeper',w:'เกมผจญภัยบน Roblox',r:'ของพี่มิคกี้',m:[1]},
            {n:'Z.O.O.',w:'เกมสืบสวน',r:'ของพี่ไอซ์',m:[2]}],note:'ปีนี้มีเกมของน้องๆ 10 เกมใน Hall of Fame'}];
  function credits(){[].forEach.call(document.querySelectorAll('section .oc-in>.oc-r'),function(r,i){var d=ROWS[i],t=r.querySelector('.oc-t');if(!d||!t||t.querySelector('.ocl'))return;
    var m=r.querySelector('.oc-m'),h=t.querySelector('h3');if(d.h3&&h)h.textContent=d.h3;
    var ul=el('ul','ocl'+(d.one?' one':''));
    d.items.forEach(function(it){var li=el('li'),sp=el('span',null,it.w);li.appendChild(el('b',null,it.n));sp.appendChild(el('i',null,it.r));li.appendChild(sp);ul.appendChild(li);
      if(it.m&&m){li.addEventListener('pointerenter',function(){m.classList.add('ocl-on');[].forEach.call(m.children,function(c,k){c.classList.toggle('ocl-hi',it.m.indexOf(k)>=0)})});
        li.addEventListener('pointerleave',function(){m.classList.remove('ocl-on')})}});
    var p=t.querySelector('p');t.insertBefore(ul,p?p.nextSibling:null);
    if(d.note){var n=el('p','ocl-n',d.note);n.style.display='block';t.insertBefore(n,ul.nextSibling)}})}

  /* ---- seniors fan: spaced to both edges, turned toward the middle, draggable ---- */
  var busy=false;
  function fan(){var st=document.getElementById('mcSt');if(!st||!st.offsetWidth)return;
    var cs=[].slice.call(st.querySelectorAll('.mc-c'));if(!cs.length)return;
    var on=st.querySelector('.mc-c.on'),a=Math.max(0,cs.indexOf(on)),n=cs.length,
        W=(st.closest('.mc-in')||st).getBoundingClientRect().width,cw=cs[0].offsetWidth,mob=innerWidth<640,
        sc=function(d){return Math.max(.68,1-d*(mob?.12:.085))},pos=[0];
    for(var d=1;d<=Math.floor(n/2)+1;d++)pos[d]=pos[d-1]+cw*(sc(d-1)+sc(d))/2*(mob?.62:.74);
    var half=W/2,m=1;while(m<pos.length-1&&pos[m]<half*.86)m++;var f=pos[m]>=half*.86?Math.min(1.2,Math.max(.86,half/pos[m])):1;pos=pos.map(function(p){return p*f});
    cs.forEach(function(c,k){var o=k-a;if(o>n/2)o-=n;if(o<-n/2)o+=n;var ab=Math.abs(o),s=sc(ab),x=(o<0?-1:1)*pos[ab],
        vis=Math.abs(x)-cw*s/2<W/2+4,prev=c.dataset.fo===undefined?o:+c.dataset.fo,ry=ab?(o<0?1:-1)*Math.min(16+ab*4,32):0;
      if(Math.abs(prev-o)>1||(prev*o<0&&ab>1)){c.style.transition='none';c.dataset.jump='1'}
      c.dataset.fo=o;
      c.style.transform='translate(-50%,-50%) translateX('+x.toFixed(1)+'px) translateY('+Math.min(ab*ab*5,40)+'px) scale('+s.toFixed(3)+')';
      c.style.zIndex=40-ab;c.style.opacity=vis?1:0;c.style.filter=ab?'brightness('+Math.max(.62,1-ab*.09).toFixed(2)+') saturate('+Math.max(.7,1-ab*.06).toFixed(2)+')':'none';
      if(!ab){}else{var im=c.querySelector('img');if(im)im.style.transform=''}});
    requestAnimationFrame(function(){cs.forEach(function(c){if(c.dataset.jump){c.offsetWidth;c.style.transition='';delete c.dataset.jump}})})}
  function queue(){if(busy)return;busy=true;Promise.resolve().then(function(){busy=false;fan()})}
  function step(st,d){var cs=[].slice.call(st.querySelectorAll('.mc-c')),on=st.querySelector('.mc-c.on'),a=Math.max(0,cs.indexOf(on)),t=cs[(a+d+cs.length)%cs.length];if(t)t.click()}
  function watch(){var st=document.getElementById('mcSt');if(!st||st.dataset.fan)return;st.dataset.fan='1';
    /* the page re-lays on every step; we only listen to class/children and only write style, so no loop */
    new MutationObserver(queue).observe(st,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});fan();
    /* drag / swipe through the seniors */
    var down=false,x0=0,moved=0,supp=false;
    st.addEventListener('pointerdown',function(e){if(e.button)return;down=true;x0=e.clientX;moved=0;supp=false});
    addEventListener('pointermove',function(e){if(!down)return;var dx=e.clientX-x0,stp=Math.max(46,(st.querySelector('.mc-c')||st).offsetWidth*.32);
      if(Math.abs(dx)>8&&!st.classList.contains('drag'))st.classList.add('drag');
      if(Math.abs(dx)>=stp){step(st,dx<0?1:-1);x0=e.clientX;moved++;supp=true}});
    addEventListener('pointerup',function(){if(!down)return;down=false;st.classList.remove('drag');if(moved)supp=true});
    addEventListener('pointercancel',function(){down=false;st.classList.remove('drag')});
    st.addEventListener('click',function(e){if(supp&&e.isTrusted){e.stopPropagation();e.preventDefault();supp=false}},true);
    st.addEventListener('dragstart',function(e){e.preventDefault()});
  }

  /* ---- nav: every link rolls to a hint of its page ---- */
  var HINT={'nv-c':'เปิดรับสมัคร','nv-w':'เกมของน้อง','nv-b':'รุ่นพี่ 48 คน'};
  function nav(){var nx=document.getElementById('nvNext');if(nx&&nx.textContent.indexOf('ถัดไป')===0)nx.textContent=nx.textContent;
    Object.keys(HINT).forEach(function(k){var a=document.querySelector('.nav-in>a.'+k);if(!a||a.querySelector('.roll'))return;var sp=a.querySelector('span');if(!sp)return;
      var r=el('span','roll'),one=el('span',null,sp.textContent),two=el('span','nx',HINT[k]);two.setAttribute('aria-hidden','true');r.appendChild(one);r.appendChild(two);a.replaceChild(r,sp)})}

  function go(){credits();watch();nav();addEventListener('resize',fan);addEventListener('hashchange',function(){setTimeout(function(){credits();watch();fan()},150)})}
  if(document.readyState==='complete')go();else addEventListener('load',go);
})();
</script>
