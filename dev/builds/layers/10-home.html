<!-- 10-home: home page art + feel (hero slime world, hamblob family, seed feeding, Port Express stage, peeks).
     Uses 05-hamblob (window.Hamblob) and 15-motion (window.Motion, ready on 'load'). Hall of Fame (.h5f) untouched. -->
<style id="ly-home">
/* ---------- retire old hero pieces ---------- */
[data-view="home"] .gl-goo,[data-view="home"] .dfc,[data-view="home"] .px-aura,[data-view="home"] .zq-sw .zq-ham{display:none!important}

/* ---------- hero: a slime world behind the search ---------- */
[data-view="home"] .zq{isolation:isolate}
[data-view="home"] .zq-top,[data-view="home"] .zq-q,[data-view="home"] .zq-sw,[data-view="home"] .zq-pop,[data-view="home"] .zq-pop span,[data-view="home"] .zq .tip{pointer-events:none}
[data-view="home"] .zq-sw .zq-orb{pointer-events:none!important}
[data-view="home"] .zq-h,[data-view="home"] .zq-sw>form,[data-view="home"] .zq-sw>.zq-sug,[data-view="home"] .zq-sw>.zq-res,[data-view="home"] .zq-pop button,[data-view="home"] .zq-res{pointer-events:auto}
.hm-w{position:absolute;inset:0;z-index:1;display:block;overflow:hidden;border-radius:inherit;cursor:default;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.hm-glow{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(46% 38% at 50% 44%,rgba(255,240,214,.55),rgba(255,240,214,0) 72%),
             radial-gradient(30% 26% at 22% 18%,rgba(255,215,160,.35),rgba(255,215,160,0) 70%),
             radial-gradient(34% 30% at 84% 30%,rgba(255,206,140,.32),rgba(255,206,140,0) 70%)}
.hm-l{position:absolute;left:-40px;right:-40px;bottom:-30px;pointer-events:none;will-change:transform}
.hm-l>svg{position:absolute;left:0;bottom:0;width:100%;height:100%;overflow:visible}
.hm-top{position:absolute;left:-40px;right:-40px;top:-6px;height:190px;pointer-events:none;will-change:transform}
.hm-top svg{width:100%;height:100%;overflow:visible}
.hm-top .hm-dr{transform-box:fill-box;transform-origin:50% 0;animation:hwDrip var(--t,6s) ease-in-out var(--d,0s) infinite alternate}
@keyframes hwDrip{to{transform:scaleY(var(--s,1.12))}}
.hm-b{position:absolute;pointer-events:auto;cursor:pointer}
.hm-b .hm-in,.hm-b .hm-j{display:block;transform-origin:50% 100%}
.hm-b .hb{display:block;width:100%}
.hm-hang{position:absolute;top:-6px;pointer-events:none;transform-origin:50% 0;animation:hwSway 5.5s ease-in-out infinite alternate}
.hm-hang .hm-b{position:relative;display:block}
.hm-hang .hb svg>ellipse,.pxe-astro .hb svg>ellipse,.pxe-peek svg>ellipse{display:none}
.hm-hang .hm-str{position:absolute;left:50%;top:0;z-index:2;pointer-events:none;overflow:visible}
@keyframes hwSway{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg)}}
.hm-dot{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 34% 30%,#FFF3DF 0 12%,#FFC57E 34%,#F09A35 72%,#DE8424 100%);box-shadow:0 10px 16px -8px rgba(140,60,0,.45);animation:hwFloat var(--t,7s) ease-in-out var(--d,0s) infinite alternate}
@keyframes hwFloat{to{transform:translateY(-14px) scale(1.04,.97)}}

/* the search bar hamster (one hamblob, sits on top of the bar) */
.hm-pet{position:absolute;right:var(--pr,124px);bottom:calc(100% - 9px);z-index:3;width:var(--ps,84px);display:block;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hm-pet .hm-pj,.hm-pet .hm-pc{display:block;transform-origin:50% 100%}
.hm-pet .hb{display:block;width:100%}
.hm-pet .hb.hm-hap{position:absolute;left:0;top:0;opacity:0;transition:opacity .12s}
.hm-pet .hb.hm-cal{transition:opacity .12s}
.hm-pet.eat .hb.hm-hap{opacity:1}.hm-pet.eat .hb.hm-cal{opacity:0}
.hm-pet.eat .hm-pc{animation:hwChew .19s ease-in-out 5}
@keyframes hwChew{50%{transform:scale(1.06,.93)}}
.hm-crumb{position:absolute;z-index:9;width:5px;height:4px;border-radius:2px;background:#EDE6DA;pointer-events:none}
[data-view="home"] .zq-sw .zq-s{transition:transform .35s cubic-bezier(.3,1.6,.5,1),box-shadow .3s!important}
[data-view="home"] .zq-sw .zq-s.hm-thud{transform:translateY(3px)!important;transition-duration:.08s!important}

/* ---------- Port Express: a deep-space stage ---------- */
[data-view="home"] .fx{position:relative}
[data-view="home"] .fx-main{border-radius:32px!important;color:#fff!important;
  background:radial-gradient(90% 80% at 100% 0%,rgba(155,130,255,.42),rgba(155,130,255,0) 60%),
             radial-gradient(70% 70% at 70% 115%,rgba(255,141,180,.28),rgba(255,141,180,0) 62%),
             linear-gradient(180deg,#261C64,#151038 70%,#120D30)!important;
  box-shadow:0 2px 0 rgba(255,255,255,.04) inset,0 50px 80px -46px rgba(48,22,110,.85),0 24px 40px -30px rgba(60,35,10,.5)!important}
[data-view="home"] .fx-main .fx-media{z-index:1;-webkit-mask-image:linear-gradient(90deg,#000 68%,rgba(0,0,0,.55) 86%,transparent);mask-image:linear-gradient(90deg,#000 68%,rgba(0,0,0,.55) 86%,transparent)}
[data-view="home"] .fx-main .fx-body{position:relative;z-index:2}
[data-view="home"] .fx-main .fx-body small{color:#FFC27A!important}
[data-view="home"] .fx-main .fx-d{color:rgba(255,255,255,.82)!important}
[data-view="home"] .fx-main .fx-f>span{background:rgba(255,255,255,.07)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:rgba(255,255,255,.7)!important;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
[data-view="home"] .fx-main .fx-t{background:linear-gradient(180deg,#fff 30%,#FFD9A8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pxe-sky{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;display:block}
.pxe-ring{position:absolute;inset:0;z-index:6;border-radius:inherit;pointer-events:none;padding:1.5px;
  background:linear-gradient(135deg,#FFE3A3,#F7A23E 30%,rgba(255,141,180,.6) 60%,rgba(155,130,255,.5) 85%,#FFE3A3);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.9}
[data-view="home"] .fx-main .rc{position:relative;margin-left:22px;padding:7px 16px 7px 34px!important;font-size:.9rem!important;color:#3A2200!important;
  background:linear-gradient(180deg,#FFF0C2,#FFD36B 45%,#F5B13A)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 10px 22px -10px rgba(255,190,70,.8)!important}
[data-view="home"] .fx-main .rc>svg{display:none}
.pxe-medal svg{width:100%!important;height:auto!important;display:block}
.pxe-medal{position:absolute;left:-28px;top:50%;width:52px;margin-top:-33px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));transform:rotate(-8deg);transform-origin:50% 30%;animation:pxMedal 4s ease-in-out infinite}
@keyframes pxMedal{50%{transform:rotate(6deg)}}
.pxe-astro{position:absolute;z-index:4;right:-26px;top:-86px;width:178px;pointer-events:none;transform:translate3d(var(--ax,0),var(--ay,0),0);transition:transform .9s cubic-bezier(.2,.8,.25,1)}
.pxe-astro .pxe-fl{display:block;animation:pxFloat 6.5s ease-in-out infinite}
.pxe-astro .hb{display:block;width:100%}
.pxe-astro .pxe-helm{position:absolute;left:0;top:0;width:100%;height:auto;overflow:visible}
@keyframes pxFloat{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-12px) rotate(4deg)}}

/* small hamblobs peeking over the two other course cards */
[data-view="home"] .fx-row{position:relative}
[data-view="home"] .fx-row .fx-s{z-index:2}
.pxe-peek{position:absolute;z-index:1;width:68px;pointer-events:none;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.pxe-peek.up{transform:translateY(-12px)}
.pxe-paw{position:absolute;z-index:3;width:17px;height:12px;border-radius:50%;pointer-events:none;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.pxe-paw.up{transform:translateY(-12px)}

/* hamblobs that replace the old drawn faces */
[data-view="home"] .zc2>.hm-zc{position:absolute!important;z-index:2!important;right:clamp(16px,4vw,64px);top:clamp(14px,2vw,26px);width:clamp(66px,7vw,96px);pointer-events:auto;cursor:pointer}
[data-view="home"] .end-in>.hm-end{position:absolute!important;z-index:1;left:50%;top:clamp(8px,1.4vw,16px);display:flex;align-items:flex-end;gap:2px;transform:translateX(-50%);pointer-events:auto}
.hm-end .hm-e{display:block;cursor:pointer;transform-origin:50% 100%}
.hm-end .hb{display:block;width:100%}

/* rails: room above and below so hover lift and shadows are not cut */
[data-view="home"] .mr-r{padding-top:16px!important;margin-top:-16px!important}

@media (max-width:640px){
  .pxe-astro{width:92px;right:-4px;top:-40px}
  .pxe-medal{width:46px;left:-24px;margin-top:-27px}
  .pxe-peek{width:54px}
  [data-view="home"] .fx-main .fx-media{-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent);mask-image:linear-gradient(180deg,#000 80%,transparent)}
}
@media (prefers-reduced-motion:reduce){
  .hm-top .hm-dr,.hm-hang,.hm-dot,.pxe-astro .pxe-fl,.pxe-medal{animation:none!important}
}
</style>
<script>
(function(){
  if(!window.Hamblob)return;
  var rm=matchMedia('(prefers-reduced-motion: reduce)').matches,NS='http://www.w3.org/2000/svg',H=window.Hamblob;
  var home=document.querySelector('[data-view="home"]');if(!home)return;
  var zq=home.querySelector('.zq');if(!zq)return;
  function el(t,a,k){var e=document.createElementNS(NS,t);for(var i in a)e.setAttribute(i,a[i]);(k||[]).forEach(function(c){e.appendChild(c)});return e}

  /* ================= hero: layered slime world ================= */

    mid:{c:['#F39A36','#DE7F20'],base:66,b:[[.18,.16,150],[.79,.13,118],[.45,.1,26]],k:.6},

  var S=1,W=0,layers={},scene=null,blobs=[],hang=null,top=null,dots=[];
  function hillSvg(name,d,w,hgt,f){

    svg.appendChild(el('path',{d:line+'L'+w+' '+hgt+'L0 '+hgt+'Z',fill:'url(#'+id+'g)'}));

    var sh=function(dy){return pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+(p[1]+dy).toFixed(1)}).join('')};
    svg.appendChild(el('path',{d:sh(10),fill:'none',stroke:'#fff','stroke-opacity':front?.16:.12,'stroke-width':14,'stroke-linecap':'round'}));
    svg.appendChild(el('path',{d:sh(4),fill:'none',stroke:'#fff','stroke-opacity':front?.55:.35,'stroke-width':2.4,'stroke-linecap':'round'}));
    svg.firstChild.appendChild(el('radialGradient',{id:id+'s'},[el('stop',{offset:0,'stop-color':'#fff','stop-opacity':front?.5:.32}),el('stop',{offset:1,'stop-color':'#fff','stop-opacity':0})]));
    d.b.forEach(function(b){if(b[2]<80||b[0]<0||b[0]>1)return;var x=b[0]*w,y=hgt-f(b[0]);svg.appendChild(el('ellipse',{cx:(x-w*.02).toFixed(1),cy:(y+16).toFixed(1),rx:(b[1]*w*.32).toFixed(1),ry:8,fill:'url(#'+id+'s)'}))});

  function topSvg(w,hgt){
    var R=rnd(11),svg=el('svg',{viewBox:'0 0 '+w+' '+hgt,preserveAspectRatio:'none','aria-hidden':'true'}),band=mob()?14:20;
    svg.appendChild(el('defs',{},[el('linearGradient',{id:'hwtg',x1:0,y1:0,x2:0,y2:1},[el('stop',{offset:0,'stop-color':'#FFD49A'}),el('stop',{offset:1,'stop-color':'#FFB45A'})])]));
    svg.appendChild(el('rect',{x:0,y:-10,width:w,height:band+10,fill:'url(#hwtg)'}));
    var x=0,out=[];
    while(x<w){var gw=50+R()*90,c=x+gw/2,long=R()<.38,L=long?40+R()*80*(mob()?.6:1):8+R()*16,bw=long?8+R()*6:10+R()*10;
      if(Math.abs(c/w-.5)<.2)L=Math.min(L,mob()?12:22); /* keep the middle calm, above the title */
      var d='M'+(c-bw*2.2).toFixed(1)+' '+(band-1)+'C'+(c-bw).toFixed(1)+' '+band+' '+(c-bw).toFixed(1)+' '+(band+L*.4).toFixed(1)+' '+(c-bw*.8).toFixed(1)+' '+(band+L*.75).toFixed(1)+
        'C'+(c-bw*.7).toFixed(1)+' '+(band+L+bw*1.3).toFixed(1)+' '+(c+bw*.7).toFixed(1)+' '+(band+L+bw*1.3).toFixed(1)+' '+(c+bw*.8).toFixed(1)+' '+(band+L*.75).toFixed(1)+
        'C'+(c+bw).toFixed(1)+' '+(band+L*.4).toFixed(1)+' '+(c+bw).toFixed(1)+' '+band+' '+(c+bw*2.2).toFixed(1)+' '+(band-1)+'Z';
      var g=el('g',{'class':'hm-dr'});g.style.setProperty('--t',(4+R()*4).toFixed(1)+'s');g.style.setProperty('--d','-'+(R()*4).toFixed(1)+'s');g.style.setProperty('--s',(long?1.06+R()*.12:1.15).toFixed(2));

      if(long)g.appendChild(el('ellipse',{cx:(c-bw*.35).toFixed(1),cy:(band+L+bw*.2).toFixed(1),rx:(bw*.22).toFixed(1),ry:(bw*.32).toFixed(1),fill:'#fff',opacity:.75}));
      svg.appendChild(g);out.push(g);x+=gw}
    svg.appendChild(el('path',{d:'M0 '+(band-4)+'H'+w,stroke:'#fff','stroke-opacity':.35,'stroke-width':2,fill:'none'}));
    return svg}

  /* hamblob family: [fur, shape, mood, layer, x(0..1), size, sink] */
  var FAM_D=[['mint','tall','happy','front',.05,92,6],['cream','loaf','calm','mid',.165,172,6],['ink','loaf','happy','mid',.268,88,4],

  var FAM_M=[['cream','loaf','calm','mid',.16,88,4],['lilac','tall','calm','far',.93,44,3],['pink','puddle','happy','front',.83,96,6]];
  var DOTS_D=[[.075,.33,22,'7s','0s'],[.3,.17,10,'6s','-2s'],[.71,.15,15,'8s','-1s'],[.94,.45,12,'6.5s','-3s']],DOTS_M=[[.1,.26,12,'7s','0s'],[.9,.47,9,'6s','-2s']];
  function mkBlob(f){var b=div('hm-b'),i=div('hm-in'),j=div('hm-j'),hb=H.make({fur:f[0],shape:f[1],mood:f[2],size:f[5]});
    b.style.width=f[5]+'px';j.appendChild(hb);i.appendChild(j);b.appendChild(i);b._f=f;b._hb=hb;b._j=j;b._in=i;
    var busy=0;function hop(){if(busy||rm)return;busy=1;H.squish(hb);
      j.animate([{transform:'none'},{transform:'scale(1.12,.86)',offset:.18},{transform:'translateY(-22px) scale(.92,1.08)',offset:.48},{transform:'scale(1.08,.92)',offset:.8},{transform:'none'}],{duration:620,easing:'ease-out'});setTimeout(function(){busy=0},640)}
    b.addEventListener('pointerenter',hop);b.addEventListener('pointerdown',hop);return b}
  function buildScene(){

  function layout(){
    if(!scene)return;var m=mob(),zw=zq.clientWidth;if(!zw)return;
    W=zw+80;S=m?.74:Math.min(1.1,Math.max(.7,zw/1400));
    scene.querySelectorAll('.hm-l,.hm-top,.hm-hang,.hm-dot').forEach(function(n){n.remove()});blobs=[];dots=[];layers={};
    /* top goo */
    top=div('hm-top','div');top.style.height=(m?110:190)+'px';top.appendChild(topSvg(W,m?110:190));scene.appendChild(top);top._k=.4;
    ['far','mid','front'].forEach(function(nm){var d=HILLS[nm],f=hfn(d,S),hgt=Math.ceil(Math.max.apply(null,[0,.2,.4,.6,.8,1].map(f).concat(d.b.map(function(b){return f(b[0])})))+40);
      var L=div('hm-l hm-'+nm,'div');L.style.height=hgt+'px';L.appendChild(hillSvg(nm,d,W,hgt,f));L._k=d.k;L._f=f;L._h=hgt;scene.appendChild(L);layers[nm]=L});
    /* droplets, behind the near hills */
    (m?DOTS_M:DOTS_D).forEach(function(o){var d=div('hm-dot');d.style.cssText='left:'+(o[0]*100)+'%;top:'+(o[1]*100)+'%;width:'+o[2]+'px;height:'+o[2]+'px;--t:'+o[3]+';--d:'+o[4];d._k=.8;scene.insertBefore(d,layers.mid);dots.push(d)});
    /* family */
    (m?FAM_M:FAM_D).forEach(function(f){var L=layers[f[3]],sz=Math.round(f[5]*(m?1:Math.max(.8,S))),b=mkBlob([f[0],f[1],f[2],f[3],f[4],sz,f[6]]),x=f[4]*(W-80)+40;
      b.style.left=(x-sz/2)+'px';b.style.bottom=(L._f(f[4]+(40/W)*(.5-f[4])*0)-f[6]-2)+'px';
      /* the svg has 10/190 padding under the base: drop it so the blob sits on the crest */
      b.style.marginBottom=(-sz*190/220*10/190)+'px';L.appendChild(b);blobs.push(b)});
    /* one sleepy blob hanging from the ceiling goo */
    hang=div('hm-hang','div');var hs=m?54:92,hx=m?.86:.8,strL=m?46:84;hang.style.left=(hx*zw-hs/2)+'px';hang.style.width=hs+'px';
    var hb=mkBlob(['sky','loaf','sleep','hang',hx,hs,0]);hb.style.marginTop=(strL-hs*.06)+'px';hang.appendChild(hb);
    var sw2=hs*.62,str=el('svg',{'class':'hm-str',width:sw2,height:strL+hs*.3,viewBox:'0 0 60 '+((strL+hs*.3)/sw2*60).toFixed(1),preserveAspectRatio:'none'}),L2=(strL+hs*.3)/sw2*60,y1=strL/sw2*60;str.style.marginLeft=(-sw2/2)+'px';
    str.innerHTML='<defs><linearGradient id="hmsg" x1="0" x2="1"><stop offset="0" stop-color="#FFB45A"/><stop offset=".35" stop-color="#FFD8A6"/><stop offset="1" stop-color="#F5A548"/></linearGradient></defs>'+
      '<path d="M-6 0H66C50 6 38 14 37 28V'+(y1-4).toFixed(1)+'C37 '+(y1+4).toFixed(1)+' 58 '+(y1+6).toFixed(1)+' 58 '+(L2-12).toFixed(1)+'C58 '+(L2-2).toFixed(1)+' 46 '+L2.toFixed(1)+' 30 '+L2.toFixed(1)+'C14 '+L2.toFixed(1)+' 2 '+(L2-2).toFixed(1)+' 2 '+(L2-12).toFixed(1)+'C2 '+(y1+6).toFixed(1)+' 23 '+(y1+4).toFixed(1)+' 23 '+(y1-4).toFixed(1)+'V28C22 14 10 6 -6 0Z" fill="url(#hmsg)"/>'+
      '<path d="M27 30V'+(y1-6).toFixed(1)+'" stroke="#fff" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="16" cy="'+(L2-11).toFixed(1)+'" rx="5" ry="3" fill="#fff" opacity=".7"/>';
    hang.appendChild(str);hang._k=.45;hang._str=str;str.style.transformOrigin='50% 0';scene.appendChild(hang);blobs.push(hb);
    par.cx=par.cy=par.tx=par.ty=0;apply();
  }
  /* pointer parallax, eased */
  var par={tx:0,ty:0,cx:0,cy:0,raf:0};
  function apply(){var all=[top,hang].concat(dots);for(var k in layers)all.push(layers[k]);
