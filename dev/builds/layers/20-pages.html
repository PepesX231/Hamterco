<style id="ly-pages">
/* ===== Pages layer (courses / activity / about / works sidebar). Prefix: pz- ===== */
[data-view="courses"],[data-view="activity"],[data-view="about"]{position:relative}
/* sections that sit over the goo pad paint after it (position without z-index = no new stacking context) */
[data-view="courses"]>.wrap,[data-view="activity"]>.av-h,[data-view="activity"]>.av-next,[data-view="about"]>.ab-win{position:relative}
[data-view="activity"]>.av-h,[data-view="activity"]>.av-next{background:transparent!important}
[data-view="about"] .ab-win{background:transparent!important}

/* ---------- the goo pad: a glossy orange band at the top of each page, with a few drips ---------- */
.pz-pad{position:absolute;left:12px;right:12px;top:12px;height:var(--pz-h,320px);pointer-events:none;border-radius:clamp(30px,3.4vw,48px)}
.pz-pad-in{position:absolute;inset:0;border-radius:inherit;overflow:hidden;
  background:linear-gradient(180deg,#FBB257 0%,#F7A23E 55%,#F29736 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.38),0 34px 60px -40px rgba(160,72,0,.6)}
.pz-pad-in::before{content:"";position:absolute;left:-6%;top:-40%;width:62%;height:120%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,226,180,.85),rgba(255,214,160,0));opacity:.75}
.pz-bub{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,236,205,.55),rgba(255,236,205,0));
  animation:pzDrift var(--t,14s) ease-in-out var(--d,0s) infinite alternate;will-change:transform}
@keyframes pzDrift{to{transform:translate(var(--dx,30px),var(--dy,-16px)) scale(1.12)}}
.pz-drip{position:absolute;left:0;top:calc(100% - 3px);overflow:visible}
.pz-drip .dr{transform-box:fill-box;transform-origin:50% 0;animation:pzDrip var(--t,5s) cubic-bezier(.45,0,.55,1) var(--d,0s) infinite}
@keyframes pzDrip{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.22)}}
/* text over the pad */
[data-view="courses"] .ct-h{padding-bottom:64px!important}
[data-view="courses"] .ct-h h1::before{background:rgba(255,246,232,.6)!important}
[data-view="courses"] .ct-h p,[data-view="activity"] .av-h p{color:rgba(29,23,18,.78)!important}
[data-view="activity"] .av-h h1{position:relative;z-index:0;width:fit-content;isolation:isolate;color:var(--ink)!important}
[data-view="activity"] .av-h h1::before{content:"";position:absolute;z-index:-1;left:-.1em;right:-.12em;bottom:.02em;height:.34em;border-radius:.2em;background:rgba(255,246,232,.6)}
[data-view="about"] .aw-k{color:var(--ink)!important}

/* ---------- hamblob scenes ---------- */
/* new.html has an old banner class ".hb" (purple bg, 100svh, overflow hidden): neutralise it on our hamblobs */
span.hb.pz-hb{display:inline-block;min-height:0!important;overflow:visible!important;background:none!important;color:inherit;align-items:normal}
span.hb.pz-hb::before{content:none!important}
.pz-scene{position:absolute;pointer-events:none;width:420px;height:250px;transform-origin:100% 100%;transform:scale(var(--pz-s,1))}
.pz-scene>*{position:absolute}
.pz-scene .hb,.pz-act{pointer-events:auto;cursor:pointer}
.pz-scene .hb{-webkit-tap-highlight-color:transparent}
.pz-c-scene{right:0;bottom:50px}
.pz-a-scene{right:0;bottom:26px}
@media (max-width:1100px){.pz-c-scene,.pz-a-scene{--pz-s:.72}}
@media (max-width:900px){.pz-c-scene,.pz-a-scene{--pz-s:.52;bottom:auto;top:var(--pz-top,0px);transform-origin:100% 0}.pz-beam{display:none}}
@media (max-width:900px){[data-view="courses"] .ct-h{padding-left:14px!important;padding-right:14px!important}
  [data-view="activity"] .av-h .av-in{padding-left:30px;padding-right:30px}.pz-a-scene{right:24px}}
@media (max-width:640px){.pz-c-scene,.pz-a-scene{--pz-s:.44}.pz-c-scene{right:-2px}.pz-a-scene{--pz-s:.38}}
.pz-beam{width:150px;height:260px;top:-30px;border-radius:50%;background:radial-gradient(50% 60% at 50% 0%,rgba(255,252,240,.55),rgba(255,252,240,0) 100%);transform-origin:50% 0;animation:pzBeam 7s ease-in-out infinite alternate}
@keyframes pzBeam{from{transform:rotate(var(--r0))}to{transform:rotate(var(--r1))}}
.pz-cf{width:var(--w,14px);height:calc(var(--w,14px)*.46);border-radius:99px;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55);
  animation:pzCf var(--t,6s) ease-in-out var(--d,0s) infinite alternate}
@keyframes pzCf{from{transform:translateY(0) rotate(var(--r,0deg))}to{transform:translateY(12px) rotate(calc(var(--r,0deg) + 50deg))}}

/* ================= COURSES ================= */
[data-view="courses"] .ft-hd h2::before{background:var(--or-l)}
[data-view="courses"] .fx{isolation:isolate}
.pz-peek{position:absolute;z-index:0;pointer-events:auto;cursor:pointer;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
[data-view="courses"] .fx-main:hover~.pz-peek,.pz-peek.up{transform:translateY(-10px)}
/* Port Express: same deep-space stage as on home (10-home), so the star course reads the same everywhere */
[data-view="courses"] .fx-main{border-radius:32px!important;color:#fff!important;
  background:radial-gradient(90% 80% at 100% 0%,rgba(155,130,255,.42),rgba(155,130,255,0) 60%),radial-gradient(70% 70% at 70% 115%,rgba(255,141,180,.28),rgba(255,141,180,0) 62%),linear-gradient(180deg,#261C64,#151038 70%,#120D30)!important;
  box-shadow:0 2px 0 rgba(255,255,255,.04) inset,0 50px 80px -46px rgba(48,22,110,.85),0 24px 40px -30px rgba(60,35,10,.5)!important}
[data-view="courses"] .fx-main .fx-media{z-index:1;-webkit-mask-image:linear-gradient(90deg,#000 76%,rgba(0,0,0,.6) 90%,transparent);mask-image:linear-gradient(90deg,#000 76%,rgba(0,0,0,.6) 90%,transparent)}
[data-view="courses"] .fx-main .fx-body{position:relative;z-index:2}
[data-view="courses"] .fx-main .fx-body small{color:#FFC27A!important}
[data-view="courses"] .fx-main .fx-d{color:rgba(255,255,255,.82)!important}
[data-view="courses"] .fx-main .fx-f>span{background:rgba(255,255,255,.07)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:rgba(255,255,255,.7)!important}
[data-view="courses"] .fx-main .fx-t{background:linear-gradient(180deg,#fff 30%,#FFD9A8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
[data-view="courses"] .fx-main .rc{color:#3A2200!important;background:linear-gradient(180deg,#FFF0C2,#FFD36B 45%,#F5B13A)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 10px 22px -10px rgba(255,190,70,.8)!important}
@media (max-width:640px){[data-view="courses"] .fx-main .fx-media{-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent);mask-image:linear-gradient(180deg,#000 80%,transparent)}}
/* course cards: a white mat around the poster, chips, springy hover and press */
[data-view="courses"] .ctg .qv{padding:8px!important;border-radius:28px!important;background:#fff!important;
  box-shadow:0 1px 0 rgba(60,35,10,.05),0 22px 40px -30px rgba(60,35,10,.55),inset 0 0 0 1px rgba(29,23,18,.06)!important;
  transition:transform .5s cubic-bezier(.3,1.45,.5,1),box-shadow .35s!important}
[data-view="courses"] .ctg .qv:hover{transform:translateY(-7px)!important;box-shadow:0 1px 0 rgba(60,35,10,.05),0 34px 50px -30px rgba(190,90,10,.6),inset 0 0 0 1px rgba(247,162,62,.35)!important}
[data-view="courses"] .ctg .qv:active{transform:translateY(-2px) scale(.975)!important;transition-duration:.12s!important}
[data-view="courses"] .ctg .qv:focus-visible{outline:3px solid var(--or);outline-offset:3px}
[data-view="courses"] .ctg .qv-im{border-radius:20px!important;isolation:isolate}
[data-view="courses"] .ctg .qv-im img{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
[data-view="courses"] .ctg .qv:hover .qv-im img{transform:scale(1.06)}
[data-view="courses"] .ctg .qv-im img[src*="dek69"]{object-position:50% 64%}
[data-view="courses"] .fx-si img[src*="dek69"]{object-position:50% 61%}
@media (max-width:640px){[data-view="courses"] .fx-si img[src*="dek69"]{object-position:50% 44%}}
[data-view="courses"] .ctg .qv-im::after{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 28%);box-shadow:inset 0 0 0 1px rgba(29,23,18,.08)}
[data-view="courses"] .ctg .qv-row{padding:14px 8px 0!important}
[data-view="courses"] .ctg .qv-meta{padding:0 8px 8px!important;gap:6px!important}
[data-view="courses"] .ctg .qv-meta>span{display:inline-flex;align-items:center;gap:5px;background:var(--cream);border-radius:999px;padding:5px 10px 5px 8px;font-size:.8rem;color:#5E544B}
[data-view="courses"] .ctg .qv-meta svg{width:14px;height:14px;color:var(--or-d)}
[data-view="courses"] .ctg .qv.on .qv-meta>span:first-child{background:#DDF6EC;color:#14674F}
[data-view="courses"] .ctg .qv.on .qv-meta>span:first-child svg{color:#26A386}
[data-view="courses"] .ctg .qv-meta em{font-style:normal;font-weight:700;color:var(--ink)}
/* status chips in the palette */
[data-view="courses"] .qv-live{background:#fff!important;color:#14674F!important;box-shadow:0 6px 14px -8px rgba(0,0,0,.45);padding:5px 11px 5px 9px!important}
[data-view="courses"] .qv-live::before{content:"";width:8px;height:8px;border-radius:50%;background:#26A386;box-shadow:0 0 0 0 rgba(38,163,134,.55);animation:pzPulse 1.8s ease-out infinite}
@keyframes pzPulse{70%{box-shadow:0 0 0 7px rgba(38,163,134,0)}100%{box-shadow:0 0 0 0 rgba(38,163,134,0)}}
[data-view="courses"] .qv-rc{background:linear-gradient(180deg,#FFC27A,#F7A23E)!important;color:var(--ink)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px -8px rgba(150,70,0,.7)!important}
[data-view="courses"] .ctg .qv-btn{transition:transform .45s cubic-bezier(.3,1.6,.5,1),background .2s,color .2s!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 16px -10px rgba(150,70,0,.8)!important}
[data-view="courses"] .ctg .qv:hover .qv-btn{background:var(--ink)!important;color:var(--or)!important;transform:scale(1.08) rotate(-8deg)}
[data-view="courses"] .ctg .qv.on:hover .qv-btn{transform:scale(1.08) translateX(3px)}
[data-view="courses"] .ctg .qv:hover .qv-btn svg{animation:pzRing .6s ease-in-out}
[data-view="courses"] .ctg .qv.on:hover .qv-btn svg{animation:none}
@keyframes pzRing{20%{transform:rotate(16deg)}45%{transform:rotate(-12deg)}70%{transform:rotate(6deg)}}
/* the open course gets a warm ring */
[data-view="courses"] .ctg .qv.on{box-shadow:0 1px 0 rgba(60,35,10,.05),0 26px 46px -28px rgba(200,95,10,.7),inset 0 0 0 2px var(--or)!important}
[data-view="courses"] .ct-all{position:relative;width:fit-content;isolation:isolate;color:var(--ink)!important}
[data-view="courses"] .ct-all::before{content:"";position:absolute;z-index:-1;left:-.12em;right:-.14em;bottom:.08em;height:.36em;border-radius:.2em;background:var(--or-l)}
/* the 3-question quiz: chips in the palette, springy press */
[data-view="courses"] .fit-q label{transition:transform .35s cubic-bezier(.3,1.6,.5,1),background .2s,box-shadow .2s}
[data-view="courses"] .fit-q label:hover{transform:translateY(-2px)}
[data-view="courses"] .fit-q label:active{transform:scale(.95)}
[data-view="courses"] .fit-q label:has(input:checked){background:var(--or)!important;color:var(--ink)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 16px -10px rgba(150,70,0,.8)!important}

/* ================= ACTIVITY ================= */
/* All for One keeps its own blue (it is the event's banner) */
[data-view="activity"] .avn{background:#1068DC!important;box-shadow:0 40px 70px -40px rgba(16,104,220,.75)!important;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
[data-view="activity"] .avn-m{background:#1068DC!important}
[data-view="activity"] .avn-m img{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
[data-view="activity"] .avn:hover .avn-m img{transform:scale(1.04)}
[data-view="activity"] .avn-d{color:#FFD24A!important}
[data-view="activity"] .avn-t>p{color:rgba(255,255,255,.88)!important}
[data-view="activity"] .avn-g b{color:#FFD24A!important}
[data-view="activity"] .avn-tag{background:#FFD24A!important;color:#0B1640!important;box-shadow:0 8px 18px -10px rgba(0,0,0,.6)}
[data-view="activity"] .avn-cd div{background:#0B1640!important;box-shadow:5px 5px 0 #FFD24A!important;color:#fff!important;border-radius:14px}
[data-view="activity"] .avn-cd span{color:#BFD3F3!important}
[data-view="activity"] .avn-b .b1{background:#FFD24A!important;color:#0B1640!important;border-radius:999px!important}
[data-view="activity"] .avn-b .b2{border-radius:999px!important}
[data-view="activity"] .avn-b a{transition:transform .35s cubic-bezier(.3,1.6,.5,1)!important}
[data-view="activity"] .avn-b a:active{transform:scale(.96)!important}
/* year headline */
[data-view="activity"] .av-top h2{color:var(--ink)!important}
#avCount{display:inline-block;min-width:1.6em;text-align:center;padding:.02em .32em .08em;margin:0 .08em;border-radius:.5em;transform:rotate(-4deg);
  background:radial-gradient(120% 90% at 30% 20%,#FFD08A,#F7A23E 55%,#D9741A);color:var(--ink);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 12px 22px -12px rgba(170,80,0,.8);font-variant-numeric:tabular-nums;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.av-top h2:hover #avCount{transform:rotate(3deg) scale(1.08)}
.pz-yr{display:inline-block;vertical-align:-.12em;width:1.5em;margin-left:.15em}
/* filters */
[data-view="activity"] .av-f button{border-radius:999px!important;background:#fff!important;color:var(--ink)!important;box-shadow:inset 0 0 0 1.5px rgba(29,23,18,.1);
  transition:transform .35s cubic-bezier(.3,1.6,.5,1),background .2s,box-shadow .2s!important;padding:9px 15px!important}
[data-view="activity"] .av-f button span{color:var(--or-d)!important}
[data-view="activity"] .av-f button:hover{background:var(--cream)!important;transform:translateY(-2px)}
[data-view="activity"] .av-f button:active{transform:scale(.94)}
[data-view="activity"] .av-f button[aria-pressed="true"]{background:var(--ink)!important;color:#fff!important;box-shadow:0 10px 20px -12px rgba(29,23,18,.8)}
[data-view="activity"] .av-f button[aria-pressed="true"] span{color:var(--or)!important}
/* event cards */
[data-view="activity"] .avc{padding:8px;border-radius:28px!important;background:#fff!important;
  box-shadow:0 1px 0 rgba(60,35,10,.05),0 22px 40px -30px rgba(60,35,10,.55),inset 0 0 0 1px rgba(29,23,18,.06)!important;
  transition:transform .5s cubic-bezier(.3,1.45,.5,1),box-shadow .35s!important}
[data-view="activity"] .avc:hover{transform:translateY(-7px)!important;box-shadow:0 1px 0 rgba(60,35,10,.05),0 34px 50px -30px rgba(190,90,10,.55),inset 0 0 0 1px rgba(247,162,62,.35)!important}
[data-view="activity"] .avc:active{transform:translateY(-2px) scale(.975)!important;transition-duration:.12s!important}
[data-view="activity"] .avc-m{border-radius:20px;position:relative;isolation:isolate;background:var(--pz-bg,#FFF3E3)!important}
[data-view="activity"] .avc-m::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 30%);box-shadow:inset 0 0 0 1px rgba(29,23,18,.08)}
[data-view="activity"] .avc-m>img{transition:transform .8s cubic-bezier(.2,.8,.2,1)!important}
[data-view="activity"] .avc:hover .avc-m>img{transform:scale(1.06)!important}
[data-view="activity"] .avc-t{padding:14px 10px 10px!important}
[data-view="activity"] .avc-d span{background:var(--pz-chip,#FFE3C2)!important;color:var(--ink)!important;border-radius:999px!important}
[data-view="activity"] .avc-g{color:#8A4A0A!important}
/* cards without a poster: a soft pastel stage with a hamblob, instead of the same black tile 11 times */
[data-view="activity"] .avc-ty{background:radial-gradient(120% 100% at 20% 0%,var(--pz-l,#FFE9CC),var(--pz-bg,#FFD7A3))!important}
[data-view="activity"] .avc-ty b{color:var(--ink)!important;max-width:58%!important}
[data-view="activity"] .avc-ty>img{display:none!important}
[data-view="activity"] .avc-ty .hb{position:absolute;right:6%;bottom:4%;width:40%;max-width:150px;z-index:1}
[data-view="activity"] .avc-ty::before{content:"";position:absolute;right:-10%;top:-30%;width:70%;height:120%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,0))}
/* photo collage */
[data-view="activity"] .av-pg img{border-radius:22px!important;box-shadow:0 22px 40px -30px rgba(60,35,10,.6);transition:transform .5s cubic-bezier(.3,1.45,.5,1),box-shadow .35s}
[data-view="activity"] .av-pg img:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 30px 50px -30px rgba(190,90,10,.55)}
[data-view="activity"] .av-ph h2{color:var(--ink)!important}
[data-view="activity"] .av-cta>.av-in{box-shadow:0 26px 50px -36px rgba(170,80,0,.55)}

/* ================= ABOUT ================= */
[data-view="about"] .aw-g figure{padding:8px;border-radius:28px!important;background:#fff!important;
  box-shadow:0 1px 0 rgba(60,35,10,.05),0 26px 46px -30px rgba(120,55,0,.6)!important;transition:transform .5s cubic-bezier(.3,1.45,.5,1),box-shadow .35s}
[data-view="about"] .aw-g figure:hover{transform:translateY(-7px) rotate(-.5deg)}
[data-view="about"] .aw-g figure:nth-child(even):hover{transform:translateY(-7px) rotate(.5deg)}
[data-view="about"] .aw-g img{border-radius:20px;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
[data-view="about"] .aw-g figcaption{padding:14px 10px 12px!important}
[data-view="about"] .aw-g b{background:linear-gradient(180deg,#F7A23E,#D9741A);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--or-d)!important;width:fit-content}
[data-view="about"] .aw-g span{color:#5E544B!important}
[data-view="about"] .aw-g b{white-space:nowrap;font-size:clamp(1.45rem,2.4vw,1.9rem)!important}
[data-view="about"] .aw-g img[src*="dek69"]{object-position:50% 60%}
[data-view="about"] .aw-g figure.nopic{position:relative;background:radial-gradient(120% 80% at 30% 0%,#3A2E25,#1D1712 70%)!important;padding:8px 18px 20px}
[data-view="about"] .aw-g figure.nopic b{background:none;-webkit-text-fill-color:#FFC27A;color:#FFC27A!important}
[data-view="about"] .aw-g figure.nopic span{color:rgba(255,255,255,.82)!important}
[data-view="about"] .aw-g figure.nopic figcaption{position:relative;z-index:1}
.pz-sold{position:absolute;left:50%;top:9%;width:min(72%,190px);transform:translateX(-50%)}
.pz-sold .hb{width:100%}
/* collage + family */
[data-view="about"] .ab-bento{position:relative}
[data-view="about"] .ab-bento img{box-shadow:0 22px 40px -30px rgba(60,35,10,.6);transition:transform .5s cubic-bezier(.3,1.45,.5,1)}
[data-view="about"] .ab-bento img:hover{transform:translateY(-4px)}
.pz-fam{position:absolute;right:6px;bottom:calc(100% - 34px);width:320px;height:150px;transform-origin:100% 100%;transform:scale(var(--pz-s,1));pointer-events:none;z-index:2}
.pz-fam>*{position:absolute}
.pz-fam .hb{pointer-events:auto;cursor:pointer}
@media (max-width:900px){.pz-fam{--pz-s:.7}}
@media (max-width:640px){.pz-fam{--pz-s:.5;right:6px;bottom:calc(100% - 34px)}}
/* what we do: startup first */
.pz-glow{position:absolute;z-index:0;border-radius:32px;pointer-events:none;filter:blur(24px);opacity:1;
  background:conic-gradient(from var(--a,0deg),#F7A23E,#FF8DB4,#9B82FF,#FFC27A,#F7A23E);animation:spinA 8s linear infinite}
[data-view="about"] .ab-do2 .wrap{position:relative;isolation:isolate}
[data-view="about"] .ad-big{position:relative;z-index:1;background:var(--ink)!important;transition:transform .5s cubic-bezier(.3,1.4,.5,1)!important}
[data-view="about"] .ad-big .ad-im{background:#120D0A!important}
[data-view="about"] .ad-big .ad-im img{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
[data-view="about"] .ad-big:hover .ad-im img{transform:scale(1.04)}
[data-view="about"] .ad-big:hover{transform:translateY(-4px)!important}
[data-view="about"] .ad-tx{position:relative}
[data-view="about"] .ad-tx small{align-self:flex-start;background:linear-gradient(180deg,#FFC27A,#F7A23E);color:var(--ink)!important;padding:6px 12px;border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
[data-view="about"] .ad-tx b .nw{color:var(--or)}
[data-view="about"] .ad-tx>span{color:rgba(255,255,255,.8)!important}
[data-view="about"] .ad-tx .oc-st{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:8px 0 0;counter-reset:pzs}
