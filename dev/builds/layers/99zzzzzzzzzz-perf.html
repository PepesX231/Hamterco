<style id="ly-perf2">
/* speed: the orb is already a soft radial gradient, its 24px blur over a 2400px box cost a full repaint every frame */
html body .zq-orb{filter:none!important}
/* the search bar's frosted-glass blur sat on top of an animated canvas, so it was re-blurred every frame; a near-solid fill looks the same */
html body #zqForm.zq-s{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:rgba(255,253,248,.94)!important}
/* hold looping animations that are off screen (set by the script below) */
.pf-off,.pf-off *,.pf-off::before,.pf-off::after{animation-play-state:paused!important}
</style>
<script>(function(){
  /* pause every large looping CSS animation while it is off screen; looks identical, frees the GPU while scrolling elsewhere */
  function go(){if(!('IntersectionObserver' in window))return;var io=new IntersectionObserver(function(es){es.forEach(function(e){e.target.classList.toggle('pf-off',!e.isIntersecting)})},{rootMargin:'200px 0px'});
    [].forEach.call(document.querySelectorAll('main *'),function(el){var s=getComputedStyle(el);if(s.animationName==='none'||s.animationIterationCount.indexOf('infinite')<0)return;
      var r=el.getBoundingClientRect();if(r.width*r.height<60000)return;var host=el.closest('section')||el;io.observe(host)})}
  if(document.readyState==='complete')setTimeout(go,1500);else addEventListener('load',function(){setTimeout(go,1500)})})();</script>
