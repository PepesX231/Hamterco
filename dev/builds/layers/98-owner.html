<style id="ly-owner">

<style>
/* home courses: one grid of course cards with real banners (Port Express open now, the rest mocked as next round) */
[data-view="home"] .fx>.fx-main,[data-view="home"] .fx>.fx-row,[data-view="home"] .fx .cl2-next{display:none!important}
.ow-cg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.ow-c{display:flex;flex-direction:column;background:#fff;border-radius:22px;overflow:hidden;color:#1D1712;text-decoration:none;
  box-shadow:0 1px 0 rgba(29,23,18,.05),0 0 0 1px rgba(29,23,18,.07);transition:transform .2s cubic-bezier(.23,1,.32,1),box-shadow .2s}
@media (hover:hover){.ow-c:hover{transform:translateY(-3px);box-shadow:0 0 0 1px rgba(29,23,18,.1),0 18px 34px -22px rgba(29,23,18,.45)}}
.ow-c:active{transform:translateY(0) scale(.99)}
.ow-im{position:relative;aspect-ratio:16/9;background:#FFF3E3;overflow:hidden}
.ow-im img,.ow-im video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ow-st{position:absolute;right:12px;top:12px;font:700 .8rem/1 var(--display);padding:7px 11px;border-radius:999px;background:#fff;color:#1D1712}
.ow-st.on{color:#0E7A43}.ow-st.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#06C755;margin-right:6px;vertical-align:1px}
.ow-b{display:flex;flex-direction:column;gap:6px;padding:18px 20px 20px;flex:1}
.ow-b b{font:700 1.3rem/1.2 var(--display)}
.ow-b p{margin:0;font-size:.97rem;line-height:1.55;color:rgba(29,23,18,.72)}
.ow-m{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:auto;padding-top:12px;font:600 .92rem/1.3 var(--display)}
.ow-m span{color:rgba(29,23,18,.6);font-weight:500}
.ow-c.big{grid-column:span 3;flex-direction:row}
.ow-c.big .ow-im{flex:0 0 58%;aspect-ratio:auto;min-height:340px}
.ow-c.big .ow-b{padding:34px 36px;justify-content:center;gap:10px}
.ow-c.big .ow-b b{font-size:2.3rem}
.ow-c.big .ow-b p{font-size:1.06rem}
.ow-c.big .ow-m{margin-top:14px;font-size:1.05rem;gap:10px 26px}
.ow-go{display:inline-flex;align-self:flex-start;margin-top:18px;background:#1D1712;color:#FFF6E8;font:700 1rem/1 var(--display);padding:14px 22px;border-radius:999px}
.ow-nt{font:600 .92rem/1 var(--display);color:#B85F14;margin-top:10px}
@media (max-width:960px){.ow-cg{grid-template-columns:repeat(2,minmax(0,1fr))}.ow-c.big{grid-column:span 2}}
@media (max-width:640px){.ow-cg{grid-template-columns:minmax(0,1fr);gap:16px}.ow-c.big{grid-column:auto;flex-direction:column}
  .ow-c.big .ow-im{flex:none;aspect-ratio:16/9;min-height:0}.ow-c.big .ow-b{padding:22px 20px}.ow-c.big .ow-b b{font-size:1.8rem}}
</style>
