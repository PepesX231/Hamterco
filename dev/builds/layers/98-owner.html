<style id="ly-sn2">
/* ===== seniors: modern split, number + university bars on the left, two moving rows of real posters on the right ===== */
html body [data-view="home"] .mc .mc-st,html body [data-view="home"] .mc .mc-cap,html body [data-view="home"] .mc .mc-bg,html body [data-view="home"] .mc .mc-u,html body [data-view="home"] .mc .cl2-sen,html body [data-view="home"] .mc .cl2-uni{display:none!important}
.sn2{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,4vw,64px);align-items:center;max-width:1240px;margin:0 auto;text-align:left}
html body [data-view="home"] .mc .mc-in{max-width:none!important}
html body [data-view="home"] .mc .mc-h{text-align:left!important}
html body [data-view="home"] .mc .mc-k{margin:0 0 6px!important;font:600 1rem/1.3 var(--display)!important;color:#B85F14!important}
html body [data-view="home"] .mc h2{text-align:left!important;font:700 clamp(1.6rem,2.6vw,2.2rem)/1.2 var(--display)!important;margin:0!important;color:#1D1712!important}
html body [data-view="home"] .mc h2 span{display:block!important;font:800 clamp(5rem,10vw,8.6rem)/.95 var(--display)!important;letter-spacing:-.04em;color:#1D1712!important;margin-top:8px;background:none!important;-webkit-text-fill-color:currentColor!important}
.sn2-bars{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:8px;max-width:440px}
.sn2-bars button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:7.5em 1fr 2.4em;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;font:600 1rem/1.2 var(--display);color:#1D1712;transition:background .18s}
.sn2-bars button:hover{background:rgba(29,23,18,.05)}
.sn2-bars button[aria-pressed="true"]{background:#1D1712;color:#FFF6E8}
.sn2-bars i{display:block;height:10px;border-radius:99px;background:rgba(29,23,18,.08);overflow:hidden}
.sn2-bars i::after{content:"";display:block;height:100%;width:var(--w);border-radius:inherit;background:#F2A65E}
.sn2-bars button[aria-pressed="true"] i{background:rgba(255,246,232,.18)}
.sn2-bars b{text-align:right;font-weight:700}
.sn2-all{margin-top:14px;font:600 .95rem/1 var(--display);color:rgba(29,23,18,.6)}
.sn2-all button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.sn2-rows{position:relative;display:grid;gap:14px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.sn2-row{display:flex;gap:14px;width:max-content;animation:sn2Mv var(--d,60s) linear infinite}
.sn2-row.r2{animation-direction:reverse}
.sn2-rows:hover .sn2-row,.sn2-rows:focus-within .sn2-row{animation-play-state:paused}
@keyframes sn2Mv{to{transform:translateX(-50%)}}
.sn2-c{flex:0 0 auto;width:clamp(150px,13vw,190px);margin:0;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(29,23,18,.07)}
.sn2-c img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 0}
.sn2-c figcaption{padding:9px 11px 11px;font:600 .9rem/1.3 var(--display);color:#1D1712}
.sn2-c figcaption span{display:block;font:500 .8rem/1.35 var(--body,inherit);color:rgba(29,23,18,.62);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html body [data-view="home"] .mc .lk{display:inline-flex!important;margin:22px 0 0!important}
@media (max-width:860px){.sn2{grid-template-columns:minmax(0,1fr)}.sn2-c{width:150px}}
@media (prefers-reduced-motion:reduce){.sn2-row{animation:none}.sn2-rows{overflow-x:auto}}
</style>
<script>
(function(){
  function $(s,r){return (r||document).querySelector(s)}function $$(s,r){return [].slice.call((r||document).querySelectorAll(s))}
  function build(){
    var mc=$('[data-view="home"] .mc');if(!mc||$('.sn2',mc))return true;
    var src=$$('#sgrid figure');if(!src.length)return false;
    var h=$('.mc-h',mc),lk=$('.lk',mc),btns=$$('.mc-u button',mc);
    var wrap=document.createElement('div');wrap.className='sn2';mc.querySelector('.mc-in').insertBefore(wrap,h);
    var left=document.createElement('div');left.className='sn2-l';wrap.appendChild(left);left.appendChild(h);
    var max=0,data=btns.filter(function(b){return b.dataset.u}).map(function(b){var n=+(($('b',b)||{}).textContent||0);max=Math.max(max,n);return{u:b.dataset.u,n:n,name:b.textContent.replace(/\d+/,'').trim()}});
    var ul=document.createElement('ul');ul.className='sn2-bars';ul.setAttribute('aria-label','ดูตามมหาวิทยาลัย');
    ul.innerHTML=data.map(function(d){return '<li><button type="button" aria-pressed="false" data-u="'+d.u+'"><span>'+d.name+'</span><i style="--w:'+Math.round(d.n/max*100)+'%"></i><b>'+d.n+'</b></button></li>'}).join('');
    left.appendChild(ul);
    var all=document.createElement('p');all.className='sn2-all';all.innerHTML='<button type="button">ดูทุกมหาวิทยาลัย</button>';left.appendChild(all);
    if(lk)left.appendChild(lk);
    var rows=document.createElement('div');rows.className='sn2-rows';rows.setAttribute('aria-label','รุ่นพี่ที่ติดมหาวิทยาลัย');wrap.appendChild(rows);
    var cards=src.map(function(f){var im=$('img',f),cap=$('figcaption',f);var c=document.createElement('figure');c.className='sn2-c';c.dataset.u=f.dataset.u||'';
      var nm=cap&&cap.querySelector('b'),rest=cap&&cap.querySelector('span');
      c.innerHTML='<img src="'+im.getAttribute('src')+'" alt="'+(im.alt||'').replace(/"/g,'&quot;')+'" loading="lazy" decoding="async"><figcaption></figcaption>';
      var fc=c.querySelector('figcaption');fc.appendChild(document.createTextNode(nm?nm.textContent:''));
      if(rest){var sp=document.createElement('span');sp.textContent=rest.innerHTML.split(/<br\s*\/?>/i).map(function(x){var d=document.createElement('div');d.innerHTML=x;return d.textContent.trim()}).join(' · ');fc.appendChild(sp)}
      return c});
    function fill(k){rows.innerHTML='';var list=cards.filter(function(c){return !k||c.dataset.u===k});if(!list.length)list=cards;
      var half=Math.ceil(list.length/2),sets=k?[list]:[list.slice(0,half),list.slice(half)];
      sets.forEach(function(set,i){var r=document.createElement('div');r.className='sn2-row'+(i?' r2':'');
        var base=set.slice();while(base.length<6)base=base.concat(set);
        base.concat(base).forEach(function(c,j){var n=c.cloneNode(true);if(j>=base.length)n.setAttribute('aria-hidden','true');r.appendChild(n)});
        r.style.setProperty('--d',(base.length*5)+'s');rows.appendChild(r)})}
    fill('');
    function pick(k){$$('button',ul).forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.u===k))});fill(k)}
    ul.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;pick(b.getAttribute('aria-pressed')==='true'?'':b.dataset.u)});
    all.addEventListener('click',function(){pick('')});
    return true}
  var n=0;(function t(){if(build()||++n>40)return;setTimeout(t,250)})();
})();
</script>
<style>
.ow-bn{position:absolute!important;inset:0;width:100%!important;height:100%!important;object-fit:cover;z-index:1;display:block}
</style>
<script>
(function(){
  var MAP={'hamstarter':'cb-hamstarter','port70':'cb-port70','project express':'cb-pexp','national project':'cb-national','business project':'cb-business','python pro pack':'cb-python'};
  function key(t){return (t||'').toLowerCase().replace(/\s+/g,' ').trim()}
  function run(){
    /* seniors captions: name + faculty on separate lines */
    [].forEach.call(document.querySelectorAll('.sn2-c figcaption'),function(fc){if(fc.dataset.ok)return;fc.dataset.ok=1});
    /* the two secondary course cards on home and courses: portrait banners instead of a congratulation poster */
    [].forEach.call(document.querySelectorAll('.fx-row .fx-s'),function(c){var b=c.querySelector('.fx-sb>b');var k=key(b&&b.textContent);var im=c.querySelector('.fx-si img');
      if(!im||im.dataset.ow)return;if(k==='hamstarter'){im.src='img/cbp-hamstarter.webp';im.dataset.ow=1}else if(k==='national project'){im.src='img/cbp-national.webp';im.dataset.ow=1}});
    /* course rail type covers: the course banner on top */
    [].forEach.call(document.querySelectorAll('.rv-cv'),function(cv){if(cv.parentNode.querySelector('.ow-bn'))return;var b=cv.querySelector('b');var f=MAP[key(b&&b.textContent)];if(!f)return;
      var i=document.createElement('img');i.className='ow-bn';i.src='img/'+f+'.webp';i.alt='';i.loading='lazy';cv.parentNode.appendChild(i)});
  }
  var n=0;(function t(){run();if(++n<20)setTimeout(t,400)})();
  addEventListener('hashchange',function(){setTimeout(run,300)});
})();
</script>
