<style id="ly-hamblob">
/* ===== Hamblob: Hamster Hub's soft-blob mascot family (ref: soft gradient blobs, tiny dot eyes) ===== */
span.hb{position:relative;display:inline-block;line-height:0;pointer-events:none;background:none!important;padding:0!important;margin:0;min-height:0!important;border-radius:0!important;overflow:visible!important;color:inherit;text-align:left}
span.hb::before,span.hb::after{content:none!important;display:none!important}
span.hb g.hb-b{display:inline}
.hb svg{width:100%;height:auto;overflow:visible;display:block}
.hb .hb-b{transform-box:fill-box;transform-origin:50% 100%;animation:hbBreath var(--br,3.6s) cubic-bezier(.45,0,.55,1) var(--bd,0s) infinite}
.hb .hb-e{transform-box:fill-box;transform-origin:50% 50%;transition:transform .07s}
.hb.blink .hb-e{transform:scaleY(.12)}
.hb .hb-f{transition:transform .22s cubic-bezier(.2,.8,.3,1)}
.hb .hb-ear{transform-box:fill-box;transform-origin:50% 90%;transition:transform .45s cubic-bezier(.3,1.7,.45,1)}
@keyframes hbBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
.hb.squish .hb-b{animation:hbSquish .7s cubic-bezier(.3,.7,.4,1)}
.hb.squish .hb-ear.l{transform:rotate(-16deg)}.hb.squish .hb-ear.r{transform:rotate(16deg)}
@keyframes hbSquish{0%{transform:scale(1)}16%{transform:scale(1.14,.82)}38%{transform:translateY(-14%) scale(.9,1.12)}62%{transform:scale(1.07,.93)}80%{transform:scale(.98,1.02)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.hb .hb-b{animation:none!important}}
</style>
<script>
/* window.Hamblob.make({fur, size, mood, seed, ears, face}) -> <span class="hb"> */
(function(){
  var NS='http://www.w3.org/2000/svg',uid=0;
  var FUR={
    orange:['#FFD08A','#F7A23E','#D9741A'],  /* light, mid, deep */
    cream:['#FFFFFF','#FFEBD0','#F2C79A'],
    pink:['#FFC7DA','#FF8DB4','#E0558C'],
    lilac:['#D9CCFF','#9B82FF','#6A4BE0'],
    sky:['#CDEBFF','#6FC3FF','#2F8FE0'],
    mint:['#C9F5E6','#5FD3B4','#26A386'],
    ink:['#5A4A40','#2A211B','#120D0A']
  };
  function el(t,a,k){var e=document.createElementNS(NS,t);for(var i in a)e.setAttribute(i,a[i]);(k||[]).forEach(function(c){e.appendChild(c)});return e}
  function cr(p){var n=p.length,d='M'+p[0][0]+' '+p[0][1];for(var i=0;i<n;i++){var a=p[(i-1+n)%n],b=p[i],c=p[(i+1)%n],e=p[(i+2)%n];
    d+='C'+(b[0]+(c[0]-a[0])/6).toFixed(1)+' '+(b[1]+(c[1]-a[1])/6).toFixed(1)+' '+(c[0]-(e[0]-b[0])/6).toFixed(1)+' '+(c[1]-(e[1]-b[1])/6).toFixed(1)+' '+c[0].toFixed(1)+' '+c[1].toFixed(1)}return d+'Z'}
  /* silhouettes: a sitting hamster loaf, one continuous soft outline (viewBox 0 0 200 170, base at y=160) */
  var SIL={
    loaf:[[100,26],[134,30],[160,48],[176,80],[182,116],[176,146],[150,160],[100,163],[50,160],[24,146],[18,116],[24,80],[40,48],[66,30]],
    tall:[[100,14],[128,20],[148,42],[158,78],[164,118],[158,148],[134,161],[100,164],[66,161],[42,148],[36,118],[42,78],[52,42],[72,20]],
    puddle:[[100,64],[138,66],[168,84],[188,116],[194,146],[176,160],[100,164],[24,160],[6,146],[12,116],[32,84],[62,66]]
  };
  var EARS={loaf:[[56,40],[144,40]],tall:[[66,28],[134,28]],puddle:[[66,74],[134,74]]};
  function make(o){
    o=o||{};var id='hb'+(++uid),f=FUR[o.fur||'orange'],shape=o.shape||'loaf',P=SIL[shape],E=EARS[shape],ink='#1D1712';
    var top=P[0][1],eyeY=shape==='puddle'?110:shape==='tall'?92:96,gap=shape==='puddle'?20:18;
    var svg=el('svg',{viewBox:'-10 -10 220 190','aria-hidden':'true'});
    var defs=el('defs',{},[
      el('radialGradient',{id:id+'g',cx:'34%',cy:'26%',r:'82%'},[el('stop',{offset:'0','stop-color':f[0]}),el('stop',{offset:'.48','stop-color':f[1]}),el('stop',{offset:'1','stop-color':f[2]})]),
      el('radialGradient',{id:id+'r',cx:'70%',cy:'86%',r:'50%'},[el('stop',{offset:'0','stop-color':f[2],'stop-opacity':'.55'}),el('stop',{offset:'1','stop-color':f[2],'stop-opacity':'0'})]),
      el('radialGradient',{id:id+'h',cx:'50%',cy:'50%',r:'50%'},[el('stop',{offset:'0','stop-color':'#fff','stop-opacity':'.95'}),el('stop',{offset:'1','stop-color':'#fff','stop-opacity':'0'})]),
      el('radialGradient',{id:id+'c',cx:'50%',cy:'50%',r:'50%'},[el('stop',{offset:'0','stop-color':'#FF6F9A','stop-opacity':'.55'}),el('stop',{offset:'1','stop-color':'#FF6F9A','stop-opacity':'0'})]),
      el('filter',{id:id+'s',x:'-30%',y:'-30%',width:'160%',height:'170%'},[el('feGaussianBlur',{stdDeviation:'7'})])
    ]);svg.appendChild(defs);
    /* contact shadow */
    svg.appendChild(el('ellipse',{cx:100,cy:166,rx:78,ry:9,fill:'rgba(60,30,5,.22)',filter:'url(#'+id+'s)'}));
    var b=el('g',{'class':'hb-b'});
    /* ears: soft rounded bumps behind the head, inner pink fades */
    if(o.ears!==false)E.forEach(function(e,i){var s=i?1:-1,g=el('g',{'class':'hb-ear '+(i?'r':'l')});
      g.appendChild(el('path',{d:cr([[e[0]-18,e[1]+16],[e[0]-18,e[1]-1],[e[0]-9,e[1]-14],[e[0]+s*2,e[1]-16],[e[0]+10,e[1]-13],[e[0]+18,e[1]-1],[e[0]+18,e[1]+16],[e[0],e[1]+22]]),fill:'url(#'+id+'g)'}));
      g.appendChild(el('ellipse',{cx:e[0]+s*1,cy:e[1]-3,rx:8,ry:7,fill:'#FF9FBF',opacity:.75}));b.appendChild(g)});
    b.appendChild(el('path',{d:cr(P),fill:'url(#'+id+'g)'}));
    b.appendChild(el('path',{d:cr(P),fill:'url(#'+id+'r)'}));
    /* inner glow + glossy highlight, like the refs */
    b.appendChild(el('ellipse',{cx:70,cy:top+30,rx:24,ry:13,fill:'url(#'+id+'h)',transform:'rotate(-24 70 '+(top+30)+')'}));
    b.appendChild(el('ellipse',{cx:150,cy:142,rx:16,ry:8,fill:'#fff',opacity:.12}));
    /* face group (moves to look at the pointer) */
    var fc=el('g',{'class':'hb-f'});
    fc.appendChild(el('ellipse',{cx:100-gap-16,cy:eyeY+16,rx:15,ry:9,fill:'url(#'+id+'c)'}));
    fc.appendChild(el('ellipse',{cx:100+gap+16,cy:eyeY+16,rx:15,ry:9,fill:'url(#'+id+'c)'}));
    var mood=o.mood||'calm',ec=o.fur==='ink'?'#fff':ink;
    [-1,1].forEach(function(s){var x=100+s*gap,g=el('g',{'class':'hb-e'});
      if(mood==='happy')g.appendChild(el('path',{d:'M'+(x-6)+' '+(eyeY+2)+' Q'+x+' '+(eyeY-6)+' '+(x+6)+' '+(eyeY+2),stroke:ec,'stroke-width':3.6,'stroke-linecap':'round',fill:'none'}));
      else if(mood==='sleep')g.appendChild(el('path',{d:'M'+(x-6)+' '+eyeY+' Q'+x+' '+(eyeY+5)+' '+(x+6)+' '+eyeY,stroke:ec,'stroke-width':3.2,'stroke-linecap':'round',fill:'none'}));
      else{g.appendChild(el('ellipse',{cx:x,cy:eyeY,rx:5.4,ry:6.4,fill:ec}));g.appendChild(el('circle',{cx:x+1.6,cy:eyeY-2,r:1.8,fill:o.fur==='ink'?ink:'#fff'}))}
      fc.appendChild(g)});
    if(mood==='wow')fc.appendChild(el('ellipse',{cx:100,cy:eyeY+16,rx:4,ry:5,fill:ec}));
    else if(mood!=='sleep')fc.appendChild(el('path',{d:'M93 '+(eyeY+13)+' Q96.5 '+(eyeY+17)+' 100 '+(eyeY+13.5)+' Q103.5 '+(eyeY+17)+' 107 '+(eyeY+13),stroke:ec,'stroke-width':2.6,'stroke-linecap':'round','stroke-linejoin':'round',fill:'none'}));
    b.appendChild(fc);
    svg.appendChild(b);
    var w=document.createElement('span');w.className='hb';w.appendChild(svg);
    if(o.size)w.style.width=o.size+'px';
    w.style.setProperty('--br',(3.2+Math.random()*1.2).toFixed(2)+'s');w.style.setProperty('--bd','-'+(Math.random()*3).toFixed(2)+'s');
    list.push(w);return w;
  }
  var list=[],mx=innerWidth/2,my=innerHeight/2,raf=0,rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function look(){raf=0;list.forEach(function(w){if(!w.isConnected)return;var r=w.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight||!r.width)return;
    var dx=mx-(r.left+r.width/2),dy=my-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/320)*6;
    var f=w.querySelector('.hb-f');if(f)f.setAttribute('transform','translate('+(dx/d*k).toFixed(1)+' '+(dy/d*k*.7).toFixed(1)+')')})}
  if(!rm){addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;if(!raf)raf=requestAnimationFrame(look)},{passive:true});
    (function bl(){setTimeout(function(){var v=list.filter(function(w){return w.isConnected});var w=v[Math.floor(Math.random()*v.length)];if(w){w.classList.add('blink');setTimeout(function(){w.classList.remove('blink')},120)}bl()},900+Math.random()*1800)})()}
  function squish(w){if(!w||rm)return;w.classList.remove('squish');void w.offsetWidth;w.classList.add('squish');setTimeout(function(){w.classList.remove('squish')},720)}
  window.Hamblob={make:make,squish:squish,FUR:FUR};
})();
</script>
