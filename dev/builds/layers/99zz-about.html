<style id="ly-tv">
/* ===== About page, rebuilt as an amber CRT broadcast (owner ref: fojcikdominik.com) ===== */
[data-view="about"]>*:not(.tv):not(.ptn):not(.ab-ct){display:none!important}
[data-view="about"]{background:transparent}
.tv{--amb:#FFB45E;--amb2:#F2A65E;--cr:#FFF6E8;--ink:#120E0B;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  position:relative;background:var(--ink);color:var(--cr);overflow:clip;isolation:isolate}
.tv *{box-sizing:border-box}
/* screen texture shared by every part: fine scanlines, grain and a dark rim */
.tv-fx{position:absolute;inset:0;pointer-events:none;z-index:3}
.tv-fx::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 3px);mix-blend-mode:multiply}
.tv-fx::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 160px 40px rgba(0,0,0,.75)}
.tv-grain{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:.07;mix-blend-mode:screen;background-size:220px 220px;animation:tvGr .6s steps(5) infinite}
@keyframes tvGr{20%{background-position:-60px 40px}40%{background-position:90px -70px}60%{background-position:-30px -110px}80%{background-position:120px 60px}}
.tv-m{font:400 .74rem/1.5 var(--mono);letter-spacing:.04em;color:rgba(255,246,232,.62)}
.tv-glow{color:var(--amb);text-shadow:0 0 18px rgba(255,160,70,.45),-1.5px 0 0 rgba(255,70,50,.55),1.5px 0 0 rgba(80,190,255,.35)}

/* 1. intro: student work flies toward you through the dark, the promise sits in the middle */
.tv-in{position:relative;min-height:max(640px,calc(100svh - 64px));display:grid;place-items:center;padding:96px clamp(18px,4vw,56px) 72px;overflow:hidden}
.tv-fly{position:absolute;inset:0;perspective:900px;z-index:0;pointer-events:none}
.tv-fly i{position:absolute;left:50%;top:50%;width:300px;height:188px;margin:-94px 0 0 -150px;border-radius:18px/22px;overflow:hidden;background:#000 center/cover no-repeat;will-change:transform,opacity;opacity:0;box-shadow:0 30px 60px -24px rgba(0,0,0,.9)}
.tv-fly i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.25) 2px 3px);box-shadow:inset 0 0 40px 8px rgba(0,0,0,.55);border-radius:inherit}
.tv-in::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(48% 46% at 50% 52%,rgba(18,14,11,.92),rgba(18,14,11,.6) 55%,rgba(18,14,11,0) 100%)}
.tv-in-b{position:relative;z-index:2;max-width:980px;width:100%;text-align:center}
.tv-in h1{margin:0;font:800 clamp(2.6rem,7.4vw,6.6rem)/1.02 var(--display);letter-spacing:-.02em}
.tv-in h1 span{display:block}
.tv-in p{margin:26px auto 0;max-width:46ch;font-size:clamp(1rem,1.3vw,1.15rem);line-height:1.7;color:rgba(255,246,232,.8)}
.tv-on .tv-in-b{animation:tvOn 1.1s cubic-bezier(.2,.9,.2,1) both}
@keyframes tvOn{0%{transform:scale(1.02,.004);filter:brightness(6);opacity:1}35%{transform:scale(1,.004);filter:brightness(5)}55%{transform:scale(1,1.04);filter:brightness(1.6)}100%{transform:none;filter:none}}

/* 2. the works drum */
.tv-w{position:relative}
.tv-st{position:sticky;top:0;height:100svh;overflow:hidden}
.tv-gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.tv-ls{position:absolute;left:clamp(18px,3vw,40px);top:50%;transform:translateY(-50%);z-index:5;width:min(260px,22vw)}
.tv-ls h2{margin:0 0 4px;font:800 1.5rem/1.2 var(--display);color:var(--cr)}
.tv-ls>p{margin:0 0 18px}
.tv-ls ol{list-style:none;margin:0;padding:0}
.tv-ls li button{all:unset;cursor:pointer;display:block;padding:5px 0 5px 16px;position:relative;font:400 .8rem/1.4 var(--mono);color:rgba(255,246,232,.45);transition:color .2s}
.tv-ls li button::before{content:"";position:absolute;left:0;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--amb);transform:scale(0);transition:transform .25s}
.tv-ls li button:hover{color:var(--cr)}
.tv-ls li.on button{color:var(--amb)}
.tv-ls li.on button::before{transform:scale(1)}
.tv-ls li button:focus-visible{outline:1px solid var(--amb);outline-offset:3px}

.tv-if .n{margin:0;font:800 clamp(2rem,3.4vw,3rem)/1 var(--display)}
.tv-if .w{margin:10px 0 18px;font-size:1rem;line-height:1.55;color:rgba(255,246,232,.82)}
.tv-if dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 14px;border-top:1px solid rgba(255,246,232,.16);padding-top:14px}
.tv-if dt{font:600 .7rem/1.7 var(--mono);color:rgba(255,246,232,.5)}
.tv-if dd{margin:0;font-size:.92rem;line-height:1.5;color:var(--cr)}
.tv-if dd.r{color:var(--amb);font-weight:700}
.tv-if.sw{animation:tvSw .45s steps(4) both}
@keyframes tvSw{0%{opacity:0;transform:translateY(-50%) translateX(-8px);filter:blur(2px)}50%{opacity:.6;transform:translateY(-50%) translateX(5px)}100%{opacity:1;transform:translateY(-50%);filter:none}}
.tv-ct{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:12px}
.tv-ct i{display:block;width:120px;height:2px;background:rgba(255,246,232,.18);position:relative;overflow:hidden}
.tv-ct i b{position:absolute;inset:0;background:var(--amb);transform-origin:left;transform:scaleX(0)}
.tv-w .tv-c{position:absolute;z-index:5}
.tv-nogl .tv-gl{display:none}
.tv-fb{display:none}
.tv-nogl .tv-st{position:relative;height:auto;padding:80px clamp(18px,4vw,56px)}
.tv-nogl .tv-ls ol,.tv-nogl .tv-if,.tv-nogl .tv-ct{display:none}
.tv-nogl .tv-ls{position:static;transform:none;width:auto}
.tv-nogl .tv-fb{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:24px}
.tv-fb img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px}
.tv-fb b{display:block;font:800 1.4rem var(--display);margin-top:12px}
.tv-fb span{display:block;color:rgba(255,246,232,.75);margin-top:4px}

/* 3. the real numbers, set huge, sliding past as you scroll */
.tv-kn{position:relative;padding:clamp(80px,10vw,140px) 0 clamp(50px,6vw,90px);overflow:hidden}
.tv-kn h2,.tv-ch h2,.tv-rg h2{margin:0 auto 34px;max-width:1240px;padding:0 clamp(18px,4vw,56px);font:800 clamp(1.8rem,4vw,3.2rem)/1.1 var(--display);color:var(--cr)}
.tv-kr{display:flex;width:max-content;will-change:transform;padding:8px 0}
.tv-kr .u{display:inline-flex;align-items:center;gap:clamp(16px,2vw,28px);padding-right:clamp(34px,4.5vw,72px)}
.tv-kr b{font:800 clamp(3.4rem,10vw,9.2rem)/1.05 var(--display);letter-spacing:-.02em;white-space:nowrap}
.tv-kr small{font:500 clamp(.95rem,1.35vw,1.2rem)/1.4 var(--display);color:rgba(255,246,232,.78);max-width:15ch}
.tv-kr i{flex:none;width:14px;height:14px;border-radius:50%;background:var(--amb);box-shadow:0 0 14px rgba(255,170,80,.7)}
.tv-kr:nth-of-type(odd) b{color:var(--amb);text-shadow:0 0 30px rgba(255,160,70,.35)}
.tv-kr:nth-of-type(even) b{color:transparent;-webkit-text-stroke:2px rgba(255,246,232,.88)}

/* 4. what we do: three tall picture cards, open from the start */
.tv-ch{position:relative;padding:clamp(60px,8vw,110px) clamp(18px,4vw,56px) clamp(40px,5vw,70px)}
.tv-ch-in{max-width:1240px;margin:0 auto}
.tv-ch h2{padding:0}
.tv-ch-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2.4vw,32px);perspective:1200px}
.tv-set{position:relative;display:block;aspect-ratio:3/4;border-radius:24px;overflow:hidden;color:var(--cr);text-decoration:none;background:#000;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.9);transition:transform .5s cubic-bezier(.23,1,.32,1);transform-style:preserve-3d}
.tv-set:nth-child(2){margin-top:clamp(30px,5vw,70px)}
.tv-set img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.23,1,.32,1)}
.tv-set::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(18,14,11,.95) 0,rgba(18,14,11,.7) 34%,rgba(18,14,11,0) 62%);pointer-events:none}

.tv-set h3{margin:0 0 8px;font:800 clamp(1.3rem,1.9vw,1.7rem)/1.2 var(--display);color:var(--cr)}
.tv-set p{margin:0;color:rgba(255,246,232,.8);line-height:1.6;font-size:.95rem}
.tv-set em{display:inline-block;margin-top:12px;font-style:normal;font-weight:700;font-size:.92rem;color:var(--amb)}
.tv-set:hover img{transform:scale(1.07)}
.tv-set:hover em{text-decoration:underline;text-underline-offset:4px}
.tv-set:focus-visible{outline:2px solid var(--amb);outline-offset:6px}

/* 5. real moments on a curved wall you can spin */
.tv-rg{position:relative;padding:clamp(50px,7vw,100px) 0 clamp(70px,9vw,120px)}
.tv-rg-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;max-width:1240px;margin:0 auto;padding:0 clamp(18px,4vw,56px)}
.tv-rg-h h2{padding:0;margin:0 0 10px}
.tv-rg-h p{margin:0 0 10px;color:rgba(255,246,232,.6);font-size:.92rem}
.tv-rg-s{position:relative;height:clamp(320px,40vw,520px);perspective:1000px;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none}
.tv-rg-s.drag{cursor:grabbing}
.tv-rg-r{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.tv-rg-r figure{position:absolute;margin:0;border-radius:18px;overflow:hidden;background:#000;backface-visibility:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
.tv-rg-r img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;pointer-events:none}
.tv-rg-r figcaption{position:absolute;left:14px;bottom:12px;font-weight:700;font-size:.9rem;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.8)}

/* the remaining original blocks sit on the same dark screen */
[data-view="about"] .ptn{background:#120E0B!important;color:rgba(255,246,232,.6)!important;border:0!important}
[data-view="about"] .ptn p{color:rgba(255,246,232,.6)!important;font-family:'IBM Plex Mono',ui-monospace,monospace!important;font-size:.8rem!important}
[data-view="about"] .ptn .logos{display:flex!important;flex-wrap:wrap;justify-content:center;align-items:center;gap:clamp(24px,5vw,64px);background:#FFF6E8;border-radius:24px;padding:26px clamp(20px,4vw,48px);max-width:900px;margin:14px auto 0}
[data-view="about"] .ptn .logos img{filter:none!important;opacity:1!important;mix-blend-mode:normal!important}
[data-view="about"] .ab-ct{background:#120E0B!important;border-radius:0 0 40px 40px;margin-bottom:24px}

@media (max-width:900px){
  .tv-ls{top:84px;transform:none;width:auto;right:18px}
  .tv-ls ol{display:flex;flex-wrap:wrap;gap:4px 14px}.tv-ls li button{padding:3px 0 3px 12px;font-size:.72rem}
  .tv-ls h2{font-size:1.2rem}.tv-ls>p{display:none}
  .tv-if{top:auto;bottom:62px;transform:none;left:18px;right:18px;width:auto;background:rgba(18,14,11,.82);padding:14px 16px;border-radius:14px;backdrop-filter:blur(6px)}
  .tv-if .w{margin:6px 0 10px;font-size:.9rem}.tv-if dl{gap:4px 10px;padding-top:10px}.tv-if dd{font-size:.84rem}
  .tv-if.sw{animation:none}
  .tv-ch-g{grid-template-columns:1fr}.tv-set{aspect-ratio:4/3.4}.tv-set:nth-child(2){margin-top:0}
  .tv-fly i{width:200px;height:125px;margin:-62px 0 0 -100px}
  .tv-kr small{max-width:12ch}
}
@media (prefers-reduced-motion:reduce){.tv *{animation:none!important}}
</style>
