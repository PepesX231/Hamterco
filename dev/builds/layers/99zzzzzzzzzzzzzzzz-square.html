<script id="ly-square">/* owner: "เปลี่ยนเป็นสี่เหลี่ยมให้หมด" – every pill and rounded box on the site becomes a plain rectangle.
   Rather than chase hundreds of selectors, this walks the site's own style rules once and sets every corner radius to 0.
   Kept as they are: true circles (50%: dots, round icon buttons) and anything in the Hall of Fame (.h5f, off-limits). */
(function(){var P=['border-radius','border-top-left-radius','border-top-right-radius','border-bottom-left-radius','border-bottom-right-radius'];
  function walk(rules){for(var i=0;i<rules.length;i++){var r=rules[i];if(r.cssRules&&!r.style){walk(r.cssRules);continue}
    if(!r.style||(r.selectorText||'').indexOf('h5f')>-1)continue;
    for(var k=0;k<P.length;k++){var v=r.style.getPropertyValue(P[k]);if(!v)continue;v=v.trim();
      if(v==='0'||v==='0px'||v.indexOf('50%')>-1||v==='inherit'||v.indexOf('var(')>-1&&v.indexOf('50%')>-1)continue;
      r.style.setProperty(P[k],'0',r.style.getPropertyPriority(P[k]))}}}
  function go(){for(var i=0;i<document.styleSheets.length;i++){var s=document.styleSheets[i],rs;try{rs=s.cssRules}catch(e){continue}if(rs)walk(rs)}}
  if(document.readyState==='loading')addEventListener('DOMContentLoaded',go);else go();setTimeout(go,1200)})();</script>
<style id="ly-square-css">
/* radii set inline by scripts, and the few made with a CSS variable */
html body [style*="border-radius"]:not(.h5f):not(.h5f *){border-radius:0!important}
</style>
