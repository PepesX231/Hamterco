<!--
  15-motion: Hamster Hub motion system (generic, class based, no dependencies)
  ---------------------------------------------------------------------------
  Everything here is progressive enhancement. Nothing is hidden unless this script runs,
  IntersectionObserver exists and the viewer has not asked for reduced motion
  (the script then sets html.mo-js). Anything already on screen is revealed at once.
  No scroll-jacking: scrolling is always native.

  Reveal (add the class in HTML or from your layer's script, before or after load):
    .mo-goo    block appears with a gooey slime edge pouring DOWN over it while it rises a little.
               Best on cards, panels, media, banners (things with a filled background).
    .mo-rise   block rises 28px and fades in (good for headings and text).
    .mo-kids   container: its direct children rise one after another (70ms apart, max 10).
    data-mo-delay="120"   optional extra delay in ms on any of the above.
  Feel:
    .mo-press  buttons / chips: hover lift 2px, press squash, jelly wobble on release.
    .mo-lift   cards: hover lift 6px with a deeper shadow, slight press on click.
  JS API (window.Motion, ready after this layer runs; layers before 15 can call it on 'load'):
    Motion.scan(root?)              pick up new .mo-* elements (runs on load and on every hashchange).
    Motion.reveal(el)               reveal now.
    Motion.cue(parent, {label, target, dark})
                                    add a scroll cue (a slime drop that drips down + label) at the
                                    bottom centre of parent (parent must be positioned). It fades
                                    away after the first scroll and smooth-scrolls to target on click.
    Motion.tag(selector, 'press'|'lift'|'goo'|'rise'|'kids', root?)   add a class to every match.
    Motion.scrollTo(el|y)           smooth scroll (instant when reduced motion).
  Site-wide, automatic: a slime scroll-progress bar at the top (replaces the old .sp-bar).
-->
<style id="ly-motion">
@property --mo-p{syntax:'<length-percentage>';inherits:false;initial-value:-120px}
/* ---- reveal ---- */
html.mo-js .mo-goo:not(.mo-done),html.mo-js .mo-rise:not(.mo-done),html.mo-js .mo-kids:not(.mo-done)>*{
  transition:transform var(--mo-d,1s) cubic-bezier(.2,.85,.25,1) var(--mo-w,0ms),opacity .4s ease var(--mo-w,0ms),--mo-p var(--mo-d,1s) cubic-bezier(.45,.1,.25,1) var(--mo-w,0ms)!important}
html.mo-js .mo-goo:not(.mo-done){
  -webkit-mask:var(--mo-edge) 0 var(--mo-p)/560px 120px repeat-x,linear-gradient(#000,#000) 0 0/100% max(0px,var(--mo-p)) no-repeat;
          mask:var(--mo-edge) 0 var(--mo-p)/560px 120px repeat-x,linear-gradient(#000,#000) 0 0/100% max(0px,var(--mo-p)) no-repeat}
html.mo-js .mo-goo:not(.mo-in){--mo-p:-120px;opacity:0;transform:translateY(34px)!important}
html.mo-js .mo-goo.mo-in{--mo-p:calc(100% + 12px)}
html.mo-js .mo-rise:not(.mo-in),html.mo-js .mo-kids:not(.mo-in)>*{opacity:0;transform:translateY(28px)!important}
html.mo-js .mo-kids:not(.mo-done)>*{transition-delay:calc(var(--mo-w,0ms) + var(--mo-i,0) * 70ms)!important}
@media print{html.mo-js .mo-goo,html.mo-js .mo-rise,html.mo-js .mo-kids>*{opacity:1!important;transform:none!important;-webkit-mask:none!important;mask:none!important}}

/* ---- feel: press / lift ---- */
.mo-press{transition:transform .5s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease,background-color .2s,color .2s!important;will-change:transform}
.mo-press:hover{transform:translateY(-2px)!important}
.mo-press:active{transform:translateY(1px) scale(.94,.9)!important;transition-duration:.09s!important}
.mo-press.mo-boing{animation:moBoing .55s cubic-bezier(.3,.7,.4,1)}
@keyframes moBoing{0%{transform:scale(.94,.9)}35%{transform:scale(1.06,.96)}60%{transform:scale(.98,1.03)}80%{transform:scale(1.01,.99)}100%{transform:none}}
.mo-press:focus-visible{outline:3px solid #1D1712;outline-offset:3px}
.mo-lift{transition:transform .55s cubic-bezier(.34,1.45,.64,1),box-shadow .45s ease!important}
.mo-lift:hover{transform:translateY(-6px)!important;box-shadow:0 1px 0 rgba(60,35,10,.05),0 34px 50px -30px rgba(60,35,10,.55)!important}
.mo-lift:active{transform:translateY(-2px) scale(.985)!important;transition-duration:.12s!important}

/* ---- scroll progress: a slime bar with a gooey head ---- */
.sp-bar{display:none!important}
.mo-bar{position:fixed;left:0;right:0;top:0;height:5px;z-index:130;pointer-events:none;overflow:visible}
.mo-bar-f{position:absolute;inset:0;transform:translateX(-100%);will-change:transform;
  background:linear-gradient(180deg,#FFC27A,#F7A23E 55%,#D9741A);border-radius:0 6px 6px 0;box-shadow:0 2px 6px -2px rgba(150,70,0,.5)}
.mo-bar-h{position:absolute;right:-7px;top:-2px;width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFE2B8 0 18%,#F7A23E 48%,#D9741A 100%);opacity:0;transition:opacity .3s}
.mo-bar-d{position:absolute;left:3px;top:7px;width:6px;height:9px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:linear-gradient(#F7A23E,#D9741A);transform-origin:50% 0;transform:scaleY(var(--v,.4))}
.mo-bar.on .mo-bar-h{opacity:1}

/* ---- scroll cue ---- */
.mo-cue{position:absolute;left:50%;bottom:clamp(16px,3.6vh,36px);z-index:5;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;
  border:0;background:none;padding:4px;cursor:pointer;color:#1D1712;font:700 .84rem var(--display,inherit);transition:opacity .5s,transform .5s cubic-bezier(.3,1.4,.5,1);-webkit-tap-highlight-color:transparent}
.mo-cue svg{width:30px;height:46px;overflow:visible;filter:drop-shadow(0 8px 12px rgba(120,55,0,.28))}
.mo-cue span{background:rgba(255,250,243,.92);padding:5px 13px;border-radius:999px;box-shadow:0 6px 14px -8px rgba(120,55,0,.5);white-space:nowrap}
.mo-cue.dark span{background:rgba(29,23,18,.75);color:#fff}
.mo-cue .mo-cd{transform-box:fill-box;transform-origin:50% 0;animation:moDrip 1.8s cubic-bezier(.5,0,.5,1) infinite}
.mo-cue .mo-cf{animation:moFall 1.8s cubic-bezier(.55,0,1,.45) infinite}
.mo-cue:hover{transform:translateX(-50%) translateY(3px)}
.mo-cue:active{transform:translateX(-50%) translateY(3px) scale(.94)}
.mo-cue:focus-visible{outline:3px solid #1D1712;outline-offset:2px;border-radius:16px}
.mo-cue.gone{opacity:0;transform:translateX(-50%) translateY(16px);pointer-events:none}
@keyframes moDrip{0%,100%{transform:scaleY(.6)}42%{transform:scaleY(1.25)}52%{transform:scaleY(.7)}}
@keyframes moFall{0%,46%{transform:translateY(0);opacity:0}50%{opacity:1}88%{transform:translateY(19px);opacity:1}100%{transform:translateY(21px) scale(1.3,.5);opacity:0}}

@media (prefers-reduced-motion:reduce){
  .mo-cue *{animation:none!important}.mo-press,.mo-lift{transition:background-color .2s,color .2s,box-shadow .2s!important}
  .mo-press:hover,.mo-press:active,.mo-lift:hover,.mo-lift:active{transform:none!important}.mo-press.mo-boing{animation:none}
  .mo-bar-d{display:none}
}
</style>
<script>
(function(){
  var rm=matchMedia('(prefers-reduced-motion: reduce)').matches,html=document.documentElement,io=null;
  /* gooey edge for the mask: black on top, soft drips hanging down (generated once, seeded) */
  (function(){var W=560,H=120,s=7,R=function(){s=(s*16807)%2147483647;return (s-1)/2147483646},d='M0 0H'+W+'V36',x=W;
    while(x>0){var w=34+R()*60,l=R()<.45?40+R()*72:8+R()*14,c=x-w/2,bw=6+R()*7;x-=w;if(x<0)x=0;
      d+='C'+(x+w*.75).toFixed(1)+' 36 '+(c+bw*1.6).toFixed(1)+' 38 '+(c+bw).toFixed(1)+' '+(36+l*.5).toFixed(1)+
         'C'+(c+bw).toFixed(1)+' '+(36+l).toFixed(1)+' '+(c-bw).toFixed(1)+' '+(36+l).toFixed(1)+' '+(c-bw).toFixed(1)+' '+(36+l*.5).toFixed(1)+
         'C'+(c-bw*1.6).toFixed(1)+' 38 '+(x+w*.25).toFixed(1)+' 36 '+x.toFixed(1)+' 36'}
    d+='Z';var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><path d="'+d+'"/></svg>';
    html.style.setProperty('--mo-edge','url("data:image/svg+xml,'+encodeURIComponent(svg)+'")')})();

  var ok=!rm&&'IntersectionObserver' in window&&CSS.supports&&CSS.supports('(-webkit-mask:none) or (mask:none)');
  function reveal(el){if(!el||el.classList.contains('mo-in'))return;
    if(el.classList.contains('mo-goo')){var h=el.offsetHeight||400;el.style.setProperty('--mo-d',Math.round(Math.max(750,Math.min(1400,500+h*.9)))+'ms')}
    el.classList.add('mo-in');if(io)io.unobserve(el);
    var t=(parseFloat(getComputedStyle(el).getPropertyValue('--mo-d'))||1000)+(+el.dataset.moDelay||0)+(el.classList.contains('mo-kids')?el.children.length*70:0)+150;
    setTimeout(function(){el.classList.add('mo-done')},t)}
  function prep(el){if(el.dataset.moSeen)return;el.dataset.moSeen=1;
    if(el.dataset.moDelay)el.style.setProperty('--mo-w',(+el.dataset.moDelay)+'ms');
    if(el.classList.contains('mo-kids'))[].forEach.call(el.children,function(c,i){c.style.setProperty('--mo-i',Math.min(i,10))});
    if(!io){reveal(el);return}
    var r=el.getBoundingClientRect();if(r.width&&r.top<innerHeight*.92&&r.bottom>0){requestAnimationFrame(function(){reveal(el)});return}
    io.observe(el)}
  function scan(root){(root||document).querySelectorAll('.mo-goo,.mo-rise,.mo-kids').forEach(prep)}
  if(ok){html.classList.add('mo-js');
    io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)reveal(e.target)})},{rootMargin:'0px 0px -10% 0px'})}

  /* press / lift */
  document.addEventListener('pointerup',function(e){var b=e.target.closest&&e.target.closest('.mo-press');if(!b||rm)return;b.classList.remove('mo-boing');void b.offsetWidth;b.classList.add('mo-boing');
    setTimeout(function(){b.classList.remove('mo-boing')},600)},{passive:true});
  function tag(sel,kind,root){(root||document).querySelectorAll(sel).forEach(function(n){n.classList.add('mo-'+kind)});if(kind!=='press'&&kind!=='lift')scan(root)}

  /* smooth scroll */
  function scrollTo(t){var y=typeof t==='number'?t:(t.getBoundingClientRect().top+scrollY-70);window.scrollTo({top:Math.max(0,y),behavior:rm?'auto':'smooth'})}

  /* scroll cue */
  function cue(parent,o){o=o||{};if(!parent||parent.querySelector(':scope > .mo-cue'))return null;
    var b=document.createElement('button');b.type='button';b.className='mo-cue'+(o.dark?' dark':'');b.setAttribute('aria-label',o.label||'เลื่อนลงดูต่อ');
    b.innerHTML='<svg viewBox="0 0 30 46" aria-hidden="true"><defs><radialGradient id="mocg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#FFE7C4"/><stop offset=".45" stop-color="#F7A23E"/><stop offset="1" stop-color="#C9650F"/></radialGradient></defs>'+
      '<rect x="1" y="1" width="28" height="44" rx="14" fill="rgba(255,252,247,.94)" stroke="rgba(29,23,18,.14)" stroke-width="1.5"/>'+
      '<path class="mo-cd" d="M7 5.5C11 3.5 19 3.5 23 5.5C21 8 18 9 17 12.5C16.4 14.5 13.6 14.5 13 12.5C12 9 9 8 7 5.5Z" fill="url(#mocg)"/>'+
      '<g class="mo-cf"><path d="M15 15C17.2 17.6 18.4 19.6 18.4 21.4C18.4 23.4 16.9 24.8 15 24.8C13.1 24.8 11.6 23.4 11.6 21.4C11.6 19.6 12.8 17.6 15 15Z" fill="url(#mocg)"/><circle cx="13.8" cy="20.8" r="1" fill="#fff" opacity=".85"/></g>'+
      '<path d="M10 39.5Q15 41.5 20 39.5" stroke="rgba(247,162,62,.5)" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg><span>'+(o.label||'เลื่อนลงดูต่อ')+'</span>';
    b.addEventListener('click',function(){var t=typeof o.target==='function'?o.target():o.target;if(t)scrollTo(t);else scrollTo(parent.getBoundingClientRect().bottom+scrollY-60)});
    parent.appendChild(b);
    function chk(){if(scrollY>40){b.classList.add('gone');removeEventListener('scroll',chk)}}
    addEventListener('scroll',chk,{passive:true});chk();return b}

  /* slime progress bar */
  (function(){var bar=document.createElement('div');bar.className='mo-bar';bar.setAttribute('aria-hidden','true');
    bar.innerHTML='<i class="mo-bar-f"><b class="mo-bar-h"><i class="mo-bar-d"></i></b></i>';document.body.appendChild(bar);
    var f=bar.firstChild,d=bar.querySelector('.mo-bar-d'),ly=scrollY,lt=performance.now(),v=0,raf=0,sp=0;
    function u(){raf=0;var m=html.scrollHeight-innerHeight,p=m>0?Math.min(1,Math.max(0,scrollY/m)):0;f.style.transform='translateX('+((p-1)*100).toFixed(3)+'%)';bar.classList.toggle('on',p>.004);
      if(!rm){var t=performance.now(),dt=Math.max(16,t-lt),vv=Math.abs(scrollY-ly)/dt;ly=scrollY;lt=t;v+=(Math.min(2.2,vv*.9)-v)*.35;d.style.setProperty('--v',(.4+v).toFixed(3));
        if(v>.02&&!sp){sp=1;requestAnimationFrame(function k(){v*=.86;d.style.setProperty('--v',(.4+v).toFixed(3));if(v>.02)requestAnimationFrame(k);else sp=0})}}}
    function q(){if(!raf)raf=requestAnimationFrame(u)}
    addEventListener('scroll',q,{passive:true});addEventListener('resize',q);addEventListener('hashchange',function(){setTimeout(q,80);setTimeout(q,900)});u()})();

  window.Motion={scan:scan,reveal:reveal,cue:cue,tag:tag,scrollTo:scrollTo,reduced:rm};
  scan();
  addEventListener('load',function(){scan()});
  addEventListener('hashchange',function(){setTimeout(scan,500)});
})();
</script>
