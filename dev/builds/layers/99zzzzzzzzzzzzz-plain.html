<style id="ly-plain">
/* "AI slop" pass on the two home sections: the template signals were floating shadowed boxes, orange pill buttons,
   pill labels and dashed footers. Pictures now sit flat on the page, actions are plain underlined text, rows are split
   by a single rule. Layout and content stay the same. */

/* ---- สิ่งที่ Hamster Hub สร้าง ---- */
html body section.hbx .oc-r{padding-top:clamp(28px,3.4vw,44px);border-top:1.5px solid #1D1712;margin-top:clamp(36px,4.5vw,64px)!important}
html body section.hbx .oc-m,html body section.hbx .oc-m.oc-m{box-shadow:none!important;border-radius:6px!important;transform:none!important;filter:none!important}
html body section.hbx .oc-m img,html body section.hbx .oc-m video{border-radius:6px!important;box-shadow:none!important}
html body section.hbx .oc-k{background:none!important;padding:0!important;border:0!important;box-shadow:none!important;color:#7A6A5C!important;font:600 .92rem/1.2 var(--ui,inherit)!important;letter-spacing:0!important;text-transform:none!important}
html body section.hbx .oc-k::before,html body section.hbx .oc-k::after{content:none!important}
html body section.hbx .oc-lk,html body section.hbx .oc-play{background:none!important;color:#1D1712!important;box-shadow:none!important;border-radius:0!important;padding:0!important;margin-top:20px!important;
  text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1.5px;text-decoration-color:rgba(29,23,18,.35);transform:none!important}
html body section.hbx .oc-lk:hover,html body section.hbx .oc-play:hover{text-decoration-color:#E07A1F;background:none!important}
html body section.hbx .oc-play i{border-left-color:#1D1712!important}
html body section.hbx .ocl li{border-color:rgba(29,23,18,.16)!important}

/* ---- คอร์สที่เราแนะนำ: the two courses that are not open yet ---- */
html body [data-view] .fx-row .fx-s.fx-s.fx-s.fx-s:nth-child(n){background:none!important;border:0!important;border-top:1.5px solid #1D1712!important;border-radius:0!important;box-shadow:none!important;padding-top:18px!important;overflow:visible!important}
html body [data-view] .fx-row .fx-s.fx-s.fx-s.fx-s:nth-child(n):hover{background:none!important;border-color:#1D1712!important}
html body [data-view] .fx-row .fx-s .fx-si{border-radius:6px!important;overflow:hidden}
html body [data-view] .fx-row .fx-s .fx-pr{background:none!important;border:0!important;padding-left:0!important;padding-right:0!important}
html body [data-view] .fx-row .fx-s .fx-go{background:none!important;border:0!important;box-shadow:none!important;padding:0!important;border-radius:0!important;
  text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1.5px;text-decoration-color:rgba(29,23,18,.35);color:#1D1712!important}
html body [data-view] .fx-row .fx-s:hover .fx-go{text-decoration-color:#E07A1F}
html body [data-view] .fx-row .fx-s .rc.rc-s.zc-st.zc-st{display:none!important}
/* the big Port Express card keeps its poster but loses the soft drop shadow */
html body [data-view] .fx-main{box-shadow:none!important}
/* self-review: the floating ask button sat in the middle of the screen bottom, on top of photos and cards.
   It now waits in the bottom-right corner, where nothing on the page needs to be read. */
html body .zq-fab{left:auto!important;right:24px!important;transform:translateY(140%)!important}
html body .zq-fab.on{transform:none!important}
</style>
<script>(function(){function go(){var top=document.querySelector('[data-view="home"] .nw2 .nw2-h'),l=document.querySelector('[data-view="home"] .mr-l h3');
  /* self-review: one "กิจกรรมล่าสุด" heading above the banner; the card list under it is the earlier events */
  if(top&&top.textContent.trim()!=='กิจกรรมล่าสุด')top.textContent='กิจกรรมล่าสุด';
  if(l&&l.textContent.trim()==='กิจกรรมล่าสุด')l.textContent='งานที่ผ่านมา'}
  if(document.readyState==='complete')go();else addEventListener('load',go);setTimeout(go,6500);setTimeout(go,12000)})();</script>
