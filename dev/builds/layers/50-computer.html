<style id="ly-pc">
/* ===== Hero: a 3D retro computer (three.js), greeting + live headline on its screen, giant words drifting behind ===== */
[data-view="home"] .zq{background:linear-gradient(180deg,#FFB65C 0%,#F7A23E 46%,#F59A33 100%)!important}
[data-view="home"] .zq .hm-w,[data-view="home"] .zq .hm-pet,[data-view="home"] .zq .tip{display:none!important}
.pc-bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.pc-bg::before{content:"";position:absolute;left:50%;top:38%;width:min(1100px,110vw);height:620px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,240,215,.85),rgba(255,240,215,0));}
.pc-mq{position:absolute;left:0;white-space:nowrap;font:800 clamp(5rem,11vw,10.5rem)/1 var(--display);color:rgba(255,255,255,.34);letter-spacing:-.01em;will-change:transform}
.pc-mq span{display:inline-block;padding-right:.6em}
.pc-mq.a{top:16%;animation:pcMq 80s linear infinite}
.pc-mq.b{top:40%;animation:pcMq 95s linear infinite reverse;color:rgba(255,255,255,.22)}
@keyframes pcMq{to{transform:translateX(-50%)}}
.pc-cv{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0;transition:opacity .8s ease}
.pc-cv.on{opacity:1}
/* the HTML screen (mapped onto the 3D screen with matrix3d) */
.pc-scr{position:absolute;left:0;top:0;z-index:2;width:380px;height:276px;transform-origin:0 0;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;border-radius:18px;
  background:radial-gradient(120% 90% at 30% 15%,#2F5FC8 0%,#1B3A8A 55%,#132a66 100%);color:#fff;visibility:hidden}
.pc-scr.on{visibility:visible}
.pc-scr::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 4px),radial-gradient(140% 100% at 50% 0%,rgba(255,255,255,.18),transparent 42%)}
.pc-hi{display:flex;align-items:center;gap:10px;font:700 24px/1.2 var(--display);color:#FFE2B5;margin-bottom:6px}
.pc-hi img{width:66px;height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));transform-origin:50% 90%;animation:pcWave 2.6s ease-in-out infinite}
@keyframes pcWave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-8deg)}80%{transform:rotate(7deg)}90%{transform:rotate(-4deg)}}
.pc-scr .zq-q{color:rgba(255,255,255,.75)!important;margin:2px 0 0!important;font-size:19px!important}
.pc-scr .zq-h{font-size:46px!important;line-height:1.15!important;margin:2px 10px 0!important;max-width:360px;min-height:1.2em;color:#fff!important;-webkit-text-fill-color:#fff!important;background:none!important;text-shadow:0 0 18px rgba(120,180,255,.6)}
.pc-scr .zq-h *{color:inherit}
.pc-dots{position:absolute;left:16px;top:12px;display:flex;gap:6px}.pc-dots i{width:9px;height:9px;border-radius:50%;background:#FF7A7A}.pc-dots i+i{background:#FFD24A}.pc-dots i+i+i{background:#5FD3B4}
/* make room for the computer above the search bar */
[data-view="home"] .zq-top{padding-top:var(--pc-room,400px)}
[data-view="home"] .zq-top>.zq-q,[data-view="home"] .zq-top>.zq-h{display:none}
/* fallback: no WebGL -> a flat screen card in the same spot */
.pc-flat .pc-scr{visibility:visible;position:absolute;left:50%;top:calc(var(--pc-top,40px));transform:translateX(-50%);border:14px solid #FFF1DC;box-shadow:0 30px 50px -24px rgba(90,40,0,.6)}
@media (max-width:640px){
  .pc-mq{font-size:4.2rem}.pc-mq.a{top:12%}.pc-mq.b{top:30%}
}
@media (prefers-reduced-motion:reduce){.pc-mq,.pc-hi img{animation:none!important}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const zq=document.querySelector('[data-view="home"] .zq');
if(zq){
  const top=zq.querySelector('.zq-top');
  /* background words */
  const bg=document.createElement('div');bg.className='pc-bg';bg.setAttribute('aria-hidden','true');
  const W='เกม · เว็บ · IoT · หุ่นยนต์ · สตาร์ทอัพ · ';
  ['a','b'].forEach(k=>{const m=document.createElement('div');m.className='pc-mq '+k;m.innerHTML=('<span>'+W+'</span>').repeat(6);bg.appendChild(m)});
  zq.insertBefore(bg,zq.firstChild);
  /* screen content: greeting + the page's own live headline (moved, so its typing script keeps working) */
  const scr=document.createElement('div');scr.className='pc-scr';scr.setAttribute('aria-live','off');
  scr.innerHTML='<span class="pc-dots"><i></i><i></i><i></i></span><p class="pc-hi"><img src="img/ham-cheer-hd.webp" alt="">สวัสดีน้องๆ</p>';
  const q=top.querySelector('.zq-q'),h=top.querySelector('.zq-h');if(q)scr.appendChild(q);if(h)scr.appendChild(h);
  zq.appendChild(scr);
  const cv=document.createElement('canvas');cv.className='pc-cv';cv.setAttribute('aria-hidden','true');zq.insertBefore(cv,bg.nextSibling);

  function room(){const m=innerWidth<640;zq.style.setProperty('--pc-room',(m?300:Math.min(430,Math.max(340,innerHeight*.45)))+'px')}
  room();

  /* homography: map scr (w,h rect) onto 4 projected points */
  function adj(m){return[m[4]*m[8]-m[5]*m[7],m[2]*m[7]-m[1]*m[8],m[1]*m[5]-m[2]*m[4],m[5]*m[6]-m[3]*m[8],m[0]*m[8]-m[2]*m[6],m[2]*m[3]-m[0]*m[5],m[3]*m[7]-m[4]*m[6],m[1]*m[6]-m[0]*m[7],m[0]*m[4]-m[1]*m[3]]}
  function mm(a,b){const c=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++){let s=0;for(let k=0;k<3;k++)s+=a[3*i+k]*b[3*k+j];c[3*i+j]=s}return c}
  function mv(m,v){return[m[0]*v[0]+m[1]*v[1]+m[2]*v[2],m[3]*v[0]+m[4]*v[1]+m[5]*v[2],m[6]*v[0]+m[7]*v[1]+m[8]*v[2]]}
  function basis(p){const m=[p[0],p[2],p[4],p[1],p[3],p[5],1,1,1],v=mv(adj(m),[p[6],p[7],1]);return mm(m,[v[0],0,0,0,v[1],0,0,0,v[2]])}
  function quad(w,h,d){const s=basis([0,0,w,0,0,h,w,h]),t=mm(basis(d),adj(s));for(let i=0;i<9;i++)t[i]/=t[8];
    return 'matrix3d('+[t[0],t[3],0,t[6],t[1],t[4],0,t[7],0,0,1,0,t[2],t[5],0,t[8]].map(x=>+x.toFixed(6)).join(',')+')'}

  function flat(){zq.classList.add('pc-flat');scr.classList.add('on');zq.style.setProperty('--pc-top',(top.offsetTop+20)+'px')}

  (async()=>{
    let THREE,RBG,RoomEnv;
    try{THREE=await import('three');({RoundedBoxGeometry:RBG}=await import('three/addons/geometries/RoundedBoxGeometry.js'));({RoomEnvironment:RoomEnv}=await import('three/addons/environments/RoomEnvironment.js'))}catch(e){flat();return}
    let R;try{R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,powerPreference:'high-performance'})}catch(e){flat();return}
    R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
    const S=new THREE.Scene(),pm=new THREE.PMREMGenerator(R);S.environment=pm.fromScene(new RoomEnv(),.04).texture;
    const cam=new THREE.PerspectiveCamera(28,1,.1,100);cam.position.set(0,.4,13.5);
    S.add(new THREE.HemisphereLight(0xfff4e6,0xf3a24a,.9));
    const key=new THREE.DirectionalLight(0xffffff,1.6);key.position.set(-4,6,6);S.add(key);
    const rim=new THREE.DirectionalLight(0xffd9a8,.8);rim.position.set(5,2,-4);S.add(rim);
    const plastic=(c,cc=.6,r=.38)=>new THREE.MeshPhysicalMaterial({color:c,roughness:r,clearcoat:cc,clearcoatRoughness:.25,sheen:.3,sheenColor:new THREE.Color(0xffffff)});
    const cream=plastic(0xFFF1DC),orange=plastic(0xF7A23E,.8,.3),deep=plastic(0xE07B1E,.8,.32),ink=new THREE.MeshPhysicalMaterial({color:0x1D1712,roughness:.15,clearcoat:1,metalness:0});
    const G=new THREE.Group();S.add(G);
    const box=(w,h,d,r,m,x,y,z)=>{const o=new THREE.Mesh(new RBG(w,h,d,6,r),m);o.position.set(x,y,z);G.add(o);return o};
    /* monitor */
    box(4.3,3.5,2.6,.5,cream,0,.6,0);                        // body
    box(4.3,.5,2.4,.24,orange,0,2.28,-.05);                  // orange cap stripe on top
    box(3.62,2.72,.4,.26,deep,0,.72,1.18);                   // orange bezel
    const glass=box(3.3,2.42,.4,.2,ink,0,.72,1.24);          // dark glass (HTML screen sits on its face)
    box(2.6,1.8,1.6,.5,cream,0,.5,-1.6);                     // CRT back
    box(.9,.12,.08,.04,ink,1.15,-.85,1.33);                  // floppy slot
    const led=new THREE.Mesh(new THREE.SphereGeometry(.07,16,16),new THREE.MeshBasicMaterial({color:0x5FD3B4}));led.position.set(-1.5,-.86,1.34);G.add(led);
    box(1.1,.5,1,.2,cream,0,-1.38,-.1);                      // neck
    box(2.8,.34,2.2,.17,orange,0,-1.7,.05);                  // foot
    /* keyboard with keys */
    const kb=box(4.2,.32,1.5,.16,cream,0,-1.86,2.35);kb.rotation.x=.06;
    const keyG=new RBG(.36,.16,.34,3,.07),keyM=plastic(0xF7A23E,.9,.28),keyW=plastic(0xFFFFFF,.9,.28);
    for(let r=0;r<3;r++)for(let c=0;c<9;c++){const k=new THREE.Mesh(keyG,(r===1&&c===4)?keyW:keyM);k.position.set(-1.68+c*.42,-1.64+r*.03,1.88+r*.42);k.rotation.x=.06;G.add(k)}
    const sp=new THREE.Mesh(new RBG(2.3,.16,.34,3,.07),keyW);sp.position.set(0,-1.55,3.2);sp.rotation.x=.06;G.add(sp);
    /* pedestal + soft contact shadow */
    const ped=new THREE.Mesh(new RBG(6.2,.8,4.6,6,.38),plastic(0xFFF8EF,.4,.5));ped.position.set(0,-2.42,.9);G.add(ped);
    const sh=new THREE.Mesh(new THREE.PlaneGeometry(8,5.6),new THREE.MeshBasicMaterial({transparent:true,depthWrite:false,map:(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,4,64,64,64);g.addColorStop(0,'rgba(120,55,0,.38)');g.addColorStop(1,'rgba(120,55,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})()}));
    sh.rotation.x=-Math.PI/2;sh.position.set(0,-2.88,1);G.add(sh);
    /* screen corners (front face of the glass) in local space */
    const zf=1.24+.2+.002,hw=3.3/2-.05,hh=2.42/2-.05,cy=.72;
    const C=[[-hw,cy+hh],[hw,cy+hh],[-hw,cy-hh],[hw,cy-hh]].map(p=>new THREE.Vector3(p[0],p[1],zf));

    let w=0,h=0,run=false,raf=0,tx=0,ty=0,rx=0,ry=0,t0=performance.now(),born=rm?1:0;
    function size(){w=zq.clientWidth;h=zq.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;
      const mob=w<640,room=parseFloat(getComputedStyle(zq).getPropertyValue('--pc-room'))||400;
      /* place the computer in the space reserved above the search bar */
      const topPx=top.offsetTop+10,cyPx=topPx+room*.5,ndcY=1-2*cyPx/h;
      const vis=room/h; /* fraction of view height for the computer */
      cam.fov=28;cam.updateProjectionMatrix();
      const dist=13.5;const viewH=2*dist*Math.tan(THREE.MathUtils.degToRad(cam.fov/2));
      const s=(vis*viewH)/(mob?6.4:6.0);G.scale.setScalar(s);
      G.userData.y=ndcY*viewH/2+.5*s;G.position.y=G.userData.y}
    function frame(now){
      const t=(now-t0)/1000;rx+=(ty-rx)*.06;ry+=(tx-ry)*.06;
      if(born<1)born=Math.min(1,born+.022);const e=1-Math.pow(1-born,3);
      G.rotation.set(rx*.12+.05,ry*.22+Math.sin(t*.5)*.03,0);
      G.position.y=G.userData.y+(rm?0:Math.sin(t*1.1)*.05)-(1-e)*1.2;G.scale.setScalar(G.userData.s0*(0.85+.15*e)||G.scale.x);
      led.material.color.setHSL(.45,.6,.45+.15*Math.sin(t*3));
      R.render(S,cam);
      /* map html screen */
      G.updateMatrixWorld();const P=C.map(v=>{const p=v.clone().applyMatrix4(G.matrixWorld).project(cam);return[(p.x+1)/2*w,(1-p.y)/2*h]});
      scr.style.transform=quad(scr.offsetWidth,scr.offsetHeight,[].concat(...P));
      if(run)raf=requestAnimationFrame(frame)}
    size();G.userData.s0=G.scale.x;cv.classList.add('on');scr.classList.add('on');
    addEventListener('resize',()=>{room();size();G.userData.s0=G.scale.x;if(!run)frame(performance.now())});
    if(!rm)addEventListener('pointermove',e=>{const r=zq.getBoundingClientRect();if(e.clientY>r.bottom)return;tx=(e.clientX-r.left)/r.width*2-1;ty=(e.clientY-r.top)/r.height*2-1},{passive:true});
    new IntersectionObserver(es=>{const v=es[0].isIntersecting;if(v&&!run){run=true;raf=requestAnimationFrame(frame)}else if(!v){run=false;cancelAnimationFrame(raf)}}).observe(zq);
    frame(performance.now());
    /* screen squish when searching */
    document.getElementById('zqForm')?.addEventListener('submit',()=>{born=.55},true);
  })();
}
</script>
