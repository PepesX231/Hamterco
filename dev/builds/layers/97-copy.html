<style id="ly-copy2">
/* ===== owner round: Port Express card, upcoming-event banner, closing panel ===== */
/* Port Express: no twinkles, sky canvas or shine; one flat ink-violet surface */
[data-view] .fx-main .pxe-sky,[data-view] .fx-main svg.tw,[data-view] .fx-main .px-shine,[data-view] .fx-main .px-aura{display:none!important}
[data-view] .fx-main .fx-body{background:#221A3D!important;background-image:none!important}
[data-view] .fx-main .fx-f>span{background:rgba(255,255,255,.06)!important;background-image:none!important;border:1px solid rgba(255,255,255,.12)!important;box-shadow:none!important}
@media (max-width:640px){
  [data-view] .fx-main .fx-f{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:8px!important}
  [data-view] .fx-main .fx-f>span{padding:10px 10px!important;min-width:0!important;font-size:.78rem!important;line-height:1.35!important}
  [data-view] .fx-main .fx-f>span b{font-size:.9rem!important;white-space:normal;line-height:1.25!important;display:block}
  [data-view] .fx-main .fx-t{font-size:2rem!important}
  [data-view] .fx-main .fx-d{font-size:1rem!important;line-height:1.55!important}
}
/* upcoming event (stays blue): countdown boxes without the yellow offset shadow; smaller art on phones; hide "0 วัน" */
[data-view="home"] .t-afo .cd>div{box-shadow:none!important;border:1px solid rgba(255,255,255,.18)!important}
.t-afo .cd>div.cp-zero{display:none!important}
@media (max-width:640px){
  [data-view="home"] .t-afo .afo-hd{max-width:260px!important;margin:4px auto 6px!important}
  [data-view="home"] .t-afo h3{font-size:1.9rem!important;line-height:1.2!important}
  [data-view="home"] .t-afo .t-s{font-size:1rem!important}
  [data-view="home"] .nw2-h{font-size:2rem!important}
}
body .end-in .ar-wall>*{top:0!important}
/* closing panel: LINE is the main action, courses a quiet link; no "empty slot" tile */
body .end-in .ar-mine{display:none!important}
body .end-in .end-b .e1{background:none!important;color:#1D1712!important;box-shadow:none!important;padding-left:4px!important;padding-right:4px!important;text-decoration:underline;text-decoration-color:rgba(29,23,18,.35);text-underline-offset:5px}
body .end-in .end-b{display:flex!important;flex-wrap:wrap;align-items:center;gap:14px 22px}
body .end-in .end-b .e2{order:-1}
@media (max-width:640px){body .end-in .ar-wall>*:nth-child(n+7){display:none!important}}
</style>
<script>
(function(){
  /* countdown: drop the "days" box when it reads 0 */
  var d=document.getElementById('cdD');
  function z(){if(!d)return;var box=d.parentElement,zero=d.textContent.trim()==='0';if(box.classList.contains('cp-zero')!==zero)box.classList.toggle('cp-zero',zero)}
  if(d){z();new MutationObserver(z).observe(d,{childList:true,characterData:true,subtree:true})}
  /* closing wall: fill the slot the dashed tile used with nothing (grid of 8 reads fine as 4+4 / 3+3+2) */
})();
</script>
