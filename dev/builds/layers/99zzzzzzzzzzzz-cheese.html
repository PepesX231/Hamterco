<style id="ly-cheese">
/* the hero is a slab of cheese: warm cheddar body with a soft sheen, and real-looking holes (dark crescent shadow on the
   top-left inside, a light rim on the lower right). Holes keep to the sides and corners so the headline and search stay clean. */
html body [data-view="home"] .zq{background:radial-gradient(120% 90% at 30% 10%,#FFC46B 0,#F6AE55 45%,#EE9C45 100%)!important}
.zq-ch2{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;border-radius:inherit}
.zq-ch2 i{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 62% 66%,#EC9640 0 46%,#E0852F 100%);
  box-shadow:inset calc(var(--s)*.09) calc(var(--s)*.12) 0 rgba(150,70,8,.32),inset calc(var(--s)*-.03) calc(var(--s)*-.04) 0 rgba(255,214,150,.55),0 1px 0 rgba(255,222,165,.7)}
/* answers open: the hero takes the page's own cream (no white slab ending in a hard line) and the code fades out before its bottom edge */
html body [data-view="home"] .zq.ask{background:#FFFAF3!important}
html body [data-view="home"] .zq.ask>.hx-cv{-webkit-mask:linear-gradient(#000 55%,transparent 92%);mask:linear-gradient(#000 55%,transparent 92%)}
/* while answers are open the hero turns into the liquid panel: no holes on it */
html body [data-view="home"] .zq.ask .zq-ch2{opacity:0;transition:opacity .3s}
.zq-ch2{transition:opacity .4s}
@media (max-width:700px){.zq-ch2 i.sm-off{display:none}}
/* owner: no scrolling code text on the cheese; hidden canvas also stops its drawing loop */
html body [data-view="home"] .zq>.hx-cv{display:none!important}
</style>
<script>(function(){function go(){var z=document.querySelector('[data-view="home"] .zq');if(!z||z.querySelector('.zq-ch2'))return;
  /* fixed layout so it never jumps: [x%, y%, size in px at 1440 wide, hide on phones?] */
  var H=[[2,18,120],[11,30,46],[5,62,92],[16,84,58,1],[24,14,30,1],[30,72,40,1],[-3,90,140],
         [97,22,130],[88,8,52,1],[86,48,40,1],[93,70,96],[78,88,62,1],[71,20,34,1],[63,93,44,1],[40,90,30,1]];
  var w=document.createElement('div');w.className='zq-ch2';w.setAttribute('aria-hidden','true');
  H.forEach(function(h){var i=document.createElement('i'),s='calc('+h[2]+'px * var(--k))';i.style.cssText='left:'+h[0]+'%;top:'+h[1]+'%;width:'+s+';height:calc('+s+' * .9);--s:'+s+';transform:translate(-50%,-50%) rotate('+(h[0]*7%40-20)+'deg)';if(h[3])i.className='sm-off';w.appendChild(i)});
  function k(){w.style.setProperty('--k',Math.max(.55,Math.min(1.25,z.clientWidth/1440)).toFixed(3))}k();addEventListener('resize',k);
  z.insertBefore(w,z.firstChild)}
  if(document.readyState==='loading')addEventListener('DOMContentLoaded',go);else go();setTimeout(go,800)})();</script>
