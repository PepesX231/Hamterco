<style id="ly-kno">
/* ===== review round (Kno): no blob hamsters, calmer colours, plain badge, code instead of maths, new closing panel ===== */
/* 1. a calmer brand orange for the big surfaces (was #F7A23E, too hot at full-screen size) */
:root{--or:#F2A65E!important}

/* 2. blob hamsters and drawn faces are gone, everywhere */
span.hb:not(.hm-pet span.hb),.cl-p,.cl-w,.pxe-astro,.pxe-paw,.pl-sb,.pl-wk,.dfc,.lf{display:none!important}
/* the little hamster behind the search bar stays (owner) */
/* white search state: chips step down so the slime drips under the bar are not covered */
[data-view="home"] .zq .zq-pop{transition:transform .5s cubic-bezier(.3,1.3,.5,1),opacity .3s}
[data-view="home"] .zq.hx-white:not(.ask) .zq-pop{transform:translateY(34px)}
.wkz .wk.pl-skinned,.wkz-rift .wk.pl-skinned{opacity:1!important}   /* the courses walker goes back to the brand's own drawing */
[data-view="activity"] .avc-ty{display:flex!important;align-items:flex-end!important;justify-content:flex-start!important;padding:22px!important}
[data-view="activity"] .avc-ty b{position:static!important;max-width:90%!important;font-size:clamp(1.5rem,2.3vw,2.1rem)!important;line-height:1.15!important;text-align:left!important}
[data-view="activity"] .avc-ty::before{display:none!important}

/* 3. "recommended #1" on Port Express: a plain outlined label, no medal, no gold gradient */
[data-view] .fx-main .rc{background:none!important;color:#fff!important;border:1px solid rgba(255,255,255,.45)!important;padding:6px 14px!important;box-shadow:none!important;text-shadow:none!important}
[data-view] .fx-main .rc .pxe-medal{display:none!important}

/* 4. the two other recommended courses: white cards instead of pink and mint */
[data-view] .fx-row .fx-s:nth-child(n){background:#fff!important;border:1px solid rgba(29,23,18,.08)!important;box-shadow:0 1px 0 rgba(29,23,18,.04),0 18px 36px -26px rgba(29,23,18,.35)!important}

/* 5. closing panel: ink, with the same code sea as the hero; the round face is gone */
body .end-in{background:#1D1712!important;padding-top:clamp(72px,9vw,120px)!important;padding-bottom:clamp(72px,9vw,120px)!important}
body .end-in h2{color:#FFF6E8!important}
body .end-in p{color:rgba(255,246,232,.72)!important}
body .end-in .e1{background:var(--or)!important;color:#1D1712!important}
.end-in>.kn-sea,.kn-sea{position:absolute!important;z-index:0!important;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0;transition:opacity .6s}
.kn-sea.on{opacity:1}
</style>
<script>
(function(){
  var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* a small code sea for any panel: rows of real code, shown where two slow waves pass; clear around the middle */
  function codeSea(host,color){
    if(!host||host.querySelector('.kn-sea'))return;var CODE=window.HXCODE;if(!CODE)return;
    var cv=document.createElement('canvas');cv.className='kn-sea';cv.setAttribute('aria-hidden','true');host.insertBefore(cv,host.firstChild);
    var cx=cv.getContext('2d'),at,cw,ch,dpr,W=0,H=0,cols,rows,rowC,mx=-1e4,my=-1e4,run=false,last=0;
    function size(){W=host.clientWidth;H=host.clientHeight;if(!W)return;dpr=Math.min(devicePixelRatio||1,2);var mob=W<640;cw=mob?7:8;ch=mob?13:15;
      cv.width=W*dpr;cv.height=H*dpr;cols=Math.ceil(W/cw);rows=Math.ceil(H/ch);
      at=document.createElement('canvas');at.width=94*cw*dpr;at.height=ch*dpr;var a=at.getContext('2d');a.scale(dpr,dpr);
      a.font='600 '+(ch*.78)+'px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';a.textAlign='center';a.textBaseline='middle';a.fillStyle=color;
      for(var g=0;g<94;g++)a.fillText(String.fromCharCode(33+g),g*cw+cw/2,ch/2+1);
      rowC=[];for(var j=0;j<rows;j++){var t=CODE[(j*5+3)%CODE.length]+'    ',r=new Uint8Array(cols),o=(j*11)%t.length;for(var i=0;i<cols;i++)r[i]=t.charCodeAt((i+o)%t.length);rowC.push(r)}}
    function frame(t){if(host.clientWidth!==W||host.clientHeight!==H){if(!host.clientWidth)return;size()}
      t/=1000;cx.clearRect(0,0,cv.width,cv.height);var bx=W/2,by=H/2,rx=Math.min(W*.46,560),ry=H*.36;
      for(var j=0;j<rows;j++){var y=j*ch+ch/2,v=y/H,RC=rowC[j];
        for(var i=0;i<cols;i++){var c=RC[i];if(c===32)continue;var x=i*cw+cw/2,u=x/W;
          var y1=.2+.1*Math.sin(u*5+t*.5)+.03*Math.sin(u*12-t*.8),y2=.82+.08*Math.sin(u*4.2-t*.42+1.4)+.03*Math.sin(u*10+t*.6);
          var d=Math.exp(-Math.pow((v-y1)/(.1+.03*Math.sin(u*3+t*.4)),2))+.9*Math.exp(-Math.pow((v-y2)/(.09+.03*Math.sin(u*2.6-t*.5)),2));
          d*=.74+.26*Math.sin(x*.2+y*.12+t*1.5)*Math.sin(x*.05-t*.6);
          var px=x-mx,py=y-my,pd=px*px+py*py;if(pd<40000)d+=.6*Math.exp(-pd/9000);
          var ex=(x-bx)/rx,ey=(y-by)/ry,m=Math.sqrt(ex*ex+ey*ey);d*=m<1?0:m<1.4?(m-1)*2.5:1;
          if(d<.2)continue;cx.globalAlpha=Math.min(.7,.1+d*.42);
          cx.drawImage(at,(c-33)*cw*dpr,0,cw*dpr,ch*dpr,i*cw*dpr,j*ch*dpr,cw*dpr,ch*dpr)}}
      cx.globalAlpha=1}
    function loop(t){if(!run)return;requestAnimationFrame(loop);if(t-last<33)return;last=t;frame(t)}
    size();cv.classList.add('on');
    if(rm){frame(0);addEventListener('resize',function(){frame(0)});return}
    new IntersectionObserver(function(es){var vis=es[0].isIntersecting;if(vis&&!run){run=true;requestAnimationFrame(loop)}else if(!vis)run=false}).observe(host);
    host.addEventListener('pointermove',function(e){var r=host.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top},{passive:true});
    host.addEventListener('pointerleave',function(){mx=my=-1e4});
  }
  function go(){document.querySelectorAll('.end-in').forEach(function(e){codeSea(e,'#F2A65E')})}
  if(document.readyState==='complete')go();else addEventListener('load',go);
})();
</script>
<style>
/* phone: the back-to-top button is smaller and tucked into the corner so it covers less of the cards */
@media (max-width:640px){.to-top{width:38px!important;height:38px!important;right:10px!important;bottom:calc(10px + env(safe-area-inset-bottom,0px))!important;opacity:.92}.to-top svg{width:18px!important;height:18px!important}}
</style>
<style>
/* search hamster: the brand's own drawn hamster peeks over the bar again (not the blob) */
[data-view="home"] .zq .zq-sw .zq-ham{display:block!important}
[data-view="home"] .zq .hm-pet,[data-view="home"] .zq .hm-w,[data-view="home"] .zq .tip{display:none!important}
/* Hall of Fame: the small "tear" drawing had a filled box that cut through the glow above the edge */
.h5f-tear .g{display:none!important}
</style>
