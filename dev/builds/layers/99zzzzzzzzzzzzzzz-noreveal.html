<style id="ly-noreveal">
/* owner's phone: the Port Express and Hamstarter cards stayed invisible. Sections faded in only when a scroll watcher fired,
   and on some phones it never did, so the content stayed at opacity 0. Content is now always shown; nothing waits on scrolling. */
html.mo-js .mo-goo,html.mo-js .mo-goo:not(.mo-in),html.mo-js .mo-rise,html.mo-js .mo-rise:not(.mo-in),
html.mo-js .mo-kids>*,html.mo-js .mo-kids:not(.mo-in)>*{opacity:1!important;transform:none!important;-webkit-mask:none!important;mask:none!important}
</style>
<style id="ly-nolines">
/* owner: the dashed line above each course's price row looked bad; removed */
html body [data-view] section.ft.ft.ft .fx-pr,html body [data-view="courses"] .fx-pr{border-top:0!important}
</style>
<style id="ly-fxf">
/* owner: no lines in the Port Express facts row, and the small labels in white */
html body [data-view] section.ft.ft.ft .fx-f,html body [data-view="courses"] .fx-f{border:0!important;padding:6px 0!important}
html body [data-view] section.ft.ft.ft .fx-f>span,html body [data-view="courses"] .fx-f>span{border:0!important;color:#fff!important}
html body [data-view] .fx-f>span,html body [data-view] .fx-f>span b{color:#fff!important}
</style>
