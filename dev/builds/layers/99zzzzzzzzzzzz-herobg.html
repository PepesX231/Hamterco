<style id="ly-herocards">
/* owner + team: the cheese had nothing to do with the product, and clips in circles said nothing. Following the Fastwork
   reference, the hero now sits on the plain page colour and is framed by real works, each a card that says who made it
   and where it got them: national wins, university places, games, apps used by real people. The headline still mirrors
   what the visitor wants, one line says who we are, the cards prove it, and the search is the next small step. */
html body [data-view="home"] .zq,html body [data-view="home"] .zq.ask{background:#FFFAF3!important}
html body [data-view="home"] .zq>.hx-cv{display:none!important}
html body [data-view="home"] .zq .zq-crew{display:none!important}
@media (min-width:1100px){html body [data-view="home"] .zq .zq-arw,html body [data-view="home"] .zq .zq-note{display:none!important}}

/* the orange drip under the hero belonged to the cheese; the page below simply continues */
html body [data-view="home"] .je{display:none!important}
/* example chips need a fill to read as buttons on the plain page colour */
html body [data-view="home"] .zq .zq-pop button{background:#F3E7D6!important}
html body [data-view="home"] .zq .zq-pop button:hover{background:#EBDAC3!important}
/* the orange liquid used to be the cheese being sucked into the bar; with no cheese it flooded the page from nowhere.
   Searching now just puts an orange rim round the bar and round the answers. */
html body [data-view="home"] .zq .sl-cv{display:none!important}
html body [data-view="home"] .zq #zqForm{transition:box-shadow .25s}
html body [data-view="home"] .zq:has(#zqIn:focus) #zqForm,html body [data-view="home"] .zq.ask #zqForm,html body [data-view="home"] .zq.sl-on #zqForm{box-shadow:0 0 0 7px #F2A65E,0 18px 40px -18px rgba(110,45,0,.45)!important}
html body [data-view="home"] .zq #zqRes{box-shadow:0 0 0 7px #F2A65E,0 30px 60px -30px rgba(110,45,0,.45)!important}
/* who we are, under the headline */
.zq-who{margin:6px auto 0;max-width:34em;font-size:clamp(16px,1.25vw,19px);line-height:1.6;color:#5A4A3C;text-wrap:balance}

/* the cards */
.hcw{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;transition:opacity .3s}
.hcc{position:absolute;inset:0;will-change:transform}
.hc{position:absolute;width:var(--w);left:var(--x);top:var(--y);pointer-events:auto;display:block;color:#1D1712;text-decoration:none;
  background:#fff;border-radius:16px;padding:8px 8px 12px;box-shadow:0 1px 0 rgba(60,35,10,.06),0 18px 40px -22px rgba(60,35,10,.45);
  transform:rotate(var(--r));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.hc:hover,.hc:focus-visible{transform:rotate(0) translateY(-4px)}
.hc:focus-visible{outline:2px solid #1D1712;outline-offset:3px}
.hc-m{display:block;position:relative;border-radius:10px;overflow:hidden;aspect-ratio:var(--a,4/3);background:#EFE6DA}
.hc-m img,.hc-m video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hc-m video{opacity:0;transition:opacity .4s}.hc-m video.pl{opacity:1}
.hc b{display:block;margin:10px 4px 0;font-size:15px;font-weight:700;line-height:1.3}
.hc em{display:block;margin:2px 4px 0;font-style:normal;font-size:13px;line-height:1.4;color:#7A6A5C}
/* one entrance: the cards slide in from their own side, once */
.hcw:not(.in) .hcl .hc{opacity:0;transform:translateX(-40px) rotate(var(--r))}
.hcw:not(.in) .hcr .hc{opacity:0;transform:translateX(40px) rotate(var(--r))}
.hcw.in .hc{transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .6s;transition-delay:calc(var(--i)*70ms),calc(var(--i)*70ms)}
.hcw.in.done .hc{transition-delay:0s}
/* gone while the visitor searches */
html body [data-view="home"] .zq.ask .hcw,html body [data-view="home"] .zq.sl-on .hcw,html body [data-view="home"] .zq.hx-white .hcw,html body [data-view="home"] .zq:has(#zqIn:focus) .hcw{opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}

/* narrower screens: no room beside the headline, so the same cards become a row the visitor can swipe, under the chips */
@media (max-width:1099px){
  .hcw{position:static;overflow:visible;margin:28px -16px 0;padding:0 16px}
  .hcc{position:static;display:contents;transform:none!important}
  .hcs{display:flex;align-items:flex-start;text-align:left;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 16px 18px;margin:0 -16px;scrollbar-width:none}
  .hcs::-webkit-scrollbar{display:none}
  .hc{position:relative;left:auto;top:auto;flex:0 0 156px;width:156px;scroll-snap-align:start;transform:none!important;opacity:1!important}
  .hc b{font-size:14px}.hc em{font-size:12px}
}
@media (prefers-reduced-motion:reduce){.hcw .hc{transition:none!important;opacity:1!important}}
</style>
<script>(function(){
  /* every line below is taken from the site's own text; [x, y, width at 1440, tilt, side, picture, aspect, name, line, clip] */
  var C=[
    [1,9,220,-4,'l','w-revoice.webp','4/3','น้องไอดิน','REVOICE ชนะ NSC 2025 ระดับประเทศ'],
    [12.5,36,164,4,'l','dek69-6.webp','4/5','น้องต้นกล้า','ติดจุฬาฯ รอบ Portfolio'],
    [1.5,67,212,-3,'l','work-stressstrike.webp','16/9','StressStrike','ชนะเลิศ OBEC Roboplayground','hole-stressstrike.mp4'],
    [83.5,9,220,4,'r','w-hmap.webp','16/10','PHC Map','ใช้สอนเด็กไปแล้วกว่า 1,000 คน'],
    [77.5,35,164,-4,'r','dek69-1.webp','4/5','น้องปลื้ม','ติดสถิติประยุกต์ฯ สจล.'],
    [84,67,212,3,'r','work-slash-speed.webp','16/9','SLASH//SPEED','เกมที่น้องสร้างเองในคอร์ส','hole-slash-speed2.mp4']];
  function go(){var z=document.querySelector('[data-view="home"] .zq');if(!z||z.querySelector('.hcw'))return;
    var h=z.querySelector('.zq-h');if(h&&!z.querySelector('.zq-who')){var p=document.createElement('p');p.className='zq-who';
      p.textContent='ที่ Hamster Hub น้อง ม.ปลาย สร้างเกมและแอปของตัวเอง จนติดมหาลัยและชนะระดับประเทศ';h.insertAdjacentElement('afterend',p)}
    var w=document.createElement('div');w.className='hcw';w.setAttribute('aria-label','ผลงานจริงของน้องๆ');
    var L=document.createElement('div');L.className='hcc hcl';var R=document.createElement('div');R.className='hcc hcr';
    var S=document.createElement('div');S.className='hcs';
    C.forEach(function(c,i){var a=document.createElement('a');a.className='hc';a.href='#works';
      a.style.cssText='--x:'+c[0]+'%;--y:'+c[1]+'%;--w:clamp('+Math.round(c[2]*.8)+'px,'+(c[2]/14.4).toFixed(2)+'vw,'+Math.round(c[2]*1.2)+'px);--r:'+c[3]+'deg;--a:'+c[6]+';--i:'+(c[4]==='l'?i:i-3)+';z-index:'+(10-i%3);
      var ar=c[6].split('/');a.innerHTML='<span class="hc-m" style="aspect-ratio:auto;padding-top:'+(100*ar[1]/ar[0]).toFixed(2)+'%"><img src="img/'+c[5]+'" alt="" loading="lazy" decoding="async"></span><b></b><em></em>';
      a.querySelector('b').textContent=c[7];a.querySelector('em').textContent=c[8];
      if(c[9]){var v=document.createElement('video');v.muted=true;v.loop=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('muted','');v.preload='none';v.dataset.src='img/'+c[9];v.setAttribute('aria-hidden','true');a.querySelector('.hc-m').appendChild(v)}
      a.dataset.side=c[4];(c[4]==='l'?L:R).appendChild(a)});
    w.appendChild(L);w.appendChild(R);
    /* layout switch: beside the headline on wide screens, a swipeable row under the chips on narrow ones */
    var top=z.querySelector('.zq-top')||z;var mq=matchMedia('(max-width:1099px)');
    function lay(){var cards=[].slice.call(w.querySelectorAll('.hc'));cards.sort(function(a,b){return a.style.getPropertyValue('--i')-b.style.getPropertyValue('--i')});
      if(mq.matches){/* alternate works and people in the row */var order=[0,3,1,4,2,5].map(function(k){return w.__all[k]});order.forEach(function(c){S.appendChild(c)});w.appendChild(S);top.appendChild(w)}
      else{w.__all.forEach(function(c){(c.dataset.side==='l'?L:R).appendChild(c)});if(S.parentNode)S.remove();z.insertBefore(w,z.firstChild)}}
    w.__all=[].slice.call(w.querySelectorAll('.hc'));lay();mq.addEventListener('change',lay);
    requestAnimationFrame(function(){requestAnimationFrame(function(){w.classList.add('in');setTimeout(function(){w.classList.add('done')},1400)})});
    /* the two columns drift apart a little as the visitor scrolls: an answer to scrolling, not motion on its own */
    var tk=0;addEventListener('scroll',function(){if(tk||mq.matches)return;tk=requestAnimationFrame(function(){tk=0;var y=Math.min(scrollY,900);L.style.transform='translate3d(0,'+(-y*.12)+'px,0)';R.style.transform='translate3d(0,'+(y*.06)+'px,0)'})},{passive:true});
    /* clips play only while the hero is on screen and nobody is searching; they load after the page */
    var vs=[].slice.call(w.querySelectorAll('video')),vis=true,ready=false;
    function run(){var q=document.getElementById('zqIn');vs.forEach(function(v){var on=ready&&vis&&!/\b(ask|sl-on|hx-white)\b/.test(z.className)&&document.activeElement!==q;
      if(on){if(!v.src){v.src=v.dataset.src;v.addEventListener('playing',function(){v.classList.add('pl')},{once:true})}var p=v.play();if(p&&p.catch)p.catch(function(){})}else if(v.src)v.pause()})}
    if('IntersectionObserver' in window)new IntersectionObserver(function(e){vis=e[0].isIntersecting;run()}).observe(z);
    new MutationObserver(run).observe(z,{attributes:true,attributeFilter:['class']});
    var q=document.getElementById('zqIn');if(q){q.addEventListener('focus',function(){setTimeout(run,0)});q.addEventListener('blur',function(){setTimeout(run,0)})}
    function ld(){ready=true;run()}if(document.readyState==='complete')setTimeout(ld,300);else addEventListener('load',function(){setTimeout(ld,300)})}
  if(document.readyState==='loading')addEventListener('DOMContentLoaded',go);else go();setTimeout(go,800)})();</script>
<style id="ly-center">
/* owner: the search bar sat 65px right of centre on desktop. Its wrapper was 630px wide but the bar is 760px, so the bar spilled
   out to the right. The wrapper now takes the bar's own width and is centred under the headline. */
@media (min-width:900px){html body [data-view="home"] .zq .zq-top .zq-sw{width:fit-content!important;max-width:100%!important;margin-left:auto!important;margin-right:auto!important}}
</style>
