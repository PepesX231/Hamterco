<style id="ly-herobg8">
/* owner: the cheese comes back, but it should be about the product. Some holes in the cheese are windows: through them you see
   real works made here (game-jam games, the Mr. City startup app, REVOICE from NSC, DEK69 portfolio results). The hole's own
   inset shadow sits on top of the picture, so it reads as looking down into the cheese, not a sticker. Static, no animation. */

  background:radial-gradient(circle at 62% 66%,#EC9640 0 46%,#E0852F 100%);
  box-shadow:inset calc(var(--s)*.09) calc(var(--s)*.12) 0 rgba(150,70,8,.32),inset calc(var(--s)*-.03) calc(var(--s)*-.04) 0 rgba(255,214,150,.55),0 1px 0 rgba(255,222,165,.7)}

.zq-ch2 i.w{background:var(--img) center/cover no-repeat,#E0852F;
  box-shadow:inset calc(var(--s)*.07) calc(var(--s)*.09) calc(var(--s)*.06) rgba(110,48,4,.55),inset 0 0 0 calc(var(--s)*.035) #E58C38,inset calc(var(--s)*-.02) calc(var(--s)*-.03) 0 calc(var(--s)*.035) rgba(255,214,150,.7),0 1px 0 rgba(255,222,165,.7)}

html body [data-view="home"] .zq.ask .zq-ch2,html body [data-view="home"] .zq.sl-on .zq-ch2,html body [data-view="home"] .zq.hx-white .zq-ch2,html body [data-view="home"] .zq:has(#zqIn:focus) .zq-ch2{opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
@media (max-width:700px){.zq-ch2 i.sm-off{display:none}}
/* no scrolling code text on the cheese; hidden canvas also stops its drawing loop */
html body [data-view="home"] .zq>.hx-cv{display:none!important}
/* self-review: the works load only after the page has loaded (so 14 pictures don't slow the first paint) and fade in; a work
   hole can be pointed at: it shows the work's name under it and leads to the works page. Nothing moves on its own. */
.zq-ch2 i.w::before{content:"";position:absolute;inset:0;border-radius:50%;background:#E0852F;opacity:1;transition:opacity .6s;
  box-shadow:inherit}
.zq-ch2.on i.w.ld::before{opacity:0}
.zq-ch2 a{position:absolute;inset:0;border-radius:50%;pointer-events:auto;cursor:pointer}
.zq-ch2 i.w b{position:absolute;left:50%;top:100%;transform:translate(-50%,4px);white-space:nowrap;font:600 13px/1.2 inherit;font-family:inherit;
  color:#3A2008;font-style:normal;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.zq-ch2 i.w:hover b,.zq-ch2 i.w:focus-within b{opacity:1;transform:translate(-50%,8px)}
.zq-ch2 a:focus-visible{outline:2px solid #3A2008;outline-offset:3px}
@media (hover:none){.zq-ch2 i.w b{display:none}}
/* a playing clip fills the hole under the hole's own shadow ring */
.zq-ch2 i.w video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;opacity:0;transition:opacity .5s}
.zq-ch2 i.w video.pl{opacity:1}
.zq-ch2 i.w::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inherit;pointer-events:none}
</style>
