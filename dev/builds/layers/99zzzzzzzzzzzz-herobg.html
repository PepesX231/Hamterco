<style id="ly-herocards">
/* owner + team: the cheese had nothing to do with the product, and clips in circles said nothing. Following the Fastwork
   reference, the hero now sits on the plain page colour and is framed by real works, each a card that says who made it
   and where it got them: national wins, university places, games, apps used by real people. The headline still mirrors
   what the visitor wants, one line says who we are, the cards prove it, and the search is the next small step. */
html body [data-view="home"] .zq,html body [data-view="home"] .zq.ask{background:#FFFAF3!important}
html body [data-view="home"] .zq>.hx-cv{display:none!important}
html body [data-view="home"] .zq .zq-crew{display:none!important}
@media (min-width:1100px){html body [data-view="home"] .zq .zq-arw,html body [data-view="home"] .zq .zq-note{display:none!important}}

/* the orange drip under the hero belonged to the cheese; the page below simply continues */
html body [data-view="home"] .je{display:none!important}
/* example chips need a fill to read as buttons on the plain page colour */
html body [data-view="home"] .zq .zq-pop button{background:#F3E7D6!important}
html body [data-view="home"] .zq .zq-pop button:hover{background:#EBDAC3!important}
/* the orange liquid used to be the cheese being sucked into the bar; with no cheese it flooded the page from nowhere.
   Searching now just puts an orange rim round the bar and round the answers. */
html body [data-view="home"] .zq .sl-cv{display:none!important}
html body [data-view="home"] .zq #zqForm{transition:box-shadow .25s}


/* while answers are open the content is pinned where it was, so growing the hero for the answers only adds room at the
   bottom. Before, the hero was centred: growing it moved the answers, which made it shrink again, over and over (it jittered). */
html body [data-view="home"] .zq.zq-pin{justify-content:flex-start!important}
/* who we are, under the headline */
.zq-who span{display:inline-block}
.zq-who{margin:6px auto 0;max-width:31em;font-size:clamp(16px,1.25vw,19px);line-height:1.6;color:#5A4A3C;text-wrap:balance}

/* the cards */
.hcw{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;transition:opacity .3s}
.hcc{position:absolute;inset:0;will-change:transform}
.hc{position:absolute;width:var(--w);left:var(--x);top:var(--y);pointer-events:auto;display:block;color:#1D1712;text-decoration:none;
  background:#fff;border-radius:0;padding:6px 6px 12px;border:1.5px solid #1D1712;box-shadow:5px 5px 0 #1D1712;
  transform:rotate(var(--r));transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,opacity .3s,filter .3s}
/* pointing at one card brings it forward and lets the others step back */
.hc:hover,.hc:focus-visible{z-index:40!important;transform:rotate(0) translate(-3px,-3px) scale(1.07);box-shadow:9px 9px 0 #1D1712}
@media (hover:hover){.hcw:has(.hc:hover) .hc:not(:hover){opacity:.5;filter:saturate(.5)}}
.hc:focus-visible{outline:2px solid #E07A1F;outline-offset:4px}
.hc-m{display:block;position:relative;border-radius:0;overflow:hidden;background:#EFE6DA;outline:1.5px solid #1D1712}
.hc-m img,.hc-m video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hc-m video{opacity:0;transition:opacity .4s}.hc-m video.pl{opacity:1}
/* people get a round face, like a profile, overlapping the picture */
.hc-av{display:block;position:relative;z-index:1;width:40px;height:40px;margin:-22px 0 0 10px;border-radius:0;border:1.5px solid #1D1712;
  background-color:#EFE6DA;background-size:300%;box-shadow:3px 3px 0 #1D1712}
.hc b{display:block;margin:10px 6px 0;font-size:15px;font-weight:700;line-height:1.3;letter-spacing:-.005em}
.hc-av+b{margin-top:6px}
.hc em{display:block;margin:3px 8px 0;font-style:normal;font-size:12.5px;line-height:1.4;color:#857565}
/* one entrance: the cards slide in from their own side, once */
.hcw:not(.in) .hcl .hc{opacity:0;transform:translateX(-40px) rotate(var(--r))}
.hcw:not(.in) .hcr .hc{opacity:0;transform:translateX(40px) rotate(var(--r))}
.hcw.in .hc{transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .6s;transition-delay:calc(var(--i)*70ms),calc(var(--i)*70ms)}
.hcw.in.done .hc{transition-delay:0s}
/* gone while the visitor searches */
/* the cards are taken into the search bar and given back by the fx layer; nothing else hides them */
html body [data-view="home"] .zq.ask .hcw{pointer-events:none}
@media (prefers-reduced-motion:reduce){html body [data-view="home"] .zq.ask .hcw,html body [data-view="home"] .zq:has(#zqIn:focus) .hcw{opacity:0;visibility:hidden}}

/* narrower screens, Fastwork's phone layout: the text on top, then an open middle for the thumb to scroll, with the
   work cards leaning in from the two sides only. They run past the screen's side edges (as in Fastwork) but their
   bottoms stay inside the hero, so no edge ever cuts across a tilted card. A pencil writes an invitation in the middle. */
@media (max-width:1099px){
  html.nv-home body [data-view="home"] .zq,html body [data-view="home"] .zq{justify-content:flex-start!important;padding-top:calc(52px + 84px)!important;padding-bottom:0!important;min-height:100svh!important;overflow-x:clip}
  html body [data-view="home"] .zq .zq-top{margin-top:0!important;position:relative;z-index:3;flex:1;display:flex;flex-direction:column}
  html body [data-view="home"] .zq .mo-cue,html body [data-view="home"] .zq .zq-arw,html body [data-view="home"] .zq .zq-note{display:none!important}
  .hcw{position:relative;inset:auto;flex:1;width:100vw;max-width:none;margin:0 0 0 calc(50% - 50vw);min-height:240px;overflow:visible}
  .hcc{position:absolute;inset:0;transform:none!important}
  .hc{top:auto;bottom:var(--mb);width:min(var(--mw),var(--mwx));--r:var(--mr);padding:4px;box-shadow:4px 4px 0 #1D1712}
  .hcl .hc{left:var(--mo)}.hcr .hc{left:auto;right:var(--mo)}
  .hc.ph-off{display:none}
  .hc b,.hc em,.hc .hc-av{display:none}
  /* the pencil note */
  .zq-pn{position:absolute;z-index:6;left:50%;top:4px;margin-left:-115px;height:96px;width:230px;pointer-events:none}
  .zq-pn svg{position:absolute;left:0;top:0;width:230px;height:96px;overflow:visible}
  .zq-pn svg path{fill:none;stroke:#2A221D;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .zq-pn p{position:absolute;left:44px;top:34px;margin:0;font:700 19px/1.3 Mali,Anuphan,system-ui,sans-serif;color:#2A221D;white-space:nowrap;transform:rotate(-3deg);clip-path:inset(-20% 100% -20% 0)}
  .zq-pn img{display:none!important;position:absolute;left:0;top:0;width:118px;height:auto;transform-origin:98.6% 49%;opacity:0;transition:opacity .25s}
  html body [data-view="home"] .zq.ask .zq-pn,html body [data-view="home"] .zq:has(#zqIn:focus) .zq-pn{opacity:0;transition:opacity .2s}
}
@media (min-width:1100px){.zq-pn{display:none}}
@media (prefers-reduced-motion:reduce){.hcw .hc{transition:none!important;opacity:1!important}}
</style>
<script>(function(){
  /* every line below is taken from the site's own text; [x, y, width at 1440, tilt, side, picture, aspect, name, line, clip] */

    [11,37,166,3,'l','dek69-6.webp','4/5','น้องต้นกล้า','ติดจุฬาฯ รอบ Portfolio',0,[-3,38,27,6],[74,50]],

    [78.5,35,166,-3,'r','dek69-1.webp','4/5','น้องปลื้ม','ติดสถิติประยุกต์ฯ สจล.',0,[-4,40,27,-6],[68,46]],

  function go(){var z=document.querySelector('[data-view="home"] .zq');if(!z||z.querySelector('.hcw'))return;
    var h=z.querySelector('.zq-h');if(h&&!z.querySelector('.zq-who')){var p=document.createElement('p');p.className='zq-who';
      p.innerHTML=['ที่ Hamster Hub น้อง ม.ปลาย','สร้างผลงานจริงของตัวเอง','ใช้ยื่นเข้ามหาลัย','ต่อยอดเป็นสตาร์ทอัพ','และชนะรางวัลระดับประเทศ'].map(function(t){return '<span>'+t+'</span>'}).join(' ');h.insertAdjacentElement('afterend',p)}

    var w=document.createElement('div');w.className='hcw';w.setAttribute('aria-label','ผลงานจริงของน้องๆ');

    var S=document.createElement('div');S.className='hcs';
    C.forEach(function(c,i){var a=document.createElement('a');a.className='hc';a.href='#works';
      a.style.cssText='--x:'+c[0]+'%;--y:'+c[1]+'%;--w:clamp('+Math.round(c[2]*.8)+'px,'+(c[2]/14.4).toFixed(2)+'vw,'+Math.round(c[2]*1.2)+'px);--r:'+c[3]+'deg;--a:'+c[6]+';--i:'+(c[4]==='l'?i:i-3)+';z-index:'+(10-i%3)+(c[10]?';--mo:'+c[10][0]+'%;--mb:'+c[10][1]+'%;--mw:'+c[10][2]+'%;--mwx:'+Math.round(c[10][2]*6.6)+'px;--mr:'+c[10][3]+'deg':'');if(!c[10])a.classList.add('ph-off');

      if(c[9]){var v=document.createElement('video');v.muted=true;v.loop=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('muted','');v.disablePictureInPicture=true;v.setAttribute('disablepictureinpicture','');v.setAttribute('controlslist','nodownload nofullscreen noremoteplayback');v.preload='none';v.dataset.src='img/'+c[9];v.setAttribute('aria-hidden','true');a.querySelector('.hc-m').appendChild(v)}

<style id="ly-center">
/* owner: the search bar sat 65px right of centre on desktop. Its wrapper was 630px wide but the bar is 760px, so the bar spilled
   out to the right. The wrapper now takes the bar's own width and is centred under the headline. */

</style>
