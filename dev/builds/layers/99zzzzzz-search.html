<style id="ly-search-pull">
/* hero sits right under the bar */
html body [data-view="home"] .zq{margin-top:-6px!important}
/* the search bar is the thing to touch: bigger, a slow breathing halo, and a ready-made question inside it */
@media (min-width:700px){
  html body [data-view="home"] .zq #zqForm{width:min(760px,86vw)!important;max-width:none!important;min-height:72px;font-size:1.1rem}
  html body [data-view="home"] .zq #zqIn{font-size:1.12rem!important}
  html body [data-view="home"] .zq .zq-go{padding:14px 26px!important;font-size:1.05rem!important}
}
#zqForm{position:relative}
/* a warm light breathes behind the bar (opacity only, no ring) */
.zq-halo{position:absolute;inset:-18px -26px;border-radius:999px;pointer-events:none;z-index:-1;opacity:.35;will-change:opacity;
  background:radial-gradient(50% 50% at 50% 50%,rgba(255,250,236,.95) 40%,rgba(255,236,200,0) 100%);animation:zqHalo 3.2s ease-in-out infinite alternate}
.zq-halo.b{display:none}
@keyframes zqHalo{to{opacity:.95}}
#zqForm:focus-within .zq-halo{animation:none;opacity:.8}
/* the question shown inside the empty bar follows the headline; pressing ค้นหา on an empty bar asks it */
#zqIn::placeholder{transition:opacity .25s;color:rgba(29,23,18,.55)!important}
#zqForm.ph-sw #zqIn::placeholder{opacity:0}
.zq-try{display:none!important}
/* once the hero is gone, a small search pill waits at the bottom */
.zq-fab{all:unset;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:900;display:flex;align-items:center;gap:10px;cursor:pointer;
  padding:12px 20px 12px 16px;border-radius:999px;background:#1D1712;color:#FFF6E8;font-weight:700;font-size:.98rem;box-shadow:0 16px 34px -14px rgba(29,23,18,.7);
  transform:translate(-50%,140%);opacity:0;transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .25s;white-space:nowrap}
.zq-fab svg{width:18px;height:18px;flex:none}
.zq-fab small{font-weight:500;color:rgba(255,246,232,.6);font-size:.88rem}
.zq-fab.on{transform:translate(-50%,0);opacity:1}
.zq-fab:hover{background:#B85F14}
.zq-fab:focus-visible{outline:2px solid #F2A65E;outline-offset:3px}
@media (max-width:480px){.zq-fab small{display:none}}
@media (prefers-reduced-motion:reduce){.zq-halo{animation:none}.zq-fab{transition:opacity .2s}}
</style>
<script>
(function(){
  addEventListener('scroll',function(){window.__scr=performance.now()},{passive:true});
  function go(){var form=document.getElementById('zqForm'),inp=document.getElementById('zqIn'),go=form&&form.querySelector('.zq-go'),typ=document.getElementById('zqType');if(!form||form.dataset.pull)return;form.dataset.pull=1;

    /* the empty bar shows the headline's wish as a question; ค้นหา on an empty bar asks it */
    var cur='',tm=0;

      setTimeout(function(){form.classList.remove('ph-sw');if(window.__zqType)window.__zqType('ลองถาม: อยาก'+w);else inp.setAttribute('placeholder','ลองถาม: อยาก'+w)},250)}
    if(typ){new MutationObserver(function(){if(!inp.value&&inp.getAttribute('placeholder')!==(innerWidth<640?'ถามเราได้เลย':'พิมพ์ถามเราได้เลย น้องอยากทำอะไร'))inp.setAttribute('placeholder',(innerWidth<640?'ถามเราได้เลย':'พิมพ์ถามเราได้เลย น้องอยากทำอะไร'));clearTimeout(tm);tm=setTimeout(function(){var w=(typ.textContent||'').trim();if(w===cur){cur='';setQ()}else setQ()},700)}).observe(typ,{childList:true,characterData:true,subtree:true});setQ()}
    form.addEventListener('submit',function(){if(!inp.value.trim()&&cur){inp.value='อยาก'+cur;inp.dispatchEvent(new Event('input',{bubbles:true}))}},true);
    go&&go.addEventListener('pointerdown',function(){if(!inp.value.trim()&&cur){inp.value='อยาก'+cur;inp.dispatchEvent(new Event('input',{bubbles:true}))}});
    var used=function(){form.classList.add('used')};inp.addEventListener('focus',used);form.addEventListener('submit',used);

    document.body.appendChild(fab);
    var zq=document.querySelector('[data-view="home"] .zq'),past=false,near=false;

</script>
<style id="ly-chibi">
/* the search hamster: only its ears show over the bar; it pops up when the visitor taps the bar */
#zqHam{visibility:hidden!important}
.zq-ch{position:absolute;z-index:6;width:132px;height:88px;cursor:pointer;-webkit-tap-highlight-color:transparent;will-change:transform,clip-path}
.zq-ch .hd{position:absolute;inset:0;transform-origin:50% 100%;will-change:transform}
.zq-ch svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.zq-ch .ear{transform-box:fill-box;transform-origin:50% 90%}
.zq-ch .eyes,.zq-ch .ey{transform-box:fill-box;transform-origin:50% 50%}
.zq-ch .hap{opacity:0}.zq-ch.happy .hap{opacity:1}.zq-ch.happy .ey{opacity:0}
.zq-ch .spk{opacity:0;transition:opacity .2s}.zq-ch.spark .spk{opacity:1}
@media (max-width:640px){.zq-ch{width:99px;height:66px}}


/* the invitation lives on the bar itself: a warm light sweeps across it and the button nudges */
.zq-sh{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.zq-sh::before{content:"";position:absolute;top:0;bottom:0;left:-40%;width:34%;transform:skewX(-20deg) translateX(0);
  background:linear-gradient(90deg,rgba(242,166,94,0),rgba(242,166,94,.22) 45%,rgba(255,214,150,.35) 50%,rgba(242,166,94,.22) 55%,rgba(242,166,94,0))}
#zqForm.inv .zq-sh::before{animation:zqSweep 1.3s cubic-bezier(.45,0,.2,1)}
@keyframes zqSweep{to{transform:skewX(-20deg) translateX(520%)}}
#zqForm.inv .zq-go{animation:zqNudge .7s cubic-bezier(.3,1.6,.5,1) 1s}
@keyframes zqNudge{30%{transform:scale(1.07)}60%{transform:scale(.97)}100%{transform:none}}
#zqForm>*:not(.zq-sh):not(.zq-halo){position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){#zqForm.inv .zq-sh::before,#zqForm.inv .zq-go{animation:none}}
</style>
