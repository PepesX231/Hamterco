<style id="ly-search-pull">
/* hero sits right under the bar */
html body [data-view="home"] .zq{margin-top:-6px!important}
/* the search bar is the thing to touch: bigger, a slow breathing halo, and a ready-made question inside it */
@media (min-width:700px){
  html body [data-view="home"] .zq #zqForm{width:min(760px,86vw)!important;max-width:none!important;min-height:72px;font-size:1.1rem}
  html body [data-view="home"] .zq #zqIn{font-size:1.12rem!important}
  html body [data-view="home"] .zq .zq-go{padding:14px 26px!important;font-size:1.05rem!important}
}
#zqForm{position:relative}
/* a warm light breathes behind the bar (opacity only, no ring) */
.zq-halo{position:absolute;inset:-18px -26px;border-radius:999px;pointer-events:none;z-index:-1;opacity:.35;will-change:opacity;
  background:radial-gradient(50% 50% at 50% 50%,rgba(255,250,236,.95) 40%,rgba(255,236,200,0) 100%);animation:zqHalo 3.2s ease-in-out infinite alternate}
.zq-halo.b{display:none}
@keyframes zqHalo{to{opacity:.95}}
#zqForm:focus-within .zq-halo{animation:none;opacity:.8}
/* the question shown inside the empty bar follows the headline; pressing ค้นหา on an empty bar asks it */
#zqIn::placeholder{transition:opacity .25s;color:rgba(29,23,18,.55)!important}
#zqForm.ph-sw #zqIn::placeholder{opacity:0}
.zq-try{display:none!important}
/* once the hero is gone, a small search pill waits at the bottom */
.zq-fab{all:unset;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:900;display:flex;align-items:center;gap:10px;cursor:pointer;
  padding:12px 20px 12px 16px;border-radius:999px;background:#1D1712;color:#FFF6E8;font-weight:700;font-size:.98rem;box-shadow:0 16px 34px -14px rgba(29,23,18,.7);
  transform:translate(-50%,140%);opacity:0;transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .25s;white-space:nowrap}
.zq-fab svg{width:18px;height:18px;flex:none}
.zq-fab small{font-weight:500;color:rgba(255,246,232,.6);font-size:.88rem}
.zq-fab.on{transform:translate(-50%,0);opacity:1}
.zq-fab:hover{background:#B85F14}
.zq-fab:focus-visible{outline:2px solid #F2A65E;outline-offset:3px}
@media (max-width:480px){.zq-fab small{display:none}}
@media (prefers-reduced-motion:reduce){.zq-halo{animation:none}.zq-fab{transition:opacity .2s}}
</style>
<script>
(function(){
  addEventListener('scroll',function(){window.__scr=performance.now()},{passive:true});
  function go(){var form=document.getElementById('zqForm'),inp=document.getElementById('zqIn'),go=form&&form.querySelector('.zq-go'),typ=document.getElementById('zqType');if(!form||form.dataset.pull)return;form.dataset.pull=1;
    ['a','b'].forEach(function(c){var h=document.createElement('i');h.className='zq-halo '+c;h.setAttribute('aria-hidden','true');form.insertBefore(h,form.firstChild)});
    /* the empty bar shows the headline's wish as a question; ค้นหา on an empty bar asks it */
    var cur='',tm=0;
    function setQ(){var w=(typ&&typ.textContent||'').trim();if(!w||w===cur)return;cur=w;form.classList.add('ph-sw');
      setTimeout(function(){form.classList.remove('ph-sw');if(window.__zqType)window.__zqType('ลองถาม: อยาก'+w);else inp.setAttribute('placeholder','ลองถาม: อยาก'+w)},250)}
    if(typ){new MutationObserver(function(){if(!inp.value&&inp.getAttribute('placeholder')!==(innerWidth<640?'ถามเราได้เลย':'พิมพ์ถามเราได้เลย น้องอยากทำอะไร'))inp.setAttribute('placeholder',(innerWidth<640?'ถามเราได้เลย':'พิมพ์ถามเราได้เลย น้องอยากทำอะไร'));clearTimeout(tm);tm=setTimeout(function(){var w=(typ.textContent||'').trim();if(w===cur){cur='';setQ()}else setQ()},700)}).observe(typ,{childList:true,characterData:true,subtree:true});setQ()}
    form.addEventListener('submit',function(){if(!inp.value.trim()&&cur){inp.value='อยาก'+cur;inp.dispatchEvent(new Event('input',{bubbles:true}))}},true);
    go&&go.addEventListener('pointerdown',function(){if(!inp.value.trim()&&cur){inp.value='อยาก'+cur;inp.dispatchEvent(new Event('input',{bubbles:true}))}});
    var used=function(){form.classList.add('used')};inp.addEventListener('focus',used);form.addEventListener('submit',used);
    /* bottom pill */
    var fab=document.createElement('button');fab.type='button';fab.className='zq-fab';
    fab.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>ถามเราได้เลย<small>ช่วยหาคอร์สที่ใช่ให้น้อง</small>';
    document.body.appendChild(fab);
    var zq=document.querySelector('[data-view="home"] .zq'),past=false,near=false;
    function upd(){var home=!location.hash||/^#(home)?$/.test(location.hash);fab.classList.toggle('on',home&&past&&!near&&!document.body.classList.contains('zq-open'))}
    if(zq)new IntersectionObserver(function(es){past=!es[0].isIntersecting&&es[0].boundingClientRect.top<0;upd()}).observe(zq);
    var foot=document.querySelector('footer');if(foot)new IntersectionObserver(function(es){near=es[0].isIntersecting;upd()}).observe(foot);
    addEventListener('hashchange',upd);
    fab.addEventListener('click',function(){var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;scrollTo({top:0,behavior:rm?'auto':'smooth'});
      var t0=Date.now();(function w(){if(scrollY<10||Date.now()-t0>1200){inp.focus({preventScroll:true})}else requestAnimationFrame(w)})()})}
  if(document.readyState==='complete')go();else addEventListener('load',go);
})();
</script>
<style id="ly-chibi">
/* the search hamster: only its ears show over the bar; it pops up when the visitor taps the bar */
#zqHam{visibility:hidden!important}
.zq-ch{position:absolute;z-index:6;width:120px;height:85px;cursor:pointer;-webkit-tap-highlight-color:transparent;will-change:transform,clip-path}
.zq-ch .hd{position:absolute;inset:0;transform-origin:50% 100%;will-change:transform}
.zq-ch .hd>img{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-drag:none;pointer-events:none}
.zq-ch .ey{position:absolute;top:67.5%;width:13%;height:20%;margin:-10% 0 0 -6.5%;transform-origin:50% 50%}
.zq-ch .ey.l{left:32%}.zq-ch .ey.r{left:67%}
.zq-ch .ey svg{width:100%;height:100%;overflow:visible;display:block}
.zq-ch .ey .op{transition:opacity .08s}.zq-ch .ey .hp{opacity:0;transition:opacity .08s}
.zq-ch.happy .ey .op{opacity:0}.zq-ch.happy .ey .hp{opacity:1}
@media (max-width:640px){.zq-ch{width:88px;height:62px}}
html body [data-view="home"] .zq .zq-sw{margin-top:46px!important}
@media (max-width:640px){html body [data-view="home"] .zq .zq-sw{margin-top:44px!important}}
/* the invitation lives on the bar itself: a warm light sweeps across it and the button nudges */
.zq-sh{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.zq-sh::before{content:"";position:absolute;top:0;bottom:0;left:-40%;width:34%;transform:skewX(-20deg) translateX(0);
  background:linear-gradient(90deg,rgba(242,166,94,0),rgba(242,166,94,.22) 45%,rgba(255,214,150,.35) 50%,rgba(242,166,94,.22) 55%,rgba(242,166,94,0))}
#zqForm.inv .zq-sh::before{animation:zqSweep 1.3s cubic-bezier(.45,0,.2,1)}
@keyframes zqSweep{to{transform:skewX(-20deg) translateX(520%)}}
#zqForm.inv .zq-go{animation:zqNudge .7s cubic-bezier(.3,1.6,.5,1) 1s}
@keyframes zqNudge{30%{transform:scale(1.07)}60%{transform:scale(.97)}100%{transform:none}}
#zqForm>*:not(.zq-sh):not(.zq-halo){position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){#zqForm.inv .zq-sh::before,#zqForm.inv .zq-go{animation:none}}
</style>
<script>
(function(){
  function go(){var ham=document.getElementById('zqHam'),sw=ham&&ham.closest('.zq-sw'),inp=document.getElementById('zqIn'),form=document.getElementById('zqForm');if(!sw||sw.querySelector('.zq-ch'))return;
    if(getComputedStyle(sw).position==='static')sw.style.position='relative';
    var rm=matchMedia('(prefers-reduced-motion: reduce)').matches,ch=document.createElement('div');ch.className='zq-ch';ch.setAttribute('aria-hidden','true');
    var EYE='<svg viewBox="-10 -12 20 24"><g class="op"><ellipse rx="7.2" ry="9" fill="#3B2416"/><g class="pu"><circle cx="2.4" cy="-3.6" r="2.6" fill="#fff"/><circle cx="-2.6" cy="3.4" r="1.2" fill="#fff" opacity=".85"/></g></g><path class="hp" d="M-7 2.5Q0 -6 7 2.5" fill="none" stroke="#3B2416" stroke-width="2.6" stroke-linecap="round"/></svg>';
    ch.innerHTML='<div class="hd"><img src="img/ham-face.webp" alt=""><span class="ey l">'+EYE+'</span><span class="ey r">'+EYE+'</span></div>';sw.insertBefore(ch,sw.firstChild);
    var hd=ch.querySelector('.hd'),eyes=[].slice.call(ch.querySelectorAll('.ey')),pus=[].slice.call(ch.querySelectorAll('.pu'));
    var sh=document.createElement('span');sh.className='zq-sh';sh.setAttribute('aria-hidden','true');form.insertBefore(sh,form.firstChild);
    function place(){var a=ham.getBoundingClientRect(),f=form.getBoundingClientRect(),r=sw.getBoundingClientRect(),w=ch.offsetWidth;
      var cx=a.width?a.left+a.width/2:f.left+f.width*.62;ch.style.left=(cx-r.left-w/2)+'px';ch.style.top=(f.top-r.top-ch.offsetHeight+1)+'px'}
    place();addEventListener('resize',place);setTimeout(place,600);setTimeout(place,2000);
    /* springs, drawn every frame (60fps) */
    function spr(x,k,c){return {x:x,v:0,t:x,k:k,c:c}}
    function step(s,dt){var a=-s.k*(s.x-s.t)-s.c*s.v;s.v+=a*dt;s.x+=s.v*dt}
    var H=function(){return ch.offsetHeight},HIDE=function(){return H()*.21},
        Y=spr(0,170,13),SX=spr(1,320,14),ROT=spr(0,120,12),LX=spr(0,140,16),LY=spr(0,140,16),BL=spr(1,900,40);
    Y.x=Y.t=HIDE();
    var up=false,mx=null,my=null,tLast=performance.now(),nextBlink=tLast+1800,nextLook=tLast+2500,nextPeek=tLast+5000,happyT=0,vis=true,raf=0;
    addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;wake()},{passive:true});
    document.addEventListener('pointerleave',function(){mx=null});
    function caret(){try{var r=inp.getBoundingClientRect(),c=getComputedStyle(inp);var m=caret.m||(caret.m=document.createElement('canvas').getContext('2d'));m.font=c.font;
      var w=m.measureText(inp.value.slice(0,inp.selectionStart||inp.value.length)).width;return {x:Math.min(r.right-10,r.left+parseFloat(c.paddingLeft)+w-inp.scrollLeft),y:r.top+r.height/2}}catch(e){return null}}
    function frame(now){raf=0;var dt=Math.min(.033,(now-tLast)/1000);tLast=now;
      var b=ch.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height*.6,tx=null,ty=null;
      if(up&&document.activeElement===inp){var k=caret();if(k){tx=k.x;ty=k.y}}else if(mx!==null){tx=mx;ty=my}
      if(tx!==null){var dx=tx-cx,dy=ty-cy,dd=Math.hypot(dx,dy)||1,m=Math.min(1,dd/260);LX.t=dx/dd*m;LY.t=dy/dd*m;ROT.t=Math.max(-1,Math.min(1,dx/600))*4}
      else if(now>nextLook){nextLook=now+1600+Math.random()*2600;LX.t=Math.random()<.5?(Math.random()*2-1):0;LY.t=Math.random()*.4-.2;ROT.t=LX.t*3}
      if(now>nextBlink){nextBlink=now+(Math.random()<.2?220:2200+Math.random()*3200);BL.x=.08;BL.v=0}
      if(!up&&now>nextPeek&&!rm){nextPeek=now+5000+Math.random()*4000;Y.v-=180}
      Y.t=up?0:HIDE();[Y,SX,ROT,LX,LY,BL].forEach(function(s){step(s,dt)});if(BL.x>1)BL.x=1;
      var y=Math.max(0,Y.x),clip=Math.max(0,y-1);
      ch.style.transform='translateY('+y.toFixed(2)+'px)';ch.style.clipPath='inset(0 0 '+clip.toFixed(2)+'px 0)';
      hd.style.transform='rotate('+ROT.x.toFixed(2)+'deg) scale('+(2-SX.x).toFixed(4)+','+SX.x.toFixed(4)+')';
      eyes.forEach(function(e,i){e.style.transform='translate('+(LX.x*2.2).toFixed(2)+'px,'+(LY.x*1.6).toFixed(2)+'px) scaleY('+Math.max(.08,BL.x).toFixed(3)+')'});
      pus.forEach(function(p){p.setAttribute('transform','translate('+(LX.x*1.2).toFixed(2)+','+(LY.x*1.2).toFixed(2)+')')});
      if(happyT&&now>happyT){happyT=0;ch.classList.remove('happy')}
      if(vis&&!document.hidden)raf=requestAnimationFrame(frame)}
    function wake(){if(!raf&&vis){tLast=performance.now();raf=requestAnimationFrame(frame)}}
    if('IntersectionObserver' in window)new IntersectionObserver(function(es){vis=es[0].isIntersecting;wake()}).observe(ch);
    document.addEventListener('visibilitychange',wake);wake();
    function pop(){if(up)return;up=true;Y.v-=140;SX.x=.82;SX.v=0;ch.classList.add('happy');happyT=performance.now()+700;wake()}
    function down(){if(!up||inp.value||document.activeElement===inp)return;up=false;SX.x=1.12;wake()}
    inp.addEventListener('focus',pop);inp.addEventListener('input',function(){if(!up)pop();wake()});inp.addEventListener('blur',function(){setTimeout(down,250)});
    inp.addEventListener('keyup',wake);inp.addEventListener('click',wake);
    ch.addEventListener('click',function(){inp.focus()});
    ch.addEventListener('pointerenter',function(){if(!up){Y.v-=120;wake()}});
    /* typewriter placeholder */
    var tt=0;window.__zqType=function(t){clearTimeout(tt);if(rm||inp.value){inp.setAttribute('placeholder',t);return}var i=0;
      (function step(){i++;inp.setAttribute('placeholder',t.slice(0,i)+(i<t.length?'|':''));if(i<t.length)tt=setTimeout(step,45)})()};
    /* invitation: until the bar has been used, a light sweeps across it every few seconds */
    var used=false,iv=0;function inv(){if(used||document.activeElement===inp)return;form.classList.remove('inv');void form.offsetWidth;form.classList.add('inv')}
    function startInv(){if(rm)return;setTimeout(inv,1600);iv=setInterval(inv,6500)}
    if(document.getElementById('hhL'))addEventListener('hh:loaded',startInv,{once:true});else startInv();
    inp.addEventListener('focus',function(){used=true;clearInterval(iv);form.classList.remove('inv')})}
  if(document.readyState==='complete')go();else addEventListener('load',go);
})();
</script><style id="ly-calm">
/* the headline is just text now: no style switching and no seeds when it is clicked */
html body [data-view="home"] .zq .zq-h{cursor:default!important}
</style>
<script>
(function(){
  function quiet(e){var t=e.target;if(!t||!t.closest)return;var zq=t.closest('[data-view="home"] .zq');if(!zq)return;
    if(t.closest('form,input,button,a,label,select,textarea,.zq-ch,.zq-pop,#zqRes,#zqSug,[role="button"]'))return;
    e.stopImmediatePropagation();if(e.type==='click')e.preventDefault()}
  ['pointerdown','mousedown','click','touchstart','dblclick'].forEach(function(k){window.addEventListener(k,quiet,{capture:true,passive:k!=='click'})});
  function go(){var h=document.querySelector('.zq-h');if(h){h.removeAttribute('title');h.setAttribute('data-f','kanit');h.removeAttribute('tabindex');h.removeAttribute('role')}}
  if(document.readyState==='complete')go();else addEventListener('load',go);
})();
</script>
