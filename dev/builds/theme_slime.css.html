<style id="slime-theme">
/* ===== Hamster Slime v4: brand hamster art only, glossy pre-rendered slime, clean credible cards ===== */
:root{
  --or:#F7A23E;--or-d:#C2600C;--or-l:#FFD7A3;--cream:#FFF3E3;--paper:#FFFAF3;--ink:#1D1712;--navy:#1D1712;--mute:#5E544B;--link:#B8560A;
  --card:0 1px 0 rgba(60,35,10,.05),0 24px 48px -30px rgba(60,35,10,.45);
}
html,body{background:var(--paper)}
[data-view="home"]>section:not(.zq):not(.h5f):not(.zc2){background-color:transparent!important}
.mc,.mc-in{background:transparent!important}
.mc-bg{color:rgba(247,162,62,.1)!important}
.nav{background:rgba(255,250,243,.9)!important;border-bottom-color:rgba(29,23,18,.07)!important}
.login{background:var(--ink)!important;color:#fff!important}
.login::before,.login::after{display:none!important}

/* ---------- hero: orange pad; glossy slime drips off its bottom edge ---------- */
.zq{margin:12px clamp(10px,1.4vw,18px) 0;border-radius:clamp(30px,3.4vw,48px);overflow:hidden;background:var(--or)!important}
.zq-sky{display:none!important}
.zq-q{color:rgba(29,23,18,.75)!important}
.zq-s{background:#fff!important;border:0!important;box-shadow:0 18px 36px -22px rgba(90,40,0,.75)!important}
.zq-go{background:var(--ink)!important;box-shadow:none!important}
.zq-pop{color:rgba(29,23,18,.75)!important}
.zq-pop button{background:rgba(255,255,255,.6)!important;border:0!important;color:var(--ink)!important}
.zq-pop button:hover{background:#fff!important}
.zq-more{color:var(--ink)!important;bottom:52px!important}.zq-more i{background:rgba(255,255,255,.7)!important}
.zq-sw .zq-ham,.zq-sw .zq-ham.up{width:96px!important}
.zq-sw .zq-spr,.zq-hb{width:96px!important}
.zq-ham.chew .zq-hb{animation:chew .2s ease-in-out 5}
@keyframes chew{50%{transform:scale(1.04,.95) translateY(2px)}}
.zq-ham.chew .ze{display:none}
.je{position:relative;z-index:6;height:0;pointer-events:none}
.je i{position:absolute;top:-34px;height:220px;background:url(img/fx-drip.webp) 0 0/960px 220px round no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%)}
.seed{position:absolute;z-index:8;width:15px;height:19px;margin:-9px 0 0 -7px;pointer-events:none}
.tip{position:absolute;z-index:9;left:50%;transform:translate(-50%,6px);white-space:nowrap;color:rgba(29,23,18,.7);font:600 .85rem var(--display);opacity:0;transition:opacity .4s,transform .4s;pointer-events:none}
.tip.on{opacity:1;transform:translate(-50%,0)}

/* ---------- cards: clean, soft shadow, glossy slime cap ---------- */
.cap{position:absolute;left:0;right:0;top:0;height:42px;z-index:3;pointer-events:none;background:url(img/fx-cap.webp) repeat-x var(--cx,0) 0/320px 42px;
  transform-origin:50% 0;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.cap.s{height:28px;background-image:url(img/fx-cap-s.webp);background-size:240px 28px}
.fx-main:hover .cap,.fx-s:hover .cap,.qv:hover .cap,.t-afo:hover .cap,.end-in:hover .cap,.oc-r:hover .cap{transform:scaleY(1.18)}
.qv-live,.qv-rc,.ft-live{z-index:4}
.fx{position:relative}
.fx-main{box-shadow:var(--card)!important;background:var(--ink)!important}
.fx-s{position:relative;overflow:hidden;background:#fff!important;border:0!important;box-shadow:var(--card)!important;transition:transform .25s cubic-bezier(.2,.9,.3,1),box-shadow .25s!important}
.fx-s:hover{transform:translateY(-3px)}
.fx-s,.fx-s .fx-sp,.fx-s .fx-pr{color:var(--ink)!important}.fx-s small{color:var(--mute)!important}
.rc{background:var(--or-l)!important;color:var(--ink)!important}
.zc2,.zc2.dk{margin:0 12px;border-radius:40px;background:var(--cream)!important}
.qv{background:#fff!important;border-radius:22px!important;box-shadow:var(--card)!important;overflow:hidden;transition:transform .25s cubic-bezier(.2,.9,.3,1)!important}
.qv:hover{transform:translateY(-3px)!important}
.qv-im{border-radius:0!important}
.qv-row{padding:12px 14px 0!important}.qv-meta{padding:0 14px 14px!important}
.qv-btn{background:var(--or)!important;color:var(--ink)!important;border:0!important}
.mr-p,.mr-n{background:#fff!important;border:0!important;color:var(--ink)!important;box-shadow:var(--card)!important}
.oc-m{position:relative;box-shadow:var(--card)!important}
.oc-k{color:var(--ink)!important;background:var(--or-l)!important}
.oc-st li{background:#fff!important;box-shadow:0 1px 0 rgba(60,35,10,.06),0 8px 18px -12px rgba(60,35,10,.4)}
.oc-st li::before{background:var(--or)!important;color:var(--ink)!important}
.mc h2 span{color:var(--or)!important;background:linear-gradient(180deg,#FFB24F,#E8841F)!important;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important}
.mc-u{background:#fff!important;box-shadow:var(--card)!important}
.mc-u button[aria-pressed="true"]{background:var(--or)!important;color:var(--ink)!important;box-shadow:none!important}
.mc-u button b{color:var(--or-d)!important}
.hg{position:relative}
.t-afo{background:var(--ink)!important}
.t-afo .t-k{color:var(--or)!important;padding-top:14px}
.cd>div{background:rgba(255,255,255,.08)!important;box-shadow:none!important}
.cd>div b{color:var(--or)!important}
.end,.nw2{content-visibility:visible!important;contain:none!important}
.end-in{position:relative;overflow:hidden;background:var(--ink)!important;border-radius:clamp(30px,3.4vw,48px)!important}
.end-in h2{color:#fff!important}.end-in p{color:rgba(255,255,255,.75)!important}

/* ---------- headings: soft marker under the words ---------- */
.ft-hd h2,.mr-l h2,.mr-l h3,.oc-hd h2,.nw2-h,.ct-h h1{position:relative;z-index:0;width:fit-content;isolation:isolate}
.ft-hd h2::before,.mr-l h2::before,.mr-l h3::before,.oc-hd h2::before,.nw2-h::before,.ct-h h1::before{content:"";position:absolute;z-index:-1;left:-.12em;right:-.14em;bottom:.08em;height:.36em;border-radius:.2em;background:var(--or-l)}

/* ---------- buttons ---------- */
.fx-cta,.fx-go,.tb1,.e1,.oc-lk,.lk{background:var(--or)!important;color:var(--ink)!important;border:0!important;border-radius:999px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 18px -10px rgba(150,70,0,.7)!important;font-weight:800!important;transition:transform .15s,box-shadow .15s!important}
.fx-cta:hover,.fx-go:hover,.tb1:hover,.e1:hover,.oc-lk:hover,.lk:hover,.fx-main:hover .fx-cta,.fx-s:hover .fx-go{transform:translateY(-2px)}
.fx-cta:active,.fx-go:active,.tb1:active,.e1:active,.oc-lk:active,.lk:active{transform:scale(.97)}
.tb2{border-radius:999px!important}
.mr-btn{color:var(--ink)!important;text-decoration:underline;text-decoration-color:var(--or);text-decoration-thickness:3px;text-underline-offset:5px}

/* ---------- Hall of Fame: glow fades out instead of stopping on a line ---------- */
.h5f-cap{fill:var(--paper)!important}
.h5f{overflow:clip!important;overflow-clip-margin:40px}
.h5f-rt.b polyline{filter:drop-shadow(0 0 3px #FFD36B) drop-shadow(0 0 9px rgba(255,190,70,.8))!important}
.rau.b canvas{-webkit-mask-image:linear-gradient(#000 30%,transparent 100%)!important;mask-image:linear-gradient(#000 30%,transparent 100%)!important}
.rau.t canvas{-webkit-mask-image:linear-gradient(transparent 0%,#000 70%)!important;mask-image:linear-gradient(transparent 0%,#000 70%)!important}
footer{background:var(--cream)!important}

@media (prefers-reduced-motion:reduce){.je i{background-image:url(img/fx-cap.webp)}}
@media (max-width:640px){.zq{margin:8px 8px 0}.zc2,.zc2.dk{margin:0 6px;border-radius:28px}.zq-sw .zq-ham,.zq-sw .zq-ham.up,.zq-sw .zq-spr,.zq-hb{width:72px!important}.je i{background-size:640px 147px;height:147px;top:-23px}}
</style>
<script>
(function(){
  var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* glossy slime: a strip under the hero, a cap on each card */
  function drip(zq){var r=parseFloat(getComputedStyle(zq).borderBottomLeftRadius)||40,m=parseFloat(getComputedStyle(zq).marginLeft)||0,
      b=document.createElement('div'),i=document.createElement('i');b.className='je';i.style.left=(m+r*.9)+'px';i.style.right=(m+r*.9)+'px';b.appendChild(i);zq.after(b)}
  function cap(box,small){if(!box||box.querySelector(':scope > .cap'))return;var c=document.createElement('i');c.className='cap'+(small?' s':'');c.setAttribute('aria-hidden','true');
      c.style.setProperty('--cx',-Math.round(Math.random()*300)+'px');box.insertBefore(c,box.firstChild)}

  /* the one hero hamster: tap empty space, a sunflower seed drops, the hamster comes to eat it */
  var busy=false,seeds=[],tip;
  function seedSvg(){var d=document.createElementNS('http://www.w3.org/2000/svg','svg');d.setAttribute('class','seed');d.setAttribute('viewBox','-8 -10 16 20');
    d.innerHTML='<path d="M0 -9C5 -9 7 -2 6 3C5 8 2 10 0 10C-2 10 -5 8 -6 3C-7 -2 -5 -9 0 -9Z" fill="#3A332D"/><path d="M-2 -6C-3 -1 -3 4 -1.5 8M2 -6C3 -1 3 4 1.5 8" stroke="#EDE6DA" stroke-width="1.3" fill="none" stroke-linecap="round"/>';return d}
  function feed(zq,cx,cy){
    var sw=zq.querySelector('.zq-sw'),form=zq.querySelector('.zq-s');if(!sw||!form||seeds.length>3)return;
    var r=sw.getBoundingClientRect(),sx=cx-r.left,sy=cy-r.top,tx=Math.max(40,Math.min(sw.clientWidth-40,sx)),ty=form.offsetTop-6,s=seedSvg();
    s.style.left=sx+'px';s.style.top=sy+'px';sw.appendChild(s);
    var dur=Math.max(420,Math.min(900,Math.sqrt(Math.abs(ty-sy))*42)),rot=(Math.random()<.5?-1:1)*(240+Math.random()*200);
    s.animate([{transform:'translate(0,0) rotate(0)'},{transform:'translate('+(tx-sx)+'px,'+(ty-sy)+'px) rotate('+rot+'deg)',offset:.8},{transform:'translate('+(tx-sx)+'px,'+(ty-sy-7)+'px) rotate('+(rot+20)+'deg)',offset:.9},{transform:'translate('+(tx-sx)+'px,'+(ty-sy)+'px) rotate('+(rot+30)+'deg)'}],{duration:dur,easing:'cubic-bezier(.45,0,.9,.6)',fill:'forwards'});
    seeds.push({el:s,x:tx});if(tip)tip.classList.remove('on');try{localStorage.setItem('hhFed','1')}catch(e){}
    setTimeout(next,dur+60);
  }
  function next(){
    if(busy||!seeds.length)return;var sd=seeds[0],h=document.getElementById('zqHam'),sw=h&&h.parentNode,img=h&&h.querySelector('img');if(!h)return;busy=true;
    var W=h.offsetWidth,right=Math.round(sw.clientWidth-sd.x-W/2),old=getComputedStyle(h).right;
    h.style.setProperty('transition','right .55s cubic-bezier(.5,0,.3,1),transform .45s cubic-bezier(.3,1.6,.5,1)','important');
    h.style.setProperty('right',right+'px','important');h.classList.add('up','watch');
    setTimeout(function(){
      sd.el.animate([{opacity:1},{opacity:0}],{duration:160,fill:'forwards'});setTimeout(function(){sd.el.remove()},180);seeds.shift();
      if(img){img.dataset.src=img.dataset.src||img.getAttribute('src');img.src='img/ham-happy.webp'}h.classList.add('chew');
      setTimeout(function(){h.classList.remove('chew');if(img)img.src=img.dataset.src;h.classList.remove('watch');busy=false;if(seeds.length)next();
        else setTimeout(function(){if(!busy){h.style.setProperty('right',old,'important')}},1800)},1100);
    },600);
  }

  function build(){
    var home=document.querySelector('[data-view="home"]'),zq=home&&home.querySelector('.zq');
    if(!zq||!zq.offsetWidth)return;
    document.querySelectorAll('.je').forEach(function(n){n.remove()});drip(zq);
    cap(home.querySelector('.fx-main'));home.querySelectorAll('.fx-row .fx-s').forEach(function(c){cap(c,1)});
    home.querySelectorAll('.oc-m').forEach(function(c){cap(c)});cap(home.querySelector('.t-afo'));cap(home.querySelector('.end-in'));
    function rails(){home.querySelectorAll('#zqC .qv,#zqN .qv').forEach(function(q){cap(q,1)})}
    rails();['zqC','zqN'].forEach(function(id){var c=document.getElementById(id);if(c&&!c._mo){c._mo=new MutationObserver(function(){setTimeout(rails,30)});c._mo.observe(c,{childList:true,subtree:true})}});
    var top=zq.querySelector('.zq-top');
    if(top&&!tip&&!rm){var f=0;try{f=localStorage.getItem('hhFed')}catch(e){}
      if(!f){tip=document.createElement('p');tip.className='tip';tip.textContent='แตะที่ว่างบนพื้นสีส้ม เพื่อป้อนเมล็ดทานตะวันให้น้องแฮมสเตอร์';top.appendChild(tip);
        tip.style.position='relative';tip.style.marginTop='18px';setTimeout(function(){tip.classList.add('on')},2400)}}
  }
  if(!rm)document.addEventListener('pointerdown',function(e){var zq=e.target.closest&&e.target.closest('[data-view="home"] .zq');
    if(zq&&!e.target.closest('form,button,a,input,h1,.zq-res,.zq-sug,.zq-pop'))feed(zq,e.clientX,e.clientY)});
  addEventListener('hashchange',function(){setTimeout(build,450)});
  var rt,lw=innerWidth;addEventListener('resize',function(){if(innerWidth===lw)return;lw=innerWidth;clearTimeout(rt);rt=setTimeout(build,250)});
  if(document.readyState==='complete')setTimeout(build,60);else addEventListener('load',function(){setTimeout(build,60)});
})();
</script>
