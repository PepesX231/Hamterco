<div id="hhL" role="status" aria-live="polite"><style>
html.hl-on{overflow:hidden}
#hhL{position:fixed;inset:0;z-index:2147483000;background:#FFF6E8;display:grid;place-items:center;font-family:Anuphan,'Noto Sans Thai',system-ui,sans-serif;color:#1D1712;cursor:pointer}
#hhL .hl-in{width:min(600px,84vw);text-align:center}
#hhL .hl-tr{position:relative;height:190px;margin:0 0 20px}
#hhL .hl-tr::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:3px;border-radius:3px;background:repeating-linear-gradient(90deg,#E6CFAF 0 10px,transparent 10px 18px)}
#hhL .hl-home{position:absolute;right:-4px;bottom:7px;width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 10px 20px -10px rgba(29,23,18,.4),0 0 0 4px #FFF6E8;z-index:1}
#hhL .hl-ham{position:absolute;left:0;bottom:9px;width:clamp(96px,10vw,128px);height:auto;transform-origin:50% 100%;animation:hlWalk .4s ease-in-out infinite alternate;z-index:2}
#hhL .hl-ham.up{animation:hlHop .5s cubic-bezier(.3,1.6,.5,1) both}
#hhL .hl-sd{position:absolute;bottom:9px;width:9px;height:14px;border-radius:50% 50% 46% 46%/62% 62% 38% 38%;background:linear-gradient(90deg,#3A2A1E 0 34%,#F1DFC2 34% 66%,#3A2A1E 66%);box-shadow:0 0 0 1.5px #3A2A1E;animation:hlPop .35s cubic-bezier(.3,1.8,.5,1) both}
#hhL .hl-pc{margin:0;font:800 clamp(2.8rem,4.5vw,3.6rem)/1 Anuphan,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#hhL .hl-pc small{font-size:.5em;margin-left:2px;color:#B85F14}
#hhL .hl-t{margin:10px 0 0;font-size:.98rem;color:rgba(29,23,18,.62)}
@keyframes hlWalk{0%{transform:translateY(0) rotate(-5deg)}100%{transform:translateY(-8px) rotate(5deg)}}
@keyframes hlHop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-26px) scale(1.04)}100%{transform:translateY(0) scale(1)}}
@keyframes hlPop{from{transform:scale(0) rotate(var(--r,0deg))}to{transform:scale(1) rotate(var(--r,0deg))}}
@media (prefers-reduced-motion:reduce){#hhL .hl-ham,#hhL .hl-sd{animation:none}}
</style><div class="hl-in"><div class="hl-tr"><img class="hl-home" src="img/logo.webp" alt=""><img class="hl-ham" src="img/ld-walk.webp" alt=""></div><p class="hl-pc"><b>0</b><small>%</small></p><p class="hl-t">กำลังพาไปที่ Hamster Hub</p></div><script>
(function(){var L=document.getElementById('hhL');if(!L)return;var H=document.documentElement;H.classList.add('hl-on');
  var rm=matchMedia('(prefers-reduced-motion: reduce)').matches,t0=Date.now(),fast=false;try{fast=sessionStorage.getItem('hhl')==='1';sessionStorage.setItem('hhl','1')}catch(e){}
  var MIN=fast?350:1400,tg=.1,cur=0,loaded=false,ended=false,seeds=0,tr=L.querySelector('.hl-tr'),ham=L.querySelector('.hl-ham'),home=L.querySelector('.hl-home'),pc=L.querySelector('.hl-pc b');
  addEventListener('load',function(){loaded=true});setTimeout(function(){loaded=true},8000);
  L.addEventListener('click',function(){loaded=true;MIN=0});
  function target(){if(loaded)return 1;if(document.readyState==='loading')return .3;var im=document.images,n=0,c=0;for(var i=0;i<im.length;i++){if(im[i].loading==='lazy')continue;n++;if(im[i].complete)c++}return .45+.5*(n?c/n:1)}
  function frame(){if(ended)return;tg=Math.max(tg,target());cur+=Math.max(0,(tg-cur))*(fast?.3:.07)+(cur<tg?.002:0);if(cur>tg)cur=tg;
    var W=tr.clientWidth,hw=ham.offsetWidth,x=cur*(W-hw-30);ham.style.left=x+'px';pc.textContent=Math.round(cur*100);
    while(seeds<Math.floor(cur*12)){seeds++;var s=document.createElement('i');s.className='hl-sd';s.style.left=(x-6-Math.random()*10)+'px';s.style.setProperty('--r',(Math.random()*80-40)+'deg');tr.insertBefore(s,ham)}
    if(cur>.995&&loaded&&Date.now()-t0>=MIN){ended=true;pc.textContent='100';finish();return}
    requestAnimationFrame(frame)}
  function finish(){ham.classList.add('up');
    setTimeout(function(){var r=home.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=Math.hypot(Math.max(cx,innerWidth-cx),Math.max(cy,innerHeight-cy))+20,s=performance.now(),D=rm?1:700;
      (function iris(t){var k=Math.min(1,(t-s)/D),e=k*k*(3-2*k),rad=e*R,m='radial-gradient(circle at '+cx+'px '+cy+'px, transparent '+rad+'px, #000 '+(rad+1)+'px)';
        L.style.webkitMaskImage=m;L.style.maskImage=m;if(k<1)requestAnimationFrame(iris);else{L.remove();H.classList.remove('hl-on');dispatchEvent(new Event('hh:loaded'))}})(s)},rm?0:480)}
  requestAnimationFrame(frame)})();
</script></div>
